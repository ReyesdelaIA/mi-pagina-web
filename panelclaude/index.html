<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Panel · Portal Claude · Reyes IA</title>
  <link rel="icon" type="image/png" href="/icon%20reyes%20IA.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    :root {
      --naranjo:#F0A46A; --naranjo-hondo:#D66E36;
      --azul:#8FBEEC; --azul-hondo:#4C82C4;
      --verde:#5FD6A4; --texto:#F4F5F7;
      --tenue:rgba(233,234,238,.55); --debil:rgba(233,234,238,.36);
      --linea:rgba(255,255,255,.08);
    }
    body {
      font-family:'Space Grotesk',Helvetica,sans-serif; color:var(--texto);
      background:
        radial-gradient(1100px 620px at 12% -8%, rgba(214,110,54,.18), transparent 60%),
        radial-gradient(900px 520px at 88% 2%, rgba(70,110,160,.15), transparent 62%),
        linear-gradient(180deg,#0A0D12 0%, #07090C 45%, #06080B 100%);
      background-attachment:fixed; min-height:100vh;
    }
    .mono { font-family:'IBM Plex Mono',monospace; text-transform:uppercase; letter-spacing:.18em; }

    nav {
      display:flex; align-items:center; justify-content:space-between;
      padding:14px 32px; border-bottom:1px solid var(--linea); backdrop-filter:blur(12px);
    }
    nav img { height:24px; object-fit:contain; display:block; }
    nav .tag { font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.2em;
      text-transform:uppercase; color:var(--debil); }

    .wrap { max-width:1180px; margin:0 auto; padding:26px 32px 70px; }

    /* ---------- Login ---------- */
    .login {
      max-width:380px; margin:90px auto; border:1px solid rgba(255,255,255,.10); border-radius:22px;
      padding:32px 28px; background:linear-gradient(160deg, rgba(255,255,255,.06), rgba(255,255,255,.015));
      backdrop-filter:blur(14px);
    }
    .login h1 { font-size:20px; font-weight:600; margin-bottom:7px; letter-spacing:-.01em; }
    .login p { font-size:13px; color:var(--tenue); margin-bottom:22px; line-height:1.55; }
    .login input {
      width:100%; border:1px solid rgba(255,255,255,.14); border-radius:11px; padding:13px 15px;
      font-size:14px; font-family:inherit; background:rgba(0,0,0,.25); color:var(--texto);
      outline:none; margin-bottom:13px;
    }
    .login input:focus { border-color:var(--naranjo); }
    .login button {
      width:100%; border:none; border-radius:12px; padding:14px; font-size:14.5px; font-weight:600;
      font-family:inherit; cursor:pointer; color:#160B04;
      background:linear-gradient(100deg,var(--naranjo),var(--naranjo-hondo));
    }
    .login .err { font-size:12.5px; color:#FCA5A5; margin-top:12px; display:none; line-height:1.5; }
    .login .err.show { display:block; }

    /* ---------- Cabecera ---------- */
    .head { display:flex; align-items:flex-end; justify-content:space-between; gap:20px; flex-wrap:wrap; margin-bottom:22px; }
    .head h1 { font-size:27px; font-weight:500; letter-spacing:-.025em; }
    .head h1 span { background:linear-gradient(100deg,var(--naranjo),var(--naranjo-hondo) 60%,#E9C9A8);
      -webkit-background-clip:text; background-clip:text; color:transparent; }
    .head .sub { font-size:13px; color:var(--tenue); margin-top:5px; }

    .selector { display:flex; align-items:center; gap:9px; flex-wrap:wrap; }
    select {
      font-family:inherit; font-size:14px; font-weight:500; color:var(--texto);
      background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.14);
      border-radius:12px; padding:11px 16px; min-width:250px; cursor:pointer; outline:none;
      appearance:none;
      background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%23999' stroke-width='1.6' fill='none' stroke-linecap='round'/></svg>");
      background-repeat:no-repeat; background-position:right 15px center; padding-right:40px;
    }
    select:focus { border-color:var(--naranjo); }
    select option { background:#12161D; color:var(--texto); }
    .mini {
      font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.12em; text-transform:uppercase;
      color:var(--debil); background:rgba(255,255,255,.04); border:1px solid var(--linea);
      border-radius:9px; padding:9px 12px; cursor:pointer; transition:all .2s;
    }
    .mini:hover { color:var(--texto); border-color:rgba(255,255,255,.22); }

    /* ---------- Tarjetas base ---------- */
    .card {
      border:1px solid rgba(255,255,255,.09); border-radius:20px; padding:22px 24px;
      background:linear-gradient(160deg, rgba(255,255,255,.05), rgba(255,255,255,.014));
    }
    .card-t { font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.2em;
      text-transform:uppercase; color:var(--debil); margin-bottom:18px; }

    /* ---------- KPIs ---------- */
    .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(165px,1fr)); gap:14px; margin-bottom:16px; }
    .kpi { border:1px solid rgba(255,255,255,.09); border-radius:18px; padding:18px 20px;
      background:linear-gradient(160deg, rgba(255,255,255,.05), rgba(255,255,255,.014)); }
    .kpi-v { font-size:34px; font-weight:600; line-height:1; letter-spacing:-.02em; }
    .kpi-v.n { color:var(--naranjo); }
    .kpi-l { font-family:'IBM Plex Mono',monospace; font-size:9.5px; letter-spacing:.16em;
      text-transform:uppercase; color:var(--debil); margin-top:9px; }
    .kpi-d { font-size:11.5px; color:var(--tenue); margin-top:6px; }
    .kpi-d.up { color:var(--verde); }
    .kpi-d.down { color:#F0A08A; }

    /* ---------- Embudo ---------- */
    .duo { display:grid; grid-template-columns:minmax(0,1.5fr) minmax(0,1fr); gap:16px; margin-bottom:16px; }
    .fun-row { margin-bottom:15px; }
    .fun-row:last-child { margin-bottom:0; }
    .fun-top { display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:6px; }
    .fun-lbl { font-size:13.5px; color:var(--texto); font-weight:500; }
    .fun-lbl b { font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--debil);
      font-weight:400; margin-right:9px; }
    .fun-n { font-size:13px; color:var(--tenue); white-space:nowrap; }
    .fun-n b { color:var(--texto); font-weight:600; font-size:15px; }
    .fun-bg { height:26px; border-radius:8px; background:rgba(255,255,255,.045); overflow:hidden; }
    .fun-fl { height:100%; border-radius:8px; transition:width .9s cubic-bezier(.3,1,.4,1);
      background:linear-gradient(90deg,var(--naranjo-hondo),var(--naranjo)); }
    .fun-fl.done { background:linear-gradient(90deg,#3C9E76,var(--verde)); }
    /* Cuánta gente se pierde entre una etapa y la siguiente */
    .fun-caida { display:flex; align-items:center; gap:7px; margin:7px 0 0 2px;
      font-size:11.5px; color:var(--debil); }
    .fun-caida i { width:1px; height:11px; background:rgba(255,255,255,.16); display:block; }
    .fun-caida.mala { color:#F0A08A; }

    /* ---------- Dona ---------- */
    .dona-wrap { display:flex; flex-direction:column; align-items:center; gap:18px; }
    .dona { position:relative; width:172px; height:172px; }
    .dona svg { width:100%; height:100%; transform:rotate(-90deg); }
    .dona circle { fill:none; stroke-width:17; }
    .dona-c { position:absolute; inset:0; display:flex; flex-direction:column;
      align-items:center; justify-content:center; }
    .dona-n { font-size:32px; font-weight:600; line-height:1; }
    .dona-l { font-family:'IBM Plex Mono',monospace; font-size:9px; letter-spacing:.14em;
      text-transform:uppercase; color:var(--debil); margin-top:5px; }
    .leyenda { width:100%; display:flex; flex-direction:column; gap:9px; }
    .leg { display:flex; align-items:center; gap:9px; font-size:13px; }
    .leg i { width:9px; height:9px; border-radius:3px; flex-shrink:0; }
    .leg span { flex:1; color:var(--tenue); }
    .leg b { font-weight:600; }

    /* ---------- Sesiones ---------- */
    .sesiones { display:grid; grid-template-columns:repeat(auto-fit,minmax(275px,1fr)); gap:16px; margin-bottom:16px; }
    .ses-h { display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:16px; }
    .ses-t { font-size:15px; font-weight:600; }
    .ses-p { font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--naranjo); }
    .bar-row { margin-bottom:11px; }
    .bar-lbl { display:flex; justify-content:space-between; gap:10px; font-size:12px;
      color:var(--tenue); margin-bottom:5px; }
    .bar-lbl span:last-child { color:var(--debil); white-space:nowrap; font-family:'IBM Plex Mono',monospace; font-size:10.5px; }
    .bar-bg { height:6px; background:rgba(255,255,255,.06); border-radius:99px; overflow:hidden; }
    .bar-fl { height:100%; border-radius:99px; transition:width .7s ease;
      background:linear-gradient(90deg,var(--naranjo-hondo),var(--naranjo)); }
    .bar-fl.alt { background:linear-gradient(90deg,var(--azul-hondo),var(--azul)); }
    .ses-q { font-size:12px; color:var(--tenue); margin-top:14px; padding-top:12px; border-top:1px solid var(--linea); }
    .ses-q b { color:var(--texto); font-size:14px; font-weight:600; }

    /* ---------- Ranking de empresas ---------- */
    .rank-row { display:grid; grid-template-columns:minmax(0,1fr) 62px; gap:14px;
      align-items:center; margin-bottom:13px; cursor:pointer; }
    .rank-row:hover .rank-n { color:var(--naranjo); }
    .rank-n { font-size:13.5px; margin-bottom:5px; transition:color .2s; }
    .rank-n em { font-style:normal; color:var(--debil); font-size:11.5px; margin-left:7px; }
    .rank-pct { font-family:'IBM Plex Mono',monospace; font-size:13px; text-align:right; color:var(--texto); }

    /* ---------- Tabla ---------- */
    .tbl-wrap { border:1px solid rgba(255,255,255,.09); border-radius:20px; overflow:hidden;
      background:rgba(255,255,255,.022); }
    .tbl-scroll { overflow-x:auto; }
    table { width:100%; border-collapse:collapse; font-size:13px; min-width:680px; }
    th { text-align:left; font-family:'IBM Plex Mono',monospace; font-size:9.5px; letter-spacing:.14em;
      text-transform:uppercase; color:var(--debil); font-weight:400; padding:14px 16px;
      border-bottom:1px solid var(--linea); white-space:nowrap; background:rgba(255,255,255,.02); }
    td { padding:13px 16px; border-bottom:1px solid rgba(255,255,255,.05); vertical-align:middle; }
    tr:last-child td { border-bottom:none; }
    tr:hover td { background:rgba(255,255,255,.022); }
    .p-n { font-weight:600; }
    .p-m { font-size:11.5px; color:var(--debil); margin-top:2px; }
    .tgrp { display:flex; gap:11px; }
    .tg { display:flex; flex-direction:column; align-items:center; gap:5px; }
    .dot { width:9px; height:9px; border-radius:50%; background:rgba(255,255,255,.12); }
    .dot.on { background:var(--naranjo); box-shadow:0 0 8px rgba(240,164,106,.55); }
    .dot.half { background:linear-gradient(90deg,var(--naranjo) 50%,rgba(255,255,255,.12) 50%); }
    .tg-n { font-family:'IBM Plex Mono',monospace; font-size:9px; color:var(--debil); }
    .stars { white-space:nowrap; font-size:13px; }
    .vacio { text-align:center; padding:50px 20px; color:var(--debil); font-size:13.5px; }

    .sec { font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.2em;
      text-transform:uppercase; color:var(--debil); margin:28px 0 13px;
      display:flex; align-items:center; gap:14px; }
    .sec i { flex:1; height:1px; background:linear-gradient(90deg, var(--linea), transparent); }

    @media(max-width:900px){
      .duo { grid-template-columns:1fr; }
      .wrap, nav { padding-left:20px; padding-right:20px; }
      .head h1 { font-size:23px; }
      select { min-width:0; width:100%; }
      .selector { width:100%; }
    }
  </style>
</head>
<body>

<nav>
  <img src="/logo reyes IA horizontal blanco.png" alt="Reyes IA" />
  <span class="tag">Panel interno</span>
</nav>

<div class="login" id="login">
  <h1>Panel Portal Claude</h1>
  <p>Avance de los participantes del taller inicial y las 3 sesiones.</p>
  <input type="password" id="pw" placeholder="Contraseña" autocomplete="current-password" />
  <button onclick="entrar()">Entrar</button>
  <div class="err" id="login-err"></div>
</div>

<div class="wrap" id="panel" style="display:none;">
  <div class="head">
    <div>
      <h1>Programa <span>Claude</span></h1>
      <div class="sub" id="sub">—</div>
    </div>
    <div class="selector">
      <select id="sel-empresa" onchange="setFiltro(this.value)"></select>
      <button class="mini" id="btn-agrupar" onclick="toggleAgrupar()"></button>
    </div>
  </div>

  <div id="avisos"></div>
  <div class="kpis" id="kpis"></div>

  <div class="duo">
    <div class="card">
      <div class="card-t" id="fun-t">Recorrido del programa</div>
      <div id="embudo"></div>
    </div>
    <div class="card">
      <div class="card-t">En qué van</div>
      <div class="dona-wrap">
        <div class="dona" id="dona"></div>
        <div class="leyenda" id="leyenda"></div>
      </div>
    </div>
  </div>

  <div class="sec">Detalle por sesión <i></i></div>
  <div class="sesiones" id="sesiones"></div>

  <div id="bloque-ranking"></div>

  <div class="sec">Participantes <i></i></div>
  <div class="tbl-wrap">
    <div class="tbl-scroll">
      <table>
        <thead>
          <tr>
            <th>Participante</th><th>Empresa</th>
            <th>Sesión 1</th><th>Sesión 2</th><th>Sesión 3</th>
            <th>⭐</th><th>Quiz</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- El temario sale de portal.js, que es la fuente de verdad. Antes el panel
     tenía su propia copia y quedó desfasada, midiendo mal el avance.
     OJO: al sacar una edición nueva del portal, apuntar esta ruta a la
     carpeta de esa edición. El panel no se versiona; el portal sí. -->
<script src="/claude-jul26-k7x9/portal.js"></script>
<script>
  const CONCEPTOS = Object.fromEntries(TALLERES.map(t => [t.n, t.conceptos]));
  const NS = TALLERES.map(t => t.n);
  const NOMBRES = {};

  let PART = [], PROG = [], filtro = '__all__', agrupar = true;

  const pasosPrograma = () => TALLERES.reduce((a,t) => a + t.conceptos.length + 2, 0);
  const TIPOS_AVANCE = new Set(['concepto','quiz','desafio']);
  const nom = id => NOMBRES[id] || id;
  const pct = (n, de) => de ? Math.round(n / de * 100) : 0;

  async function cargarNombres(){
    const ids = [...new Set(NS.flatMap(t => CONCEPTOS[t]))];
    await Promise.all(ids.map(async id => {
      try {
        const r = await fetch(`/bloques/${id}/meta.json`);
        if (r.ok){ const m = await r.json(); NOMBRES[id] = `${m.emoji} ${m.habilidad || m.nombre}`; }
      } catch (e) { /* cae al id */ }
    }));
  }

  async function entrar(){
    const pw = document.getElementById('pw').value;
    const err = document.getElementById('login-err');
    err.classList.remove('show');
    if (!pw) { err.textContent = 'Escribe la contraseña.'; err.classList.add('show'); return; }
    try {
      const r = await fetch('/api/claude-panel', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ password: pw })
      });
      const data = await r.json();
      if (!r.ok) {
        // El detalle importa para saber si falla la clave, la tabla o la red
        err.textContent = (data.error || 'No se pudo entrar.') + (data.detail ? ` — ${data.detail}` : '');
        err.classList.add('show'); return;
      }
      PART = data.participantes || [];
      PROG = data.progreso || [];
      await cargarNombres();
      document.getElementById('login').style.display = 'none';
      document.getElementById('panel').style.display = 'block';
      render();
    } catch (e) {
      err.textContent = 'Error de conexión. Intenta de nuevo.';
      err.classList.add('show');
    }
  }
  document.getElementById('pw').addEventListener('keydown', e => { if (e.key === 'Enter') entrar(); });

  /* ---------------- Índice de progreso ---------------- */
  function indexar(){
    const idx = {};
    PROG.forEach(p => {
      idx[p.participante_id] = idx[p.participante_id] || {};
      const t = idx[p.participante_id][p.taller] = idx[p.participante_id][p.taller]
        || { conceptos:new Set(), ejercicios:new Set() };
      if (p.tipo === 'concepto')       t.conceptos.add(p.concepto);
      else if (p.tipo === 'ejercicio') t.ejercicios.add(p.concepto);
      else t[p.tipo] = p;
    });
    return idx;
  }
  const empezoTaller = (idx, p, t) => {
    const d = idx[p.id]?.[t]; if (!d) return false;
    return !!(d.quiz || d.desafio || d.conceptos.size || d.ejercicios.size);
  };
  const dominoTaller = (idx, p, t) =>
    !!(idx[p.id]?.[t]?.quiz && idx[p.id]?.[t]?.desafio &&
       (idx[p.id]?.[t]?.conceptos?.size || 0) === CONCEPTOS[t].length);

  /* ---------------- Agrupación de empresas ----------------
     Cada persona escribe la empresa a mano, así que la misma llega como
     «Copec», «Copec SA» o «Empresas Copec». Se normaliza para juntarlas. */
  const RUIDO = new Set([
    'sa','s','a','spa','sac','srl','ltda','limitada','ltd','inc','corp','corporacion',
    'cia','compania','sociedad','eirl','llc','group','grupo','holding','empresa','empresas',
    'comercial','servicios','consultora','consultores','de','del','la','el','los','las','y'
  ]);
  function claveEmpresa(nombre){
    const base = String(nombre || '').toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')   // Peñuelas = Penuelas
      .replace(/[^a-z0-9\s]/g, ' ').split(/\s+/).filter(Boolean);
    const utiles = base.filter(w => !RUIDO.has(w));
    return (utiles.length ? utiles : base).join(' ') || 'sin-empresa';
  }

  // Uniones que decide Felipe, para lo que la máquina no puede saber sola
  let ALIAS = {};
  try { ALIAS = JSON.parse(localStorage.getItem('claude_panel_alias')) || {}; } catch (e) { ALIAS = {}; }
  const guardarAlias = () => localStorage.setItem('claude_panel_alias', JSON.stringify(ALIAS));
  const grupoDe = p => agrupar ? (ALIAS[claveEmpresa(p.empresa)] || claveEmpresa(p.empresa)) : p.empresa_slug;

  function empresas(idx){
    const m = new Map();
    PART.forEach(p => {
      const k = grupoDe(p);
      const cur = m.get(k) || { slug:k, variantes:new Map(), gente:[] };
      cur.gente.push(p);
      cur.variantes.set(p.empresa, (cur.variantes.get(p.empresa) || 0) + 1);
      m.set(k, cur);
    });
    return [...m.values()].map(e => {
      const vs = [...e.variantes.entries()].sort((a,b) => b[1]-a[1] || a[0].length-b[0].length);
      return { ...e, n:e.gente.length, nombre:vs[0][0], variantes:vs.map(v => v[0]),
               avance: avanceDe(e.gente) };
    }).sort((a,b) => b.n - a.n || b.avance - a.avance);
  }

  function avanceDe(gente){
    if (!gente.length) return 0;
    const ids = new Set(gente.map(p => p.id));
    const hechos = PROG.filter(g => ids.has(g.participante_id) && TIPOS_AVANCE.has(g.tipo)).length;
    return pct(hechos, gente.length * pasosPrograma());
  }

  function sugerencias(emps){
    const out = [], palabras = e => new Set(e.slug.split(' ').filter(w => w.length >= 5));
    for (let i=0;i<emps.length;i++) for (let j=i+1;j<emps.length;j++){
      const pa = palabras(emps[i]), pb = palabras(emps[j]);
      if ([...pa].some(w => pb.has(w))) out.push([emps[i], emps[j]]);
    }
    return out.slice(0, 5);
  }
  function unirPorSlug(a, b){
    const emps = empresas(indexar());
    const ea = emps.find(e => e.slug === a), eb = emps.find(e => e.slug === b);
    if (!ea || !eb) return;
    const [dest, src] = ea.n >= eb.n ? [ea, eb] : [eb, ea];
    ALIAS[src.slug] = dest.slug;
    Object.keys(ALIAS).forEach(k => { if (ALIAS[k] === src.slug) ALIAS[k] = dest.slug; });
    guardarAlias(); filtro = '__all__'; render();
  }
  function separarTodo(){ ALIAS = {}; guardarAlias(); filtro = '__all__'; render(); }
  function toggleAgrupar(){ agrupar = !agrupar; filtro = '__all__'; render(); }
  function setFiltro(f){ filtro = f; render(); }

  const visibles = () => filtro === '__all__' ? PART : PART.filter(p => grupoDe(p) === filtro);

  /* ---------------- Embudo ----------------
     La pregunta real es dónde se cae la gente: cuántos entran, cuántos
     empiezan de verdad y cuántos llegan al final de cada sesión. */
  function etapas(idx, gente){
    // Solo los hitos que importan: entrar y terminar cada sesión. «Empezaron
    // la sesión N» sobraba: en la práctica coincide con haber terminado la
    // anterior, porque la siguiente se abre al completarla.
    return [{ lbl:'Se registraron', n:gente.length, tipo:'base' }].concat(
      NS.map(t => ({
        lbl: `Completaron la sesión ${t}`,
        n: gente.filter(p => dominoTaller(idx,p,t)).length,
        tipo: 'domino'
      }))
    );
  }

  function pintarEmbudo(idx, gente){
    const et = etapas(idx, gente);
    const tope = et[0].n || 1;
    document.getElementById('embudo').innerHTML = et.map((e, i) => {
      const ancho = pct(e.n, tope);
      const prev = i ? et[i-1] : null;
      // Solo interesa la caída cuando de verdad se pierde gente
      const caida = prev && prev.n > e.n ? prev.n - e.n : 0;
      const conv  = prev ? pct(e.n, prev.n) : 100;
      return `
      ${caida ? `<div class="fun-caida ${conv < 50 ? 'mala' : ''}"><i></i>−${caida} · pasa el ${conv}%</div>` : ''}
      <div class="fun-row">
        <div class="fun-top">
          <span class="fun-lbl">${esc(e.lbl)}</span>
          <span class="fun-n"><b>${e.n}</b> · ${ancho}%</span>
        </div>
        <div class="fun-bg"><div class="fun-fl ${e.tipo==='domino'?'done':''}" style="width:${ancho}%"></div></div>
      </div>`;
    }).join('');
  }

  /* ---------------- Dona ---------------- */
  function pintarDona(idx, gente){
    const total = gente.length;
    const completos = gente.filter(p => NS.every(t => dominoTaller(idx,p,t))).length;
    const sinEmpezar = gente.filter(p => !NS.some(t => empezoTaller(idx,p,t))).length;
    const enCurso = total - completos - sinEmpezar;

    const partes = [
      { lbl:'Programa completo', n:completos,  c:'#5FD6A4' },
      { lbl:'En curso',          n:enCurso,    c:'#F0A46A' },
      { lbl:'Sin empezar',       n:sinEmpezar, c:'rgba(255,255,255,.16)' },
    ];
    const R = 74, C = 2 * Math.PI * R;
    let off = 0;
    const arcos = partes.filter(p => p.n).map(p => {
      const largo = (p.n / (total || 1)) * C;
      const el = `<circle cx="86" cy="86" r="${R}" stroke="${p.c}"
        stroke-dasharray="${largo} ${C - largo}" stroke-dashoffset="${-off}" stroke-linecap="butt"></circle>`;
      off += largo; return el;
    }).join('');

    document.getElementById('dona').innerHTML = `
      <svg viewBox="0 0 172 172">
        <circle cx="86" cy="86" r="${R}" stroke="rgba(255,255,255,.05)"></circle>
        ${arcos}
      </svg>
      <div class="dona-c">
        <div class="dona-n">${total ? pct(completos, total) : 0}%</div>
        <div class="dona-l">completo</div>
      </div>`;
    document.getElementById('leyenda').innerHTML = partes.map(p => `
      <div class="leg"><i style="background:${p.c}"></i><span>${p.lbl}</span><b>${p.n}</b></div>`).join('');
  }

  /* ---------------- Render ---------------- */
  function render(){
    const idx = indexar();
    const emps = empresas(idx);
    const vis = visibles();
    const esFiltro = filtro !== '__all__';
    const actual = emps.find(e => e.slug === filtro);

    // Selector de empresa
    const sel = document.getElementById('sel-empresa');
    sel.innerHTML = [`<option value="__all__">Todas las empresas · ${PART.length} participantes</option>`]
      .concat(emps.map(e => {
        const v = e.variantes.length > 1 ? ` (${e.variantes.length} formas)` : '';
        return `<option value="${esc(e.slug)}"${filtro===e.slug?' selected':''}>${esc(e.nombre)} · ${e.n}${v}</option>`;
      })).join('');
    document.getElementById('btn-agrupar').textContent = agrupar ? '⛓ Agrupadas' : '⛓‍💥 Sin agrupar';

    const formas = new Set(PART.map(p => p.empresa)).size;
    document.getElementById('sub').innerHTML = esFiltro
      ? `${vis.length} participante${vis.length===1?'':'s'} · ${esc(actual?.nombre || '')}`
        + (actual && actual.variantes.length > 1 ? ` <span style="color:var(--debil)">— escrita como ${actual.variantes.map(esc).join(', ')}</span>` : '')
      : `${PART.length} participantes · ${emps.length} empresas`
        + (agrupar && formas > emps.length ? ` <span style="color:var(--debil)">— agrupadas desde ${formas} formas de escribirlas</span>` : '');

    // Avisos de posible unión
    const sug = agrupar && !esFiltro ? sugerencias(emps) : [];
    const hayAlias = Object.keys(ALIAS).length > 0;
    document.getElementById('avisos').innerHTML = (!sug.length && !hayAlias) ? '' : `
      <div class="card" style="padding:14px 18px; margin-bottom:16px; display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
        <span class="card-t" style="margin:0">${sug.length ? '¿Son la misma empresa?' : 'Uniones aplicadas'}</span>
        ${sug.map(([a,b]) => `<button class="mini" style="text-transform:none; letter-spacing:0; font-size:12px; font-family:'Space Grotesk',sans-serif"
            onclick="unirPorSlug('${esc(a.slug)}','${esc(b.slug)}')">${esc(a.nombre)} + ${esc(b.nombre)} → unir</button>`).join('')}
        ${hayAlias ? `<button class="mini" style="text-transform:none; letter-spacing:0; font-size:12px" onclick="separarTodo()">deshacer uniones</button>` : ''}
      </div>`;

    // KPIs
    const completos = vis.filter(p => NS.every(t => dominoTaller(idx,p,t))).length;
    const activos   = vis.filter(p => NS.some(t => empezoTaller(idx,p,t))).length;
    const avance    = avanceDe(vis);
    const visIds    = new Set(vis.map(p => p.id));
    const míos      = PROG.filter(g => visIds.has(g.participante_id));
    const quizzes   = míos.filter(g => g.tipo === 'quiz' && g.quiz_total > 0);
    const promedio  = quizzes.length
      ? Math.round(quizzes.reduce((a,q) => a + q.quiz_score/q.quiz_total, 0) / quizzes.length * 100) : null;

    // Con una empresa seleccionada, comparar contra el total del programa
    const global = { avance: avanceDe(PART) };
    const delta = esFiltro ? avance - global.avance : null;
    const cmp = delta === null ? '' :
      `<div class="kpi-d ${delta > 0 ? 'up' : delta < 0 ? 'down' : ''}">${
        delta === 0 ? 'igual que el promedio' :
        `${delta > 0 ? '▲' : '▼'} ${Math.abs(delta)} pts vs. promedio (${global.avance}%)`}</div>`;

    document.getElementById('kpis').innerHTML = `
      <div class="kpi"><div class="kpi-v">${vis.length}</div><div class="kpi-l">Participantes</div>
        <div class="kpi-d">${activos} han entrado al menos una vez</div></div>
      <div class="kpi"><div class="kpi-v n">${avance}%</div><div class="kpi-l">Avance del programa</div>${cmp}</div>
      <div class="kpi"><div class="kpi-v">${completos}</div><div class="kpi-l">Programa completo</div>
        <div class="kpi-d">${vis.length ? pct(completos, vis.length) : 0}% de los inscritos</div></div>
      <div class="kpi"><div class="kpi-v">${promedio===null?'—':promedio+'%'}</div><div class="kpi-l">Promedio del quiz</div>
        <div class="kpi-d">${quizzes.length} rendido${quizzes.length===1?'':'s'}</div></div>`;

    document.getElementById('fun-t').textContent = esFiltro
      ? `Recorrido · ${actual?.nombre || ''}` : 'Recorrido del programa';
    pintarEmbudo(idx, vis);
    pintarDona(idx, vis);

    // Detalle por sesión
    document.getElementById('sesiones').innerHTML = TALLERES.map(t => {
      const barra = (label, n, alt) => `
        <div class="bar-row">
          <div class="bar-lbl"><span>${esc(label)}</span><span>${n}/${vis.length} · ${pct(n, vis.length)}%</span></div>
          <div class="bar-bg"><div class="bar-fl ${alt?'alt':''}" style="width:${pct(n, vis.length)}%"></div></div>
        </div>`;
      const qs = míos.filter(g => g.taller===t.n && g.tipo==='quiz' && g.quiz_total > 0);
      const prom = qs.length ? Math.round(qs.reduce((a,q)=>a+q.quiz_score/q.quiz_total,0)/qs.length*100) : null;
      const dom = vis.filter(p => dominoTaller(idx,p,t.n)).length;
      return `<div class="card">
        <div class="ses-h">
          <span class="ses-t">${esc(t.title)}</span>
          <span class="ses-p">${pct(dom, vis.length)}% dominada</span>
        </div>
        ${barra('Quiz rendido', vis.filter(p => idx[p.id]?.[t.n]?.quiz).length)}
        ${barra('Desafío hecho', vis.filter(p => idx[p.id]?.[t.n]?.desafio).length)}
        ${t.conceptos.map(c => barra(nom(c), vis.filter(p => idx[p.id]?.[t.n]?.conceptos?.has(c)).length, true)).join('')}
        <div class="ses-q">Promedio del quiz: <b>${prom===null?'sin datos':prom+'%'}</b></div>
      </div>`;
    }).join('');

    // Ranking de empresas: solo tiene sentido mirando el total
    document.getElementById('bloque-ranking').innerHTML = (esFiltro || emps.length < 2) ? '' : `
      <div class="sec">Empresas <i></i></div>
      <div class="card">
        ${emps.slice(0, 12).map(e => `
          <div class="rank-row" onclick="setFiltro('${esc(e.slug)}')">
            <div>
              <div class="rank-n">${esc(e.nombre)}<em>${e.n} participante${e.n===1?'':'s'}</em></div>
              <div class="bar-bg"><div class="bar-fl" style="width:${e.avance}%"></div></div>
            </div>
            <div class="rank-pct">${e.avance}%</div>
          </div>`).join('')}
      </div>`;

    // Tabla
    const tb = document.getElementById('tbody');
    if (!vis.length){
      tb.innerHTML = `<tr><td colspan="7"><div class="vacio">No hay participantes en esta selección.</div></td></tr>`;
      return;
    }
    const orden = [...vis].sort((a,b) =>
      NS.filter(t => dominoTaller(idx,b,t)).length - NS.filter(t => dominoTaller(idx,a,t)).length ||
      a.nombre.localeCompare(b.nombre));
    tb.innerHTML = orden.map(p => {
      const celda = t => {
        const d = idx[p.id]?.[t] || {};
        const nC = d.conceptos?.size || 0;
        return `<td><div class="tgrp">
          <div class="tg"><div class="dot ${d.quiz?'on':''}"></div><div class="tg-n">Q</div></div>
          <div class="tg"><div class="dot ${d.desafio?'on':''}"></div><div class="tg-n">D</div></div>
          <div class="tg"><div class="dot ${nC===CONCEPTOS[t].length?'on':(nC?'half':'')}"></div><div class="tg-n">${nC}/${CONCEPTOS[t].length}</div></div>
        </div></td>`;
      };
      const estrellas = NS.filter(t => dominoTaller(idx,p,t)).length;
      const notas = NS.map(t => {
        const q = idx[p.id]?.[t]?.quiz;
        return (q && q.quiz_total) ? `${q.quiz_score}/${q.quiz_total}` : '—';
      }).join(' · ');
      return `<tr>
        <td><div class="p-n">${esc(p.nombre)}</div><div class="p-m">${esc(p.email)}</div></td>
        <td>${esc(p.empresa)}<div class="p-m">${esc(p.cargo || '')}</div></td>
        ${NS.map(celda).join('')}
        <td class="stars">${estrellas ? '⭐'.repeat(estrellas) : '—'}</td>
        <td class="p-m" style="font-family:'IBM Plex Mono',monospace">${notas}</td>
      </tr>`;
    }).join('');
  }
</script>
</body>
</html>
