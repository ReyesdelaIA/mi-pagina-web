<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Portal Claude · Pack de 3 Talleres · Reyes IA</title>
  <link rel="icon" type="image/png" href="/icon%20reyes%20IA.png" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/claude/portal.css" />
  <style>
    .hero { background: linear-gradient(135deg,#92400E 0%,#B45309 50%,#D97706 100%); color:#fff; padding: 30px 20px 28px; position: relative; overflow: hidden; }
    .hero::after { content:''; position:absolute; bottom:-70px; left:-30px; width:180px; height:180px; border-radius:50%; background:rgba(255,255,255,.05); }
    .hero-inner { max-width: 1040px; margin: 0 auto; position: relative; z-index: 1; }
    .hero-top { display:flex; align-items:center; gap:13px; margin-bottom:13px; }
    .hero-logo { width:50px; height:50px; border-radius:14px; background:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0; box-shadow:0 6px 18px rgba(0,0,0,.22); }
    .hero-logo img { width:32px; height:32px; object-fit:contain; display:block; }
    .hero-badge { display:inline-flex; align-items:center; gap:6px; background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.25); border-radius:20px; padding:4px 12px; font-size:11px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; }
    .hero-title { font-size:27px; font-weight:800; line-height:1.1; margin-bottom:5px; }
    .hero-sub { font-size:13.5px; opacity:.85; }

    .wrap { max-width: 1040px; margin: 0 auto; padding: 0 20px; }

    /* Tira de estado: identidad + estrellas + habilidades + avance */
    .estado { display:grid; grid-template-columns: 1fr; gap:10px; margin-top:-18px; position:relative; z-index:2; }
    .card-b { background:#fff; border:1px solid var(--border); border-radius:14px; box-shadow:0 3px 14px rgba(26,37,55,.07); }

    .who { display:flex; align-items:center; gap:11px; padding:12px 15px; }
    .who-av { width:36px; height:36px; border-radius:50%; background:linear-gradient(135deg,var(--amber),var(--amber-dark)); color:#fff; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:800; flex-shrink:0; }
    .who-t { flex:1; min-width:0; }
    .who-name { font-size:13.5px; font-weight:700; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .who-org { font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .who-edit { background:none; border:none; color:var(--amber); font-size:11.5px; font-weight:700; cursor:pointer; font-family:inherit; flex-shrink:0; }

    .metricas { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .metrica { padding:14px 16px; display:flex; flex-direction:column; gap:7px; cursor:default; }
    .metrica.click { cursor:pointer; transition:border-color .15s; }
    .metrica.click:hover { border-color:var(--amber); }
    .m-label { font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); }
    .m-big { display:flex; align-items:baseline; gap:5px; }
    .m-n { font-size:24px; font-weight:800; color:var(--amber-dark); line-height:1; }
    .m-de { font-size:12px; font-weight:600; color:var(--muted); }
    .estrellas { display:flex; gap:5px; }
    .s-icon { font-size:23px; filter:grayscale(1) opacity(.22); transition:filter .3s; }
    .s-icon.on { filter:none; }
    .barra { height:7px; background:#e6e1d7; border-radius:99px; overflow:hidden; }
    .barra-fill { height:100%; background:linear-gradient(90deg,var(--amber-dark),var(--amber-light)); border-radius:99px; transition:width .8s ease; }
    .hex { width:100%; max-width:96px; margin:0 auto; display:block; }

    .sec-title { display:flex; align-items:center; gap:8px; font-size:16px; font-weight:800; color:var(--ink); letter-spacing:-.2px; margin:30px 0 14px; }
    .sec-title .sec-ico { width:26px; height:26px; border-radius:8px; background:#FEF3E2; display:flex; align-items:center; justify-content:center; font-size:14px; }

    .talleres { display:grid; grid-template-columns:1fr; gap:14px; padding-bottom:8px; }
    .tcard { position:relative; background:#fff; border:1.5px solid var(--border); border-radius:18px; box-shadow:0 3px 14px rgba(26,37,55,.06); display:flex; flex-direction:column; transition:transform .15s, box-shadow .15s; }
    .tcard:hover { transform:translateY(-2px); box-shadow:0 10px 26px rgba(26,37,55,.11); }
    /* La sesión activa es la única que se ve encendida; el resto queda en reposo */
    .tcard.activa { border-color:var(--amber); box-shadow:0 6px 24px rgba(217,119,6,.16); }
    .tcard.locked { background:#FCFBF9; }
    .tcard.locked:hover { transform:none; box-shadow:0 3px 14px rgba(26,37,55,.06); }
    .tcard-body { padding:22px 22px 20px; flex:1; display:flex; flex-direction:column; }
    .tcard-head { display:flex; align-items:flex-start; gap:14px; margin-bottom:13px; }
    .tnum { width:46px; height:46px; border-radius:14px; background:linear-gradient(135deg,var(--amber-dark),var(--amber-light)); color:#fff; display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:800; flex-shrink:0; box-shadow:0 5px 14px rgba(217,119,6,.3); }
    .tcard.locked .tnum { background:#FDEBD3; color:#C8853A; box-shadow:none; }
    .tcard.done .tnum { background:linear-gradient(135deg,#065F46,#10B981); box-shadow:0 4px 12px rgba(16,185,129,.3); }
    .tlabel { padding-right:30px; font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.5px; color:var(--amber); margin-bottom:4px; }
    .tcard.locked .tlabel { color:#B99263; padding-right:112px; }
    .tcard.done .tlabel { color:#059669; }
    .ttitle { font-size:17px; font-weight:800; color:var(--ink); line-height:1.25; letter-spacing:-.2px; }
    .tcard.locked .ttitle { color:#6B7280; }
    .tdur { display:flex; flex-wrap:wrap; align-items:center; gap:5px; font-size:11.5px; color:var(--muted); margin-top:6px; }
    .tstar { position:absolute; top:16px; right:18px; font-size:19px; filter:grayscale(1) opacity(.2); flex-shrink:0; }
    .tcard.done .tstar { filter:none; }
    .tpronto { position:absolute; top:16px; right:16px; background:#F3F1EC; color:#8A8577; font-size:9.5px; font-weight:800; text-transform:uppercase; letter-spacing:.5px; padding:5px 10px; border-radius:99px; }
    .tresumen { font-size:13.5px; color:#4B5563; line-height:1.6; margin-bottom:18px; }
    .tcard.locked .tresumen { color:#8A8577; }

    .pasos { display:flex; gap:10px; margin-bottom:16px; padding-top:16px; border-top:1px solid #F0EDE6; }
    .paso { flex:1; display:flex; flex-direction:column; align-items:center; gap:7px; }
    .paso-bar { width:100%; height:4px; border-radius:99px; background:#EDE9E0; overflow:hidden; }
    .paso-bar i { display:block; height:100%; background:linear-gradient(90deg,var(--amber-dark),var(--amber-light)); border-radius:99px; transition:width .5s ease; }
    .paso-l { font-size:9.5px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; }

    .tcta { margin-top:auto; width:100%; padding:13px; font-size:13.5px; border-radius:12px; }
    .tcta.pronto { background:#F5F3EE; color:#9A9488; cursor:default; font-weight:700; text-align:center; border:none; }

    /* Avance del programa: número grande a la izquierda, barra larga a la derecha */
    .avance { display:flex; align-items:center; gap:16px; padding:18px 20px; }
    .av-ico { width:44px; height:44px; border-radius:50%; background:#FEF3E2; display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0; }
    .av-t { flex-shrink:0; }
    .av-lbl { font-size:12.5px; font-weight:700; color:var(--ink); margin-bottom:2px; }
    .av-n { display:flex; align-items:baseline; gap:7px; }
    .av-pct { font-size:26px; font-weight:800; color:var(--amber-dark); line-height:1; }
    .av-txt { font-size:11.5px; color:var(--muted); }
    .av-bar { flex:1; min-width:60px; height:9px; background:#EDE9E0; border-radius:99px; overflow:hidden; }
    .av-bar i { display:block; height:100%; background:linear-gradient(90deg,var(--amber-dark),var(--amber-light)); border-radius:99px; transition:width .8s ease; }
    .av-trofeo { font-size:24px; filter:grayscale(1) opacity(.3); flex-shrink:0; }
    .av-trofeo.on { filter:none; }
    @media(max-width:620px){ .avance { flex-wrap:wrap; } .av-bar { order:3; flex-basis:100%; } }

    footer { margin-top: 10px; }

    @media(min-width:760px){
      .estado { grid-template-columns: 1.1fr 1fr 1fr; align-items:stretch; }
      .metricas { display:contents; }
      .who { padding:14px 16px; }
    }
    @media(min-width:1000px){
      .hero { padding: 40px 20px 42px; }
      .hero-title { font-size:34px; }
      .hero-sub { font-size:15px; }
      .talleres { grid-template-columns: repeat(3,1fr); gap:16px; }
      .sec-title { margin:30px 0 14px; }
    }
  </style>
</head>
<body>

<nav>
  <a href="https://reyesia.com" class="logo"><img src="/logo reyes IA horizontal blanco.png" alt="Reyes IA" /></a>
  <div class="nav-right">
    <a href="https://reyesia.com" target="_blank" rel="noopener">reyesia.com</a>
    <a href="mailto:felipe@reyesia.com" title="Escríbeme">✉️</a>
  </div>
</nav>

<div class="hero">
  <div class="hero-inner">
    <div class="hero-top">
      <div class="hero-logo"><img src="/talleres/icon-claude.png" alt="Claude" /></div>
      <div class="hero-badge">🎓 Pack de 3 talleres</div>
    </div>
    <div class="hero-title">Programa Claude</div>
  </div>
</div>

<div class="wrap">
  <div class="estado">
    <div class="card-b who">
      <div class="who-av" id="who-av">?</div>
      <div class="who-t">
        <div class="who-name" id="who-name">—</div>
        <div class="who-org" id="who-org">—</div>
      </div>
      <button class="who-edit" id="who-edit">Cambiar</button>
    </div>

    <div class="metricas">
      <div class="card-b metrica">
        <span class="m-label">Tus estrellas</span>
        <div class="estrellas" id="estrellas"></div>
        <div class="m-big"><span class="m-n" id="stars-n">0</span><span class="m-de">de 3 sesiones dominadas</span></div>
      </div>

      <div class="card-b metrica click" id="btn-skills">
        <span class="m-label">Centro de habilidades</span>
        <svg class="hex" viewBox="0 0 130 108" aria-hidden="true">
          <defs>
            <linearGradient id="hexG" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#F59E0B"/><stop offset="100%" stop-color="#92400E"/>
            </linearGradient>
          </defs>
          <circle cx="65" cy="54" r="47" fill="#FFFBEB"/>
          <circle cx="65" cy="54" r="41" fill="none" stroke="#FCD34D" stroke-width="1.2" stroke-dasharray="4,3"/>
          <polygon points="65,21 89,36 89,64 65,79 41,64 41,36" fill="url(#hexG)"/>
          <text x="65" y="54" text-anchor="middle" dominant-baseline="middle" font-size="26">🧠</text>
        </svg>
        <div class="m-big"><span class="m-n" id="hab-n">0</span><span class="m-de">de 15 desbloqueadas · ver todas</span></div>
      </div>
    </div>
  </div>

  <div class="sec-title"><span class="sec-ico">📚</span>Las 3 sesiones</div>
  <div class="talleres" id="talleres"></div>

  <div class="card-b avance" style="margin-top:6px;">
    <div class="av-ico">📈</div>
    <div class="av-t">
      <div class="av-lbl">Avance del programa</div>
      <div class="av-n"><span class="av-pct" id="pct">0%</span><span class="av-txt" id="pasos-txt">0 de 21 pasos</span></div>
    </div>
    <div class="av-bar"><i id="barra" style="width:0%"></i></div>
    <div class="av-trofeo" id="trofeo">🏆</div>
  </div>
</div>

<footer>Programa facilitado por <a href="https://reyesia.com" target="_blank" rel="noopener">Reyes IA</a> · Felipe Reyes</footer>

<script src="/claude/portal.js"></script>
<script>
  function renderUser(){
    if (!user) return;
    document.getElementById('who-av').textContent   = iniciales(user.nombre);
    document.getElementById('who-name').textContent = user.nombre;
    document.getElementById('who-org').textContent  = user.cargo ? `${user.cargo} · ${user.empresa}` : user.empresa;
  }
  // portal.js la llama al guardar la identidad
  function onIdentidad(){ renderUser(); render(); }

  function estadoTaller(t){
    const c = conceptosOk(t.n), total = t.conceptos.length;
    const q = st[`${t.n}-quiz`] ? 1 : 0, d = st[`${t.n}-des`] ? 1 : 0;
    const hechos = c + q + d;
    if (isComplete(t.n)) return { txt: 'Repasar la sesión', clase: 'btn-ghost', hechos };
    if (hechos === 0)    return { txt: 'Empezar la sesión →', clase: 'btn-amber', hechos };
    return { txt: 'Continuar donde ibas →', clase: 'btn-amber', hechos };
  }

  function render(){
    // Estrellas
    const n = countStars();
    document.getElementById('estrellas').innerHTML =
      TALLERES.map((_, i) => `<span class="s-icon ${i < n ? 'on' : ''}">⭐</span>`).join('');
    document.getElementById('stars-n').textContent = n;
    document.getElementById('hab-n').textContent   = skillsOk();

    // Avance
    document.getElementById('barra').style.width = avancePct() + '%';
    document.getElementById('pct').textContent   = avancePct() + '%';
    document.getElementById('pasos-txt').textContent =
      `${pasosHechos()} de ${totalPasos()} pasos`;
    document.getElementById('trofeo').classList.toggle('on', avancePct() >= 100);

    // Tarjetas de taller
    document.getElementById('talleres').innerHTML = TALLERES.map(t => {
      const done = isComplete(t.n);
      const c = conceptosOk(t.n), total = t.conceptos.length;
      const e = estadoTaller(t);
      const barra = (label, hecho, de) => `
        <div class="paso">
          <div class="paso-bar"><i style="width:${de ? (hecho / de) * 100 : 0}%"></i></div>
          <span class="paso-l">${label}</span>
        </div>`;
      // Las sesiones marcadas `proximamente` se ven pero no se entra a ellas
      const pronto = !!t.proximamente;
      return `
      <div class="tcard ${done ? 'done' : ''} ${pronto ? 'locked' : 'activa'}">
        <div class="tcard-body">
          <div class="tcard-head">
            <div class="tnum">${t.n}</div>
            <div style="flex:1;min-width:0">
              <div class="tlabel">${esc(t.label)}</div>
              <div class="ttitle">${esc(t.title)}</div>
              <div class="tdur">🕐 ${esc(t.dur)}</div>
            </div>
            ${pronto
              ? '<span class="tpronto">Próximamente</span>'
              : `<span class="tstar" title="${done ? 'Sesión dominada' : 'Aún no dominada'}">⭐</span>`}
          </div>
          <div class="tresumen">${esc(t.resumen)}</div>
          <div class="pasos">
            ${barra(`Conceptos ${c}/${total}`, c, total)}
            ${barra('Quiz', st[`${t.n}-quiz`] ? 1 : 0, 1)}
            ${barra('Desafío', st[`${t.n}-des`] ? 1 : 0, 1)}
          </div>
          ${pronto
            ? '<div class="tcta pronto">Disponible próximamente</div>'
            : `<a class="btn ${e.clase} tcta" href="${urlTaller(t.n)}" style="text-align:center;text-decoration:none;display:block;">${e.txt}</a>`}
        </div>
      </div>`;
    }).join('');
  }

  document.getElementById('who-edit').onclick  = () => openGate(true);
  document.getElementById('btn-skills').onclick = () => openSkills();

  (async () => {
    await bootPortal();
    renderUser();
    render();
    renderSkills();
  })();
</script>
</body>
</html>
