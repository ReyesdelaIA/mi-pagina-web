<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Taller · Portal Claude · Reyes IA</title>
  <link rel="icon" type="image/png" href="/icon%20reyes%20IA.png" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/claude/portal.css" />
  <style>
    body { display: flex; flex-direction: column; min-height: 100vh; }

    /* Cabecera del taller con el stepper */
    .thead { background: var(--ink); color:#fff; padding: 16px 20px 0; }
    .thead-in { max-width: 820px; margin: 0 auto; }
    .thead-label { font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.7px; color:var(--amber-light); }
    .thead-title { font-size:17px; font-weight:800; line-height:1.25; margin-top:2px; }
    .stepper { display:flex; gap:5px; margin-top:14px; padding-bottom:14px; }
    .step-dot { flex:1; display:flex; flex-direction:column; gap:5px; background:none; border:none; padding:0; cursor:pointer; font-family:inherit; }
    .step-dot i { display:block; height:5px; border-radius:99px; background:rgba(255,255,255,.2); transition:background .3s; }
    .step-dot.done i { background:var(--green); }
    .step-dot.now  i { background:var(--amber-light); }
    .step-dot span { font-size:8.5px; font-weight:700; color:rgba(255,255,255,.45); text-transform:uppercase; letter-spacing:.3px; text-align:left; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .step-dot.now span { color:#fff; }

    /* Escenario */
    main { flex:1; padding: 22px 20px 30px; }
    .escena { max-width: 820px; margin: 0 auto; }

    .visual { border-radius:18px; overflow:hidden; margin-bottom:18px; border:1px solid var(--border); background:#fff; }
    .visual img { width:100%; display:block; }
    .visual-emoji { height:150px; display:flex; align-items:center; justify-content:center; font-size:62px; background:linear-gradient(135deg,#FFFBEB,#FDE68A); }

    .paso-n { font-size:11px; font-weight:800; color:var(--amber); text-transform:uppercase; letter-spacing:.6px; margin-bottom:5px; }
    .c-nombre { font-size:25px; font-weight:800; color:var(--ink); line-height:1.2; margin-bottom:8px; }
    .c-desc { font-size:14.5px; color:#4B5563; line-height:1.6; margin-bottom:20px; }

    .lista { list-style:none; display:flex; flex-direction:column; gap:11px; margin-bottom:18px; }
    .lista li { display:flex; gap:12px; background:#fff; border:1px solid var(--border); border-radius:12px; padding:13px 15px; font-size:13.5px; color:#374151; line-height:1.6; }
    .num { flex-shrink:0; width:22px; height:22px; border-radius:50%; background:#FEF3C7; color:var(--amber-dark); font-size:11px; font-weight:800; display:flex; align-items:center; justify-content:center; }

    .tip { background:#FFFBEB; border:1px solid #FDE68A; border-radius:12px; padding:13px 16px; font-size:13.5px; color:#5C3D00; line-height:1.6; margin-bottom:22px; }
    .tip b { color:var(--amber-dark); }

    .acciones { display:flex; flex-direction:column; gap:9px; }
    .acciones .btn { padding:14px; font-size:14px; width:100%; }
    .marcado { display:flex; align-items:center; justify-content:center; gap:8px; background:#ECFDF5; border:1.5px solid #A7F3D0; color:var(--green-dark); border-radius:12px; padding:13px; font-size:13.5px; font-weight:700; }

    /* Quiz */
    .q-num { font-size:11px; font-weight:800; color:var(--amber); text-transform:uppercase; letter-spacing:.6px; margin-bottom:6px; }
    .q-text { font-size:20px; font-weight:800; color:var(--ink); line-height:1.35; margin-bottom:18px; }
    .opts { display:flex; flex-direction:column; gap:10px; margin-bottom:16px; }
    .opt { background:#fff; border:1.5px solid var(--border); border-radius:12px; padding:14px 16px; font-size:14px; font-weight:500; color:#222; cursor:pointer; text-align:left; font-family:inherit; line-height:1.45; transition:all .15s; }
    .opt:hover:not(:disabled) { border-color:var(--amber); background:#FFF8EC; }
    .opt.correct { background:#ECFDF5; border-color:var(--green); color:var(--green-dark); }
    .opt.wrong   { background:#FEF2F2; border-color:#EF4444; color:#991B1B; }
    .opt:disabled { cursor:default; }
    .fb { font-size:13.5px; line-height:1.6; border-radius:12px; padding:13px 16px; margin-bottom:16px; display:none; }
    .fb.ok  { background:#ECFDF5; color:var(--green-dark); border:1px solid #A7F3D0; display:block; }
    .fb.no  { background:#FEF2F2; color:#7F1D1D; border:1px solid #FECACA; display:block; }

    /* Ejercicios hands-on */
    .ejercicios { display:flex; flex-direction:column; gap:12px; }
    .ej { background:#fff; border:1.5px solid var(--border); border-radius:14px; padding:14px 15px; transition:border-color .2s; }
    .ej.done { border-color:#A7F3D0; background:#F7FDFA; }
    .ej-head { display:flex; gap:12px; align-items:flex-start; }
    .ej-n { flex-shrink:0; width:24px; height:24px; border-radius:50%; background:var(--amber); color:#fff; font-size:12px; font-weight:800; display:flex; align-items:center; justify-content:center; }
    .ej.done .ej-n { background:var(--green); }
    .ej-t { flex:1; min-width:0; }
    .ej-tema { font-size:12px; font-weight:800; color:var(--amber-dark); margin-bottom:4px; }
    .ej.done .ej-tema { color:var(--green-dark); }
    .ej-enun { font-size:13.5px; color:#374151; line-height:1.6; }
    .ej-tick { flex-shrink:0; width:22px; height:22px; border-radius:50%; border:1.5px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:12px; color:transparent; }
    .ej.done .ej-tick { background:var(--green); border-color:var(--green); color:#fff; }
    .ej-prompt { margin-top:12px; background:#1a2537; border-radius:10px; overflow:hidden; }
    .ej-prompt-top { display:flex; align-items:center; justify-content:space-between; padding:7px 12px; background:rgba(255,255,255,.06); font-size:10.5px; font-weight:700; color:rgba(255,255,255,.6); text-transform:uppercase; letter-spacing:.5px; }
    .ej-copy { background:rgba(255,255,255,.15); border:none; color:#fff; border-radius:6px; padding:4px 10px; font-size:10.5px; font-weight:700; font-family:inherit; cursor:pointer; }
    .ej-copy:hover { background:rgba(255,255,255,.28); }
    .ej-prompt code { display:block; padding:12px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; color:#E5E7EB; line-height:1.6; white-space:pre-wrap; }
    .ej-acc { margin-top:12px; }
    .ej-acc .btn { padding:9px 16px; font-size:12.5px; }
    .ej-listo { font-size:12.5px; font-weight:700; color:var(--green-dark); }

    /* Desafío */
    .des-box { background:linear-gradient(135deg,#FFF8EC,#FFF3DC); border:1.5px solid #F5CC7A; border-radius:16px; padding:20px; margin-bottom:20px; }
    .des-txt { font-size:14.5px; color:#5C3D00; line-height:1.65; }

    /* Final */
    .fin { text-align:center; padding: 20px 0; }
    .fin-star { font-size:64px; line-height:1; margin-bottom:6px; }
    .fin-h { font-size:26px; font-weight:800; color:var(--ink); margin-bottom:8px; }
    .fin-p { font-size:14px; color:var(--muted); line-height:1.6; max-width:440px; margin:0 auto 22px; }
    .fin-hab { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:24px; }
    .fin-chip { background:#fff; border:1.5px solid #A7F3D0; border-radius:20px; padding:6px 13px; font-size:12px; font-weight:700; color:var(--green-dark); }
    .fin-acc { display:flex; flex-direction:column; gap:9px; max-width:340px; margin:0 auto; }
    .fin-acc .btn { padding:14px; font-size:14px; }

    .navrow { display:flex; justify-content:space-between; align-items:center; max-width:820px; margin:20px auto 0; }
    .prev { background:none; border:none; color:var(--muted); font-size:12.5px; font-weight:700; font-family:inherit; cursor:pointer; padding:8px 0; }
    .prev:hover { color:var(--ink); }
    .prev:disabled { opacity:.3; cursor:default; }
    .contador { font-size:11.5px; color:var(--muted); font-weight:600; }

    @media(min-width:820px){
      .thead { padding: 22px 20px 0; }
      .thead-title { font-size:21px; }
      main { padding: 30px 20px 40px; }
      .c-nombre { font-size:30px; }
      .acciones { flex-direction:row-reverse; justify-content:flex-end; }
      .acciones .btn { width:auto; min-width:260px; }
      .acciones .btn.btn-ghost { min-width:auto; }
      .visual-emoji { height:180px; font-size:72px; }
    }
  </style>
</head>
<body>

<nav>
  <a href="/claude" class="nav-back" id="nav-hub">← Volver al programa</a>
  <div class="nav-right">
    <button class="nav-back" id="btn-skills">🧠 Habilidades</button>
  </div>
</nav>

<div class="thead">
  <div class="thead-in">
    <div class="thead-label" id="t-label">—</div>
    <div class="thead-title" id="t-title">—</div>
    <div class="stepper" id="stepper"></div>
  </div>
</div>

<main>
  <div class="escena" id="escena"></div>
  <div class="navrow">
    <button class="prev" id="btn-prev">← Anterior</button>
    <span class="contador" id="contador"></span>
  </div>
</main>

<footer>Programa facilitado por <a href="https://reyesia.com" target="_blank" rel="noopener">Reyes IA</a> · Felipe Reyes</footer>

<script src="/claude/portal.js"></script>
<script>
  const N = (() => {
    const p = new URLSearchParams(location.search).get('n');
    const m = location.pathname.match(/taller-(\d)/);
    const n = parseInt(p || (m && m[1]) || '1', 10);
    return [1,2,3].includes(n) ? n : 1;
  })();

  const taller = T(N);
  let paso = 0;                 // 0..conceptos-1 = conceptos; luego quiz; luego desafío; luego fin
  const iQuiz = taller.conceptos.length;
  const iEjer = iQuiz + 1;
  const iDes  = iEjer + 1;
  const iFin  = iDes + 1;

  // Estado del quiz
  let qIdx = 0, qAciertos = 0, qRespondida = false;

  function onIdentidad(){ pintar(); }

  /* ---------------- Stepper ---------------- */

  function pasoHecho(i){
    if (i < iQuiz) return !!st[`c-${taller.conceptos[i]}`];
    if (i === iQuiz) return !!st[`${N}-quiz`];
    if (i === iEjer) { const e = ejerciciosDe(N); return e.length > 0 && ejerciciosOk(N) === e.length; }
    if (i === iDes)  return !!st[`${N}-des`];
    return isComplete(N);
  }

  function pintarStepper(){
    const etiquetas = taller.conceptos.map((id, i) => {
      const b = BLOQUES[id];
      return b ? b.emoji : (i + 1);
    });
    const items = [
      ...etiquetas.map((e, i) => ({ i, txt: `${e}` })),
      { i: iQuiz, txt: '🧠 Quiz' },
      { i: iEjer, txt: '🔨 Ejercicios' },
      { i: iDes,  txt: '🎯 Desafío' },
    ];
    document.getElementById('stepper').innerHTML = items.map(it => `
      <button class="step-dot ${pasoHecho(it.i) ? 'done' : ''} ${paso === it.i ? 'now' : ''}" data-i="${it.i}">
        <i></i><span>${it.txt}</span>
      </button>`).join('');
    document.querySelectorAll('.step-dot').forEach(b => {
      b.onclick = () => { paso = parseInt(b.dataset.i, 10); reiniciarQuiz(); pintar(); };
    });
  }

  function reiniciarQuiz(){ qIdx = 0; qAciertos = 0; qRespondida = false; }

  /* ---------------- Pantallas ---------------- */

  // Muestra la imagen del bloque si la tiene declarada en su meta.json.
  // Para agregarla: deja el archivo en /bloques/<id>/ y corre
  // `node scripts/bloques/sync-assets.js`, que la registra sola.
  function visualHTML(id, emoji){
    const img = id ? imagenDe(id) : null;
    return img
      ? `<div class="visual"><img src="${img}" alt="" /></div>`
      : `<div class="visual"><div class="visual-emoji">${emoji || '💡'}</div></div>`;
  }

  function pantallaConcepto(i){
    const id = taller.conceptos[i];
    const b  = BLOQUES[id];
    if (!b) return `<div class="c-nombre">Cargando…</div>`;
    const marcado = !!st[`c-${id}`];
    return `
      ${visualHTML(id, b.emoji)}
      <div class="paso-n">Concepto ${i + 1} de ${taller.conceptos.length}</div>
      <h1 class="c-nombre">${esc(b.nombre)}</h1>
      <p class="c-desc">${esc(b.descripcion)}</p>
      <ul class="lista">
        ${b.pasos.map((p, k) => `<li><span class="num">${k + 1}</span><span>${esc(p)}</span></li>`).join('')}
      </ul>
      ${b.pro_tip ? `<div class="tip"><b>💡 Pro tip:</b> ${esc(b.pro_tip)}</div>` : ''}
      <div class="acciones">
        ${marcado
          ? `<div class="marcado">✓ Ya marcaste que entendiste esto</div>
             <button class="btn btn-amber" id="a-sig">Siguiente →</button>`
          : `<button class="btn btn-green" id="a-ok">Entendí la lógica de ${esc(b.nombre)} →</button>
             <button class="btn btn-ghost" id="a-no">Todavía no me queda claro →</button>`}
      </div>`;
  }

  function pantallaQuiz(){
    if (st[`${N}-quiz`]){
      const s = st[`${N}-quizScore`], t = st[`${N}-quizTotal`];
      return `
        ${visualHTML(null, '🧠')}
        <div class="paso-n">Quiz del taller</div>
        <h1 class="c-nombre">Quiz completado</h1>
        <p class="c-desc">${s != null ? `Respondiste <b>${s} de ${t}</b> correctamente.` : 'Ya rendiste este quiz.'}</p>
        <div class="acciones"><button class="btn btn-amber" id="a-sig">Siguiente →</button></div>`;
    }
    const q = taller.quiz[qIdx];
    return `
      <div class="q-num">Pregunta ${qIdx + 1} de ${taller.quiz.length}</div>
      <h1 class="q-text">${esc(q.q)}</h1>
      <div class="opts" id="opts">
        ${q.opts.map((o, i) => `<button class="opt" data-i="${i}">${esc(o)}</button>`).join('')}
      </div>
      <div class="fb" id="fb"></div>
      <div class="acciones" id="acc-q"></div>`;
  }

  function pantallaEjercicios(){
    const lista = ejerciciosDe(N);
    if (!lista.length){
      return `${visualHTML(null,'🔨')}
        <div class="paso-n">Ejercicios</div>
        <h1 class="c-nombre">Sin ejercicios en este taller</h1>
        <p class="c-desc">Este taller no trae ejercicios hands-on.</p>
        <div class="acciones"><button class="btn btn-amber" id="a-sig">Siguiente →</button></div>`;
    }
    const hechos = ejerciciosOk(N);
    return `
      <div class="paso-n">Ejercicios hands-on · ${hechos} de ${lista.length}</div>
      <h1 class="c-nombre">Manos a la obra</h1>
      <p class="c-desc">Estos son para hacer durante el taller. Si alguno no alcanzas, déjalo sin marcar: sirve para saber dónde apretar.</p>
      <div class="ejercicios">
        ${lista.map((e, i) => {
          const ok = !!st[`e-${e.id}`];
          return `
          <div class="ej ${ok ? 'done' : ''}" id="ej-${e.id}">
            <div class="ej-head">
              <span class="ej-n">${i + 1}</span>
              <div class="ej-t">
                <div class="ej-tema">${e.bloque.emoji} ${esc(e.bloque.nombre)}</div>
                <div class="ej-enun">${esc(e.enunciado)}</div>
              </div>
              <span class="ej-tick">✓</span>
            </div>
            ${e.prompt ? `
              <div class="ej-prompt">
                <div class="ej-prompt-top">
                  <span>Prompt sugerido</span>
                  <button class="ej-copy" data-copy="${esc(e.prompt)}">Copiar</button>
                </div>
                <code>${esc(e.prompt)}</code>
              </div>` : ''}
            <div class="ej-acc">
              ${ok
                ? '<span class="ej-listo">✓ Lo hiciste</span>'
                : `<button class="btn btn-green ej-ok" data-ej="${e.id}">Lo hice ✓</button>`}
            </div>
          </div>`;
        }).join('')}
      </div>
      <div class="acciones" style="margin-top:20px">
        <button class="btn btn-amber" id="a-sig">${hechos === lista.length ? 'Siguiente →' : 'Seguir sin marcar todos →'}</button>
      </div>`;
  }

  function pantallaDesafio(){
    const hecho = !!st[`${N}-des`];
    return `
      ${visualHTML(null, '🎯')}
      <div class="paso-n">Desafío entre talleres</div>
      <h1 class="c-nombre">Tu desafío</h1>
      <div class="des-box"><div class="des-txt">${esc(taller.desafio)}</div></div>
      <div class="acciones">
        ${hecho
          ? `<div class="marcado">✓ Declaraste que completaste el desafío</div>
             <button class="btn btn-amber" id="a-sig">Siguiente →</button>`
          : `<button class="btn btn-green" id="a-ok">Sí, lo completé con compromiso ✓</button>
             <button class="btn btn-ghost" id="a-no">Todavía no lo hago →</button>`}
      </div>`;
  }

  function pantallaFin(){
    const done = isComplete(N);
    const hab = taller.conceptos.filter(id => st[`c-${id}`]).map(id => BLOQUES[id]);
    const falta = [];
    if (conceptosOk(N) < taller.conceptos.length) falta.push(`${taller.conceptos.length - conceptosOk(N)} concepto(s) por marcar`);
    const ej = ejerciciosDe(N);
    if (ejerciciosOk(N) < ej.length) falta.push(`${ej.length - ejerciciosOk(N)} ejercicio(s)`);
    if (!st[`${N}-quiz`]) falta.push('el quiz');
    if (!st[`${N}-des`])  falta.push('el desafío');
    return `
      <div class="fin">
        <div class="fin-star">${done ? '⭐' : '🚧'}</div>
        <div class="fin-h">${done ? '¡Taller dominado!' : 'Vas avanzando'}</div>
        <p class="fin-p">${done
          ? 'Completaste los conceptos, el quiz y el desafío. Tu estrella ya está en el programa.'
          : `Para ganar la estrella de este taller te falta: ${esc(falta.join(', '))}.`}</p>
        ${hab.length ? `<div class="fin-hab">${hab.map(b => `<span class="fin-chip">${b.emoji} ${esc(b.nombre)}</span>`).join('')}</div>` : ''}
        <div class="fin-acc">
          <a class="btn btn-amber" href="${urlHub()}" style="text-align:center;text-decoration:none;display:block;">Volver al programa →</a>
          ${!done ? `<button class="btn btn-ghost" id="a-volver">Revisar lo que falta</button>` : ''}
        </div>
      </div>`;
  }

  /* ---------------- Pintado y acciones ---------------- */

  function pintar(){
    document.getElementById('t-label').textContent = taller.label;
    document.getElementById('t-title').textContent = taller.title;

    const esc_ = document.getElementById('escena');
    if (paso < iQuiz)        esc_.innerHTML = pantallaConcepto(paso);
    else if (paso === iQuiz) esc_.innerHTML = pantallaQuiz();
    else if (paso === iEjer) esc_.innerHTML = pantallaEjercicios();
    else if (paso === iDes)  esc_.innerHTML = pantallaDesafio();
    else                     esc_.innerHTML = pantallaFin();

    pintarStepper();
    document.getElementById('btn-prev').disabled = paso === 0;
    document.getElementById('contador').textContent =
      paso >= iFin ? 'Fin del taller' : `Paso ${paso + 1} de ${iFin}`;
    conectar();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function avanzar(){ paso = Math.min(paso + 1, iFin); reiniciarQuiz(); pintar(); }

  function conectar(){
    const sig = document.getElementById('a-sig');
    if (sig) sig.onclick = avanzar;

    const no = document.getElementById('a-no');
    if (no) no.onclick = () => {
      // Avanza sin marcar. Es dato útil: sabemos qué concepto no quedó claro.
      toast('Sin problema, puedes volver cuando quieras');
      avanzar();
    };

    const ok = document.getElementById('a-ok');
    if (ok) ok.onclick = () => {
      if (paso < iQuiz){
        const id = taller.conceptos[paso];
        const b  = BLOQUES[id];
        st[`c-${id}`] = true; saveStars();
        syncProgreso(N, 'concepto', id);
        toast(`🧠 Habilidad desbloqueada: ${b ? b.nombre : id}`);
      } else if (paso === iDes){
        st[`${N}-des`] = true; saveStars();
        syncProgreso(N, 'desafio', '');
        toast('🎯 ¡Desafío completado!');
      }
      if (isComplete(N)) { paso = iFin; reiniciarQuiz(); pintar(); toast('⭐ ¡Taller dominado!'); return; }
      avanzar();
    };

    const volver = document.getElementById('a-volver');
    if (volver) volver.onclick = () => { paso = 0; reiniciarQuiz(); pintar(); };

    // Ejercicios
    document.querySelectorAll('.ej-ok').forEach(b => {
      b.onclick = () => marcarEjercicio(b.dataset.ej);
    });
    document.querySelectorAll('.ej-copy').forEach(b => {
      b.onclick = async () => {
        try { await navigator.clipboard.writeText(b.dataset.copy); b.textContent = 'Copiado ✓'; }
        catch (e) { b.textContent = 'Copia manual'; }
        setTimeout(() => { b.textContent = 'Copiar'; }, 1500);
      };
    });

    // Quiz
    const opts = document.getElementById('opts');
    if (opts){
      opts.querySelectorAll('.opt').forEach(btn => {
        btn.onclick = () => responder(parseInt(btn.dataset.i, 10));
      });
    }
  }

  function marcarEjercicio(id){
    if (st[`e-${id}`]) return;
    st[`e-${id}`] = true; saveStars();
    syncProgreso(N, 'ejercicio', id);
    const b = BLOQUES[id];
    toast(`🔨 Ejercicio completado: ${b ? b.nombre : id}`);
    if (isComplete(N)) { paso = iFin; reiniciarQuiz(); pintar(); toast('⭐ ¡Taller dominado!'); return; }
    pintar();
  }

  function responder(i){
    if (qRespondida) return;
    qRespondida = true;
    const q = taller.quiz[qIdx];
    const ok = i === q.correct;
    if (ok) qAciertos++;

    document.querySelectorAll('.opt').forEach((b, idx) => {
      b.disabled = true;
      if (idx === q.correct) b.classList.add('correct');
      else if (idx === i) b.classList.add('wrong');
    });
    const fb = document.getElementById('fb');
    fb.className = 'fb ' + (ok ? 'ok' : 'no');
    fb.textContent = (ok ? '✅ Correcto. ' : '❌ No era esa. ') + q.explain;

    const ultima = qIdx === taller.quiz.length - 1;
    document.getElementById('acc-q').innerHTML =
      `<button class="btn btn-amber" id="a-qsig">${ultima ? 'Terminar quiz ✓' : 'Siguiente pregunta →'}</button>`;
    document.getElementById('a-qsig').onclick = () => {
      if (!ultima){ qIdx++; qRespondida = false; pintar(); return; }
      st[`${N}-quiz`] = true;
      st[`${N}-quizScore`] = qAciertos;
      st[`${N}-quizTotal`] = taller.quiz.length;
      saveStars();
      syncProgreso(N, 'quiz', '', qAciertos, taller.quiz.length);
      toast(`🧠 Quiz completado · ${qAciertos}/${taller.quiz.length} correctas`);
      if (isComplete(N)) { paso = iFin; reiniciarQuiz(); pintar(); toast('⭐ ¡Taller dominado!'); return; }
      avanzar();
    };
  }

  document.getElementById('btn-prev').onclick   = () => { paso = Math.max(paso - 1, 0); reiniciarQuiz(); pintar(); };
  document.getElementById('btn-skills').onclick = () => openSkills();
  document.getElementById('nav-hub').href = urlHub();

  (async () => {
    await bootPortal(taller.conceptos);
    // Retoma donde iba: primer paso pendiente
    let p = 0;
    while (p < iFin && pasoHecho(p)) p++;
    paso = p;
    pintar();
    renderSkills();
  })();
</script>
</body>
</html>
