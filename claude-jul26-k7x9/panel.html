<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Panel · Portal Claude · Reyes IA</title>
  <link rel="icon" type="image/png" href="/icon%20reyes%20IA.png" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --ink:#1a2537; --amber:#D97706; --amber-dark:#92400E;
      --bg:#f4f1ec; --border:#e3ded4; --muted:#6b7280;
    }
    body { font-family:'Poppins',sans-serif; background:var(--bg); color:#1a1a1a; }

    nav { background:var(--ink); height:58px; display:flex; align-items:center; justify-content:space-between; padding:0 20px; }
    nav img { height:34px; object-fit:contain; }
    nav .tag { color:rgba(255,255,255,.7); font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.5px; }

    .wrap { max-width:1100px; margin:0 auto; padding:26px 20px 60px; }

    /* Login */
    .login { max-width:360px; margin:70px auto; background:#fff; border:1px solid var(--border); border-radius:20px; padding:30px 26px; }
    .login h1 { font-size:19px; font-weight:800; color:var(--ink); margin-bottom:6px; }
    .login p { font-size:12.5px; color:var(--muted); margin-bottom:20px; line-height:1.5; }
    .login input { width:100%; border:1.5px solid var(--border); border-radius:10px; padding:12px 14px; font-size:14px; font-family:inherit; outline:none; margin-bottom:12px; }
    .login input:focus { border-color:var(--amber); }
    .login button { width:100%; background:linear-gradient(135deg,var(--amber-dark),var(--amber)); color:#fff; border:none; border-radius:11px; padding:13px; font-size:14px; font-weight:700; font-family:inherit; cursor:pointer; }
    .login .err { font-size:12px; color:#B91C1C; margin-top:10px; display:none; line-height:1.5; }
    .login .err.show { display:block; }

    .head { display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:20px; }
    .head h1 { font-size:22px; font-weight:800; color:var(--ink); }
    .head p { font-size:12.5px; color:var(--muted); margin-top:3px; }
    .filters { display:flex; gap:8px; flex-wrap:wrap; }
    .fbtn { background:#fff; border:1.5px solid var(--border); border-radius:20px; padding:7px 14px; font-size:12px; font-weight:600; font-family:inherit; color:#374151; cursor:pointer; transition:all .15s; }
    .fbtn:hover { border-color:var(--amber); }
    .fbtn.on { background:var(--amber); border-color:var(--amber); color:#fff; }
    .fbtn.alt { color:var(--muted); border-style:dashed; }
    /* Cuántas formas de escribir se juntaron en ese botón */
    .vcount { display:inline-flex; align-items:center; justify-content:center; min-width:15px; height:15px;
      margin-left:6px; padding:0 4px; border-radius:99px; background:#EDE7DA; color:#7a7264;
      font-size:9.5px; font-weight:800; }
    .fbtn.on .vcount { background:rgba(255,255,255,.28); color:#fff; }

    /* Sugerencias de unión */
    .sug { display:flex; align-items:center; gap:8px; flex-wrap:wrap; background:#FFF8EC;
      border:1px solid #F5CC7A; border-radius:12px; padding:11px 14px; margin-bottom:18px; }
    .sug > b { font-size:11.5px; color:#7A5A14; font-weight:700; }
    .sug-b { background:#fff; border:1.5px solid #F0D9A8; border-radius:20px; padding:6px 12px;
      font-size:11.5px; font-weight:600; font-family:inherit; color:#5C3D00; cursor:pointer; }
    .sug-b:hover { border-color:var(--amber); }
    .sug-b span { color:var(--amber-dark); font-weight:800; }
    .sug-b.off { color:var(--muted); border-style:dashed; }

    .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:24px; }
    .kpi { background:#fff; border:1px solid var(--border); border-radius:14px; padding:16px 18px; }
    .kpi-v { font-size:28px; font-weight:800; color:var(--amber-dark); line-height:1; }
    .kpi-l { font-size:11px; color:var(--muted); font-weight:600; margin-top:6px; text-transform:uppercase; letter-spacing:.4px; }

    .sec { font-size:12px; font-weight:800; color:var(--ink); text-transform:uppercase; letter-spacing:.6px; margin:26px 0 12px; }

    .tallers { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:12px; }
    .tcard { background:#fff; border:1px solid var(--border); border-radius:14px; padding:16px; }
    .tcard-t { font-size:13px; font-weight:700; color:var(--ink); margin-bottom:12px; }
    .bar-row { margin-bottom:10px; }
    .bar-lbl { display:flex; justify-content:space-between; font-size:11px; color:var(--muted); font-weight:600; margin-bottom:4px; }
    .bar-bg { height:7px; background:#eae5da; border-radius:99px; overflow:hidden; }
    .bar-fl { height:100%; border-radius:99px; background:linear-gradient(90deg,var(--amber-dark),#F59E0B); transition:width .6s ease; }
    .tcard-q { font-size:11.5px; color:var(--muted); margin-top:12px; padding-top:10px; border-top:1px solid #f0ebe0; }
    .tcard-q b { color:var(--ink); font-size:13px; }

    .tbl-wrap { background:#fff; border:1px solid var(--border); border-radius:14px; overflow-x:auto; }
    table { width:100%; border-collapse:collapse; font-size:12.5px; min-width:620px; }
    th { text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.4px; color:var(--muted); font-weight:700; padding:12px 14px; border-bottom:1px solid var(--border); white-space:nowrap; }
    td { padding:11px 14px; border-bottom:1px solid #f2eee5; vertical-align:middle; }
    tr:last-child td { border-bottom:none; }
    .p-name { font-weight:600; color:var(--ink); }
    .p-mail { font-size:11px; color:var(--muted); }
    .dots { display:flex; gap:3px; }
    .dot { width:9px; height:9px; border-radius:50%; background:#e2ddd2; }
    .dot.on { background:var(--amber); }
    .dot.half { background:linear-gradient(90deg,var(--amber) 50%,#e2ddd2 50%); }
    .tgrp { display:flex; gap:9px; }
    .tg { display:flex; flex-direction:column; align-items:center; gap:4px; }
    .tg-n { font-size:9px; color:#b0a99c; font-weight:700; }
    .stars-c { font-size:12px; white-space:nowrap; }
    .empty { text-align:center; padding:44px 20px; color:var(--muted); font-size:13px; }
    .loading { text-align:center; padding:60px 20px; color:var(--muted); font-size:13px; }
  </style>
</head>
<body>

<nav>
  <img src="/logo reyes IA horizontal blanco.png" alt="Reyes IA" />
  <span class="tag">Panel interno</span>
</nav>

<!-- Login -->
<div class="login" id="login">
  <h1>🔒 Panel Portal Claude</h1>
  <p>Avance de los participantes del pack de 3 talleres, por empresa.</p>
  <input type="password" id="pw" placeholder="Contraseña" autocomplete="current-password" />
  <button onclick="entrar()">Entrar</button>
  <div class="err" id="login-err"></div>
</div>

<!-- Panel -->
<div class="wrap" id="panel" style="display:none;">
  <div class="head">
    <div>
      <h1>Portal Claude · Avance</h1>
      <p id="sub">—</p>
    </div>
    <div class="filters" id="filters"></div>
  </div>
  <div id="sugerencias"></div>

  <div class="kpis" id="kpis"></div>

  <div class="sec">Avance por taller</div>
  <div class="tallers" id="tallers"></div>

  <div class="sec">Participantes</div>
  <div class="tbl-wrap">
    <table>
      <thead>
        <tr>
          <th>Participante</th>
          <th>Empresa</th>
          <th>Taller 1</th>
          <th>Taller 2</th>
          <th>Taller 3</th>
          <th>⭐</th>
          <th>Quiz</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<!-- El temario sale de portal.js, que es la fuente de verdad. Antes el panel
     tenía su propia copia y quedó desfasada, midiendo mal el avance. -->
<script src="/claude-jul26-k7x9/portal.js"></script>
<script>
  const TALLER_NOMBRE = Object.fromEntries(
    TALLERES.map(t => [t.n, `T${t.n} · ${(t.label.split('·')[1] || t.title).trim()}`])
  );
  const CONCEPTOS = Object.fromEntries(TALLERES.map(t => [t.n, t.conceptos]));
  const NOMBRES = {};   // id -> nombre legible, desde /bloques

  let PART = [], PROG = [], filtro = '__all__', agrupar = true;

  // Nombre propio: portal.js ya define su totalPasos (que además cuenta los
  // ejercicios hands-on). Acá medimos conceptos + quiz + desafío por taller.
  const pasosPrograma = () => TALLERES.reduce((a,t) => a + t.conceptos.length + 2, 0);
  const TIPOS_AVANCE = new Set(['concepto','quiz','desafio']);
  const nom = id => NOMBRES[id] || id;

  async function cargarNombres(){
    const ids = [...new Set([1,2,3].flatMap(t => CONCEPTOS[t]))];
    await Promise.all(ids.map(async id => {
      try {
        const r = await fetch(`/bloques/${id}/meta.json`);
        if (r.ok){ const m = await r.json(); NOMBRES[id] = `${m.emoji} ${m.nombre}`; }
      } catch (e) { /* cae al id */ }
    }));
  }

  async function entrar(){
    const pw = document.getElementById('pw').value;
    const err = document.getElementById('login-err');
    err.classList.remove('show');
    if (!pw) { err.textContent = 'Escribe la contraseña.'; err.classList.add('show'); return; }

    try {
      const r = await fetch('/api/claude-panel', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ password: pw })
      });
      const data = await r.json();
      if (!r.ok) { err.textContent = data.error || 'No se pudo entrar.'; err.classList.add('show'); return; }
      PART = data.participantes || [];
      PROG = data.progreso || [];
      await cargarNombres();
      document.getElementById('login').style.display = 'none';
      document.getElementById('panel').style.display = 'block';
      render();
    } catch (e) {
      err.textContent = 'Error de conexión. Intenta de nuevo.';
      err.classList.add('show');
    }
  }

  document.getElementById('pw').addEventListener('keydown', e => { if (e.key === 'Enter') entrar(); });

  // hecho[participante][taller] = { quiz, desafio, conceptos:Set }
  function indexar(){
    const idx = {};
    PROG.forEach(p => {
      idx[p.participante_id] = idx[p.participante_id] || {};
      const t = idx[p.participante_id][p.taller] = idx[p.participante_id][p.taller]
        || { conceptos: new Set(), ejercicios: new Set() };
      if (p.tipo === 'concepto')      t.conceptos.add(p.concepto);
      else if (p.tipo === 'ejercicio') t.ejercicios.add(p.concepto);
      else t[p.tipo] = p;
    });
    return idx;
  }

  /* ---------------- Agrupación de empresas ----------------
     La gente escribe el nombre a mano, así que la misma empresa llega como
     «DT Peñuelas», «DT Peñuelas SpA» o «Penuelas» sin ñ. Se normaliza para
     que caigan todas en el mismo grupo. */

  // Formas societarias y palabras genéricas que no distinguen a una empresa
  const RUIDO = new Set([
    'sa','s','a','spa','sac','srl','ltda','limitada','ltd','inc','corp','corporacion',
    'cia','compania','sociedad','eirl','llc','group','grupo','holding','empresa','empresas',
    'comercial','servicios','consultora','consultores','de','del','la','el','los','las','y'
  ]);

  function claveEmpresa(nombre){
    const base = String(nombre || '')
      .toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')   // Peñuelas = Penuelas
      .replace(/[^a-z0-9\s]/g, ' ')
      .split(/\s+/).filter(Boolean);
    const utiles = base.filter(w => !RUIDO.has(w));
    // Si al sacar el ruido no queda nada (ej. «SpA»), vale el original
    return (utiles.length ? utiles : base).join(' ') || '__sin-empresa';
  }

  // Uniones que hace Felipe a mano, para casos que la máquina no puede saber
  // (por ejemplo si «DT Peñuelas» y «Family Office Peñuelas» son lo mismo).
  let ALIAS = {};
  try { ALIAS = JSON.parse(localStorage.getItem('claude_panel_alias')) || {}; } catch (e) { ALIAS = {}; }
  const guardarAlias = () => localStorage.setItem('claude_panel_alias', JSON.stringify(ALIAS));
  const grupoDe = p => agrupar ? (ALIAS[claveEmpresa(p.empresa)] || claveEmpresa(p.empresa)) : p.empresa_slug;

  function empresas(){
    const m = new Map();
    PART.forEach(p => {
      const k = grupoDe(p);
      const cur = m.get(k) || { slug: k, variantes: new Map(), n: 0 };
      cur.n++;
      cur.variantes.set(p.empresa, (cur.variantes.get(p.empresa) || 0) + 1);
      m.set(k, cur);
    });
    return [...m.values()].map(e => {
      // Etiqueta: la forma más usada; a igualdad, la más corta
      const vs = [...e.variantes.entries()].sort((a,b) => b[1]-a[1] || a[0].length-b[0].length);
      return { ...e, nombre: vs[0][0], variantes: vs.map(v => v[0]) };
    }).sort((a,b) => b.n - a.n);
  }

  // Grupos que comparten una palabra con peso: candidatos a ser la misma
  // empresa, pero no lo bastante claros como para juntarlos sin preguntar.
  function sugerencias(emps){
    const out = [];
    const palabras = e => new Set(e.slug.split(' ').filter(w => w.length >= 5));
    for (let i = 0; i < emps.length; i++) for (let j = i + 1; j < emps.length; j++){
      const a = emps[i], b = emps[j];
      const pa = palabras(a), pb = palabras(b);
      if ([...pa].some(w => pb.has(w))) out.push([a, b]);
    }
    return out.slice(0, 6);   // no llenar la pantalla de sugerencias
  }

  function unir(a, b){
    // El grupo con más gente se queda como destino
    const [dest, src] = a.n >= b.n ? [a, b] : [b, a];
    ALIAS[src.slug] = dest.slug;
    Object.keys(ALIAS).forEach(k => { if (ALIAS[k] === src.slug) ALIAS[k] = dest.slug; });
    guardarAlias(); filtro = '__all__'; render();
  }

  function separarTodo(){ ALIAS = {}; guardarAlias(); filtro = '__all__'; render(); }
  function toggleAgrupar(){ agrupar = !agrupar; filtro = '__all__'; render(); }

  const visibles = () => filtro === '__all__' ? PART : PART.filter(p => grupoDe(p) === filtro);

  const tallerCompleto = (idx, p, t) =>
    !!(idx[p.id]?.[t]?.quiz && idx[p.id]?.[t]?.desafio &&
       (idx[p.id]?.[t]?.conceptos?.size || 0) === CONCEPTOS[t].length);

  function render(){
    const idx = indexar();
    const emps = empresas();

    document.getElementById('filters').innerHTML =
      [`<button class="fbtn ${filtro==='__all__'?'on':''}" onclick="setFiltro('__all__')">Todas (${PART.length})</button>`]
      .concat(emps.map(e => {
        // El título muestra bajo qué formas se escribió, para que se vea qué agrupó
        const tit = e.variantes.length > 1 ? ` title="Agrupa: ${esc(e.variantes.join(' · '))}"` : '';
        const marca = e.variantes.length > 1 ? `<span class="vcount">${e.variantes.length}</span>` : '';
        return `<button class="fbtn ${filtro===e.slug?'on':''}"${tit} onclick="setFiltro('${esc(e.slug)}')">${esc(e.nombre)} (${e.n})${marca}</button>`;
      }))
      .concat([`<button class="fbtn alt" onclick="toggleAgrupar()" title="${agrupar?'Ver cada forma de escribir por separado':'Juntar las variantes de una misma empresa'}">${agrupar ? '⛓ Agrupadas' : '⛓‍💥 Sin agrupar'}</button>`])
      .join('');

    // Grupos que podrían ser lo mismo pero la máquina no puede asegurarlo
    const sug = agrupar ? sugerencias(emps) : [];
    const hayAlias = Object.keys(ALIAS).length > 0;
    document.getElementById('sugerencias').innerHTML = (!sug.length && !hayAlias) ? '' : `
      <div class="sug">
        <b>${sug.length ? '¿Son la misma empresa?' : 'Uniones aplicadas'}</b>
        ${sug.map(([a,b]) => `<button class="sug-b" onclick="unirPorSlug('${esc(a.slug)}','${esc(b.slug)}')">
            ${esc(a.nombre)} <span>+</span> ${esc(b.nombre)} <span>unir</span>
          </button>`).join('')}
        ${hayAlias ? `<button class="sug-b off" onclick="separarTodo()">deshacer uniones</button>` : ''}
      </div>`;

    const vis = visibles();
    const variantes = new Set(PART.map(p => p.empresa)).size;
    document.getElementById('sub').textContent =
      `${vis.length} participante${vis.length===1?'':'s'} · ${emps.length} empresa${emps.length===1?'':'s'}`
      + (agrupar && variantes > emps.length ? ` (agrupadas desde ${variantes} formas de escribirlas)` : '');

    const visIds = new Set(vis.map(p => p.id));
    const míos = PROG.filter(g => visIds.has(g.participante_id));

    const completos = vis.filter(p => [1,2,3].every(t => tallerCompleto(idx, p, t))).length;
    const quizzes = míos.filter(g => g.tipo === 'quiz');
    const conNota = quizzes.filter(q => q.quiz_total > 0);
    const promedio = conNota.length
      ? Math.round(conNota.reduce((a,q) => a + (q.quiz_score / q.quiz_total), 0) / conNota.length * 100)
      : null;
    // Numerador y denominador tienen que medir lo mismo: los ejercicios
    // hands-on quedan fuera de ambos.
    const míosAvance = míos.filter(g => TIPOS_AVANCE.has(g.tipo));
    const avance = vis.length ? Math.round(míosAvance.length / (vis.length * pasosPrograma()) * 100) : 0;

    document.getElementById('kpis').innerHTML = `
      <div class="kpi"><div class="kpi-v">${vis.length}</div><div class="kpi-l">Participantes</div></div>
      <div class="kpi"><div class="kpi-v">${avance}%</div><div class="kpi-l">Avance global</div></div>
      <div class="kpi"><div class="kpi-v">${completos}</div><div class="kpi-l">Programa completo</div></div>
      <div class="kpi"><div class="kpi-v">${quizzes.length}</div><div class="kpi-l">Quizzes rendidos</div></div>
      <div class="kpi"><div class="kpi-v">${promedio===null?'—':promedio+'%'}</div><div class="kpi-l">Promedio quiz</div></div>`;

    // Avance por taller: quiz, desafío y cada concepto por separado
    document.getElementById('tallers').innerHTML = [1,2,3].map(t => {
      const barra = (label, n) => {
        const pct = vis.length ? Math.round(n / vis.length * 100) : 0;
        return `<div class="bar-row">
          <div class="bar-lbl"><span>${esc(label)}</span><span>${n}/${vis.length} · ${pct}%</span></div>
          <div class="bar-bg"><div class="bar-fl" style="width:${pct}%"></div></div>
        </div>`;
      };
      const filas = [
        barra('Quiz',    vis.filter(p => idx[p.id]?.[t]?.quiz).length),
        barra('Desafío', vis.filter(p => idx[p.id]?.[t]?.desafio).length),
        barra('Ejercicios hands-on',
              vis.filter(p => (idx[p.id]?.[t]?.ejercicios?.size || 0) === CONCEPTOS[t].length).length),
        ...CONCEPTOS[t].map(c => barra(nom(c), vis.filter(p => idx[p.id]?.[t]?.conceptos?.has(c)).length)),
      ].join('');
      const qs = míos.filter(g => g.taller===t && g.tipo==='quiz' && g.quiz_total > 0);
      const prom = qs.length ? Math.round(qs.reduce((a,q)=>a+(q.quiz_score/q.quiz_total),0)/qs.length*100) : null;
      return `<div class="tcard">
        <div class="tcard-t">${TALLER_NOMBRE[t]}</div>
        ${filas}
        <div class="tcard-q">Promedio del quiz: <b>${prom===null?'sin datos':prom+'%'}</b> ${qs.length?`(${qs.length} rendido${qs.length===1?'':'s'})`:''}</div>
      </div>`;
    }).join('');

    const tb = document.getElementById('tbody');
    if (!vis.length){
      tb.innerHTML = `<tr><td colspan="7"><div class="empty">Todavía no hay participantes registrados.</div></td></tr>`;
      return;
    }
    tb.innerHTML = vis.map(p => {
      const cell = t => {
        const d = idx[p.id]?.[t] || {};
        const nC = d.conceptos?.size || 0;
        return `<td><div class="tgrp">
          <div class="tg"><div class="dot ${d.quiz?'on':''}"></div><div class="tg-n">Q</div></div>
          <div class="tg"><div class="dot ${d.desafio?'on':''}"></div><div class="tg-n">D</div></div>
          <div class="tg"><div class="dot ${nC===CONCEPTOS[t].length?'on':(nC?'half':'')}"></div><div class="tg-n">${nC}/${CONCEPTOS[t].length}</div></div>
        </div></td>`;
      };
      const stars = [1,2,3].filter(t => tallerCompleto(idx, p, t)).length;
      const notas = [1,2,3].map(t => {
        const q = idx[p.id]?.[t]?.quiz;
        return (q && q.quiz_total) ? `${q.quiz_score}/${q.quiz_total}` : '—';
      }).join(' · ');
      return `<tr>
        <td><div class="p-name">${esc(p.nombre)}</div><div class="p-mail">${esc(p.email)}</div></td>
        <td>${esc(p.empresa)}<div class="p-mail">${esc(p.cargo || '')}</div></td>
        ${cell(1)}${cell(2)}${cell(3)}
        <td class="stars-c">${stars ? '⭐'.repeat(stars) : '—'}</td>
        <td>${notas}</td>
      </tr>`;
    }).join('');
  }

  function setFiltro(f){ filtro = f; render(); }
  function unirPorSlug(a, b){
    const emps = empresas();
    const ea = emps.find(e => e.slug === a), eb = emps.find(e => e.slug === b);
    if (ea && eb) unir(ea, eb);
  }

  function esc(s){
    return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
</script>
