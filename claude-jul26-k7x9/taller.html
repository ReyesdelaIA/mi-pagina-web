<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Sesión · Portal Claude · Reyes IA</title>
  <link rel="icon" type="image/png" href="/icon%20reyes%20IA.png" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/claude-jul26-k7x9/portal.css" />
  <style>
    body { display: flex; flex-direction: column; min-height: 100vh; }

    /* Cabecera del taller con el stepper */
    .thead { background: var(--ink); color:#fff; padding: 16px 20px 0; }
    .thead-in { max-width: 900px; margin: 0 auto; }
    .thead-label { font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.7px; color:var(--amber-light); }
    .thead-title { font-size:17px; font-weight:800; line-height:1.25; margin-top:2px; }
    .stepper { display:flex; gap:5px; margin-top:14px; padding-bottom:14px; }
    .step-dot { flex:1; display:flex; flex-direction:column; gap:5px; background:none; border:none; padding:0; cursor:pointer; font-family:inherit; }
    .step-dot i { display:block; height:5px; border-radius:99px; background:rgba(255,255,255,.2); transition:background .3s; }
    .step-dot.done i { background:var(--green); }
    .step-dot.now  i { background:var(--amber-light); }
    .step-dot span { font-size:8.5px; font-weight:700; color:rgba(255,255,255,.45); text-transform:uppercase; letter-spacing:.3px; text-align:left; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .step-dot.now span { color:#fff; }
    .step-dot.lock { cursor:not-allowed; opacity:.42; }
    .step-dot:not([disabled]):hover i { background:rgba(255,255,255,.45); }

    /* Escenario */
    main { flex:1; padding: 28px 20px 40px; }
    .escena { max-width: 900px; margin: 0 auto; }

    .visual { border-radius:22px; overflow:hidden; margin-bottom:28px; border:1px solid var(--border);
      background:#fff; box-shadow:0 10px 34px rgba(26,37,55,.10); }
    .visual img { width:100%; display:block; }
    .visual-emoji { height:200px; display:flex; align-items:center; justify-content:center; font-size:80px;
      background:linear-gradient(135deg,#FFFBEB,#FDE68A); }

    .paso-n { font-size:11.5px; font-weight:800; color:var(--amber); text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; }
    /* Cintillo del bloque: arte propio que va bajo el título, sin recuadro */
    .c-banner { margin:0 0 20px; max-width:560px; }
    .c-banner img { width:100%; display:block; }
    .c-nombre { font-size:30px; font-weight:800; color:var(--ink); line-height:1.15; margin-bottom:12px; letter-spacing:-.4px; }
    .c-desc { font-size:16px; color:#4B5563; line-height:1.7; margin-bottom:30px; max-width:70ch; }

    .lista { display:flex; flex-direction:column; gap:14px; margin-bottom:26px; }
    .paso-item { display:flex; gap:16px; background:#fff; border:1px solid var(--border); border-radius:16px;
      padding:18px 20px; font-size:14.5px; color:#374151; line-height:1.7;
      box-shadow:0 2px 10px rgba(26,37,55,.04); transition:box-shadow .2s, transform .2s; }
    .paso-item:hover { box-shadow:0 6px 20px rgba(26,37,55,.09); transform:translateY(-1px); }
    .paso-img { margin:18px 0 6px; border-radius:20px; overflow:hidden; border:1px solid var(--border);
      background:#fff; box-shadow:0 12px 38px rgba(26,37,55,.14); }
    .paso-img img { width:100%; display:block; }
    /* Capturas verticales: a todo el ancho se verían estiradas */
    .paso-img.angosta { max-width:420px; margin-left:auto; margin-right:auto; }

    /* Paso de instrucción puntual: la captura chica al lado del texto, no a
       pantalla completa. Para el «anda acá y aprieta esto» que no merece
       una imagen gigante. */
    .paso-instr { display:flex; gap:16px; align-items:center; }
    .paso-instr .pi-img { flex:0 0 280px; margin:0; border-radius:14px; overflow:hidden;
      border:1px solid var(--border); background:#fff; box-shadow:0 6px 20px rgba(26,37,55,.12); }
    .paso-instr .pi-img img { width:100%; display:block; }
    .pi-box { flex:1; display:flex; gap:14px; align-items:flex-start;
      background:#EFF6FF; border:1.5px solid #BFDBFE; border-radius:16px;
      padding:18px 20px; font-size:14.5px; color:#1E3A5F; line-height:1.7; }
    .pi-box .num { background:#DBEAFE; color:#1D4ED8; }
    @media(max-width:819px){
      .paso-instr { flex-direction:column; align-items:stretch; }
      .paso-instr .pi-img { flex:none; max-width:280px; }
    }

    /* Paso de recurso: manda a algo que está fuera del portal (un prompt
       listo, una herramienta). Va en verde para que se note que es un link. */
    .paso-recurso {
      display:flex; gap:16px; align-items:flex-start;
      background:linear-gradient(135deg,#F0FDF4,#DCFCE7);
      border:1.5px solid #A7F3D0; border-radius:16px;
      padding:18px 20px; font-size:14.5px; color:#14532D; line-height:1.7;
    }
    .paso-recurso .num { background:#D1FAE5; color:#047857; }
    .pr-link {
      display:inline-flex; align-items:center; gap:8px; margin-top:13px;
      background:var(--green); color:#fff; text-decoration:none;
      font-weight:700; font-size:13.5px; padding:11px 18px; border-radius:11px;
      transition:filter .15s;
    }
    .pr-link:hover { filter:brightness(1.07); }
    .num { flex-shrink:0; width:28px; height:28px; border-radius:50%; background:#FEF3C7; color:var(--amber-dark);
      font-size:13px; font-weight:800; display:flex; align-items:center; justify-content:center; margin-top:1px; }

    .tip { background:linear-gradient(135deg,#FFFBEB,#FEF3C7); border:1px solid #FDE68A; border-radius:16px;
      padding:18px 22px; font-size:14.5px; color:#5C3D00; line-height:1.7; margin-bottom:30px; }
    .tip b { color:var(--amber-dark); }

    .acciones { display:flex; flex-direction:column; gap:10px; }
    .acciones .btn { padding:16px; font-size:15px; width:100%; border-radius:14px; }
    .marcado { display:flex; align-items:center; justify-content:center; gap:8px; background:#ECFDF5; border:1.5px solid #A7F3D0; color:var(--green-dark); border-radius:12px; padding:13px; font-size:13.5px; font-weight:700; }

    /* Quiz */
    .q-num { font-size:11px; font-weight:800; color:var(--amber); text-transform:uppercase; letter-spacing:.6px; margin-bottom:6px; }
    .q-text { font-size:20px; font-weight:800; color:var(--ink); line-height:1.35; margin-bottom:18px; }
    .opts { display:flex; flex-direction:column; gap:10px; margin-bottom:16px; }
    .opt { background:#fff; border:1.5px solid var(--border); border-radius:12px; padding:14px 16px; font-size:14px; font-weight:500; color:#222; cursor:pointer; text-align:left; font-family:inherit; line-height:1.45; transition:all .15s; }
    .opt:hover:not(:disabled) { border-color:var(--amber); background:#FFF8EC; }
    .opt.correct { background:#ECFDF5; border-color:var(--green); color:var(--green-dark); }
    .opt.wrong   { background:#FEF2F2; border-color:#EF4444; color:#991B1B; }
    .opt:disabled { cursor:default; }
    .fb { font-size:13.5px; line-height:1.6; border-radius:12px; padding:13px 16px; margin-bottom:16px; display:none; }
    .fb.ok  { background:#ECFDF5; color:var(--green-dark); border:1px solid #A7F3D0; display:block; }
    .fb.no  { background:#FEF2F2; color:#7F1D1D; border:1px solid #FECACA; display:block; }

    /* Ejercicios hands-on */
    .ejercicios { display:flex; flex-direction:column; gap:12px; }
    .ej { background:#fff; border:1.5px solid var(--border); border-radius:14px; padding:14px 15px; transition:border-color .2s; }
    .ej.done { border-color:#A7F3D0; background:#F7FDFA; }
    .ej-head { display:flex; gap:12px; align-items:flex-start; }
    .ej-n { flex-shrink:0; width:24px; height:24px; border-radius:50%; background:var(--amber); color:#fff; font-size:12px; font-weight:800; display:flex; align-items:center; justify-content:center; }
    .ej.done .ej-n { background:var(--green); }
    .ej-t { flex:1; min-width:0; }
    .ej-tema { font-size:12px; font-weight:800; color:var(--amber-dark); margin-bottom:4px; }
    .ej.done .ej-tema { color:var(--green-dark); }
    .ej-enun { font-size:13.5px; color:#374151; line-height:1.6; }
    .ej-tick { flex-shrink:0; width:22px; height:22px; border-radius:50%; border:1.5px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:12px; color:transparent; }
    .ej.done .ej-tick { background:var(--green); border-color:var(--green); color:#fff; }
    .ej-prompt { margin-top:12px; background:#1a2537; border-radius:10px; overflow:hidden; }
    .ej-prompt-top { display:flex; align-items:center; justify-content:space-between; padding:7px 12px; background:rgba(255,255,255,.06); font-size:10.5px; font-weight:700; color:rgba(255,255,255,.6); text-transform:uppercase; letter-spacing:.5px; }
    .ej-copy { background:rgba(255,255,255,.15); border:none; color:#fff; border-radius:6px; padding:4px 10px; font-size:10.5px; font-weight:700; font-family:inherit; cursor:pointer; }
    .ej-copy:hover { background:rgba(255,255,255,.28); }
    .ej-prompt code { display:block; padding:12px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; color:#E5E7EB; line-height:1.6; white-space:pre-wrap; }
    .ej-acc { margin-top:12px; }
    .ej-acc .btn { padding:9px 16px; font-size:12.5px; }
    .ej-listo { font-size:12.5px; font-weight:700; color:var(--green-dark); }

    /* Desafío */
    .des-box { background:linear-gradient(135deg,#FFF8EC,#FFF3DC); border:1.5px solid #F5CC7A; border-radius:16px; padding:20px; margin-bottom:20px; }
    .des-txt { font-size:14.5px; color:#5C3D00; line-height:1.65; }
    .des-titulo { font-size:18px; font-weight:800; color:#3D2800; margin-bottom:8px; letter-spacing:-.2px; }
    .des-pasos { margin:16px 0 0; padding:0; list-style:none; counter-reset:dp; }
    .des-pasos li { counter-increment:dp; position:relative; padding:0 0 0 34px; margin-bottom:13px; font-size:14.5px; color:#5C3D00; line-height:1.6; }
    .des-pasos li::before { content:counter(dp); position:absolute; left:0; top:1px; width:23px; height:23px; border-radius:50%; background:#E8A33D; color:#fff; font-size:12px; font-weight:800; display:flex; align-items:center; justify-content:center; }
    .des-cierre { margin-top:16px; padding-top:14px; border-top:1px solid rgba(197,150,60,.35); font-size:13.5px; color:#7A5A14; line-height:1.6; }

    /* Final */
    .fin { text-align:center; padding: 20px 0; }
    .fin-star { font-size:64px; line-height:1; margin-bottom:6px; }
    .fin-h { font-size:26px; font-weight:800; color:var(--ink); margin-bottom:8px; }
    .fin-p { font-size:14px; color:var(--muted); line-height:1.6; max-width:440px; margin:0 auto 22px; }
    .fin-hab { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:24px; }
    .fin-chip { background:#fff; border:1.5px solid #A7F3D0; border-radius:20px; padding:6px 13px; font-size:12px; font-weight:700; color:var(--green-dark); }
    .fin-acc { display:flex; flex-direction:column; gap:9px; max-width:340px; margin:0 auto; }
    .fin-acc .btn { padding:14px; font-size:14px; }

    .navrow { display:flex; justify-content:flex-end; align-items:center; max-width:900px; margin:28px auto 0; }
    .prev { background:none; border:none; color:var(--muted); font-size:12.5px; font-weight:700; font-family:inherit; cursor:pointer; padding:8px 0; }
    .prev:hover { color:var(--ink); }
    .prev:disabled { opacity:.3; cursor:default; }
    .contador { font-size:11.5px; color:var(--muted); font-weight:600; }

    @media(min-width:820px){
      .thead { padding: 22px 20px 0; }
      .thead-title { font-size:21px; }
      main { padding: 30px 20px 40px; }
      .c-nombre { font-size:40px; }
      .c-desc { font-size:17px; margin-bottom:36px; }
      .acciones { flex-direction:row-reverse; justify-content:flex-end; margin-top:8px; }
      .acciones .btn { width:auto; min-width:280px; }
      .acciones .btn.btn-ghost { min-width:auto; }
      .visual-emoji { height:280px; font-size:104px; }
      .paso-item { font-size:15px; padding:20px 24px; }
      .paso-img { margin:26px 0 10px; }
      .tip { font-size:15px; padding:20px 26px; }
    }
  </style>
</head>
<body>

<nav>
  <a href="/claude-jul26-k7x9" class="nav-back" id="nav-hub">← Volver al programa</a>
  <div class="nav-right">
    <button class="nav-back" id="btn-skills">🧠 Habilidades</button>
  </div>
</nav>

<div class="thead">
  <div class="thead-in">
    <div class="thead-label" id="t-label">—</div>
    <div class="thead-title" id="t-title">—</div>
    <div class="stepper" id="stepper"></div>
  </div>
</div>

<main>
  <div class="escena" id="escena"></div>
  <div class="navrow">
    <span class="contador" id="contador"></span>
  </div>
</main>

<footer>Programa facilitado por <a href="https://reyesia.com" target="_blank" rel="noopener">Reyes IA</a> · Felipe Reyes · <span id="pie-ver"></span></footer>

<script src="/claude-jul26-k7x9/portal.js"></script>
<script>
  const N = (() => {
    const p = new URLSearchParams(location.search).get('n');
    const m = location.pathname.match(/taller-(\d)/);
    const n = parseInt(p || (m && m[1]) || '1', 10);
    return [1,2,3].includes(n) ? n : 1;
  })();

  const taller = T(N);
  let paso = 0;          // índice dentro de RUTA
  let RUTA = [];         // pantallas del recorrido, en orden

  let qIdx = 0, qAciertos = 0, qRespondida = false;

  function onIdentidad(){ pintar(); }
  // Si al identificarse recuperamos avance del servidor, hay que recalcular
  // en qué pantalla retomar: puede venir con conceptos ya recorridos.
  function onProgresoRecuperado(){ retomar(); }

  /* ---------------- Ruta: un concepto puede ocupar varias pantallas ---------------- */

  function construirRuta(){
    RUTA = [];
    taller.conceptos.forEach((id, ci) => {
      const b = BLOQUES[id];
      const pasos = (b && Array.isArray(b.pasos)) ? b.pasos : [];
      const grupos = [[]];
      let n = 0;
      pasos.forEach(p => {
        const o = (typeof p === 'string') ? { texto: p } : Object.assign({}, p);
        if (o.corte && grupos[grupos.length - 1].length) grupos.push([]);
        o._n = ++n;                       // numeración continua entre pantallas
        grupos[grupos.length - 1].push(o);
      });
      grupos.forEach((g, gi) => RUTA.push({
        tipo: 'concepto', id, ci, pasos: g,
        parte: gi + 1, partes: grupos.length, ultima: gi === grupos.length - 1
      }));
    });
    RUTA.push({ tipo: 'quiz' });
    RUTA.push({ tipo: 'ejercicios' });
    RUTA.push({ tipo: 'desafio' });
    RUTA.push({ tipo: 'fin' });
  }

  const iFin = () => RUTA.length - 1;
  const idxDe = tipo => RUTA.findIndex(r => r.tipo === tipo);

  // Recorrido guiado: no se salta hacia adelante, pero siempre puedes volver.
  // Retoma en la primera pantalla pendiente, sin pasarse de lo ya alcanzado
  function retomar(){
    let p = 0;
    while (p < iFin() && grupoHecho(RUTA[p])) p++;
    paso = Math.min(p, Math.max(maxAlcanzado(), p));
    desbloquear(paso);
    pintar();
  }

  const maxAlcanzado = () => Math.max(0, parseInt(st[`${N}-max`] || 0, 10));
  function desbloquear(i){ if (i > maxAlcanzado()){ st[`${N}-max`] = i; saveStars(); } }

  /* ---------------- Stepper: un punto por concepto, no por pantalla ---------------- */

  function grupoHecho(g){
    if (g.tipo === 'concepto')   return !!st[`c-${g.id}`];
    if (g.tipo === 'quiz')       return !!st[`${N}-quiz`];
    if (g.tipo === 'ejercicios'){ const e = ejerciciosDe(N); return e.length > 0 && ejerciciosOk(N) === e.length; }
    if (g.tipo === 'desafio')    return !!st[`${N}-des`];
    return false;
  }

  function grupos(){
    const out = [];
    taller.conceptos.forEach((id, ci) => {
      const b = BLOQUES[id];
      out.push({ tipo:'concepto', id, ci, txt: b ? b.emoji : (ci + 1),
                 i: RUTA.findIndex(r => r.tipo === 'concepto' && r.ci === ci) });
    });
    out.push({ tipo:'quiz',       txt:'🧠 Quiz',       i: idxDe('quiz') });
    out.push({ tipo:'ejercicios', txt:'🔨 Ejercicios', i: idxDe('ejercicios') });
    out.push({ tipo:'desafio',    txt:'🎯 Desafío',    i: idxDe('desafio') });
    return out;
  }

  function pintarStepper(){
    const tope = maxAlcanzado();
    const actual = RUTA[paso] || {};
    document.getElementById('stepper').innerHTML = grupos().map(g => {
      const bloqueado = g.i > tope;
      const ahora = (g.tipo === 'concepto')
        ? (actual.tipo === 'concepto' && actual.ci === g.ci)
        : actual.tipo === g.tipo;
      return `
      <button class="step-dot ${grupoHecho(g) ? 'done' : ''} ${ahora ? 'now' : ''} ${bloqueado ? 'lock' : ''}"
              data-i="${g.i}" ${bloqueado ? 'disabled' : ''}
              title="${bloqueado ? 'Todavía no llegas a este paso' : 'Volver a este paso'}">
        <i></i><span>${bloqueado ? '🔒' : ''} ${g.txt}</span>
      </button>`;
    }).join('');
    document.querySelectorAll('.step-dot:not([disabled])').forEach(b => {
      b.onclick = () => { paso = parseInt(b.dataset.i, 10); reiniciarQuiz(); pintar(); };
    });
  }

  function reiniciarQuiz(){ qIdx = 0; qAciertos = 0; qRespondida = false; }

  /* ---------------- Pantallas ---------------- */

  function visualHTML(id, emoji){
    const img = id ? imagenDe(id) : null;
    return img
      ? `<div class="visual"><img src="${img}" alt="" /></div>`
      : `<div class="visual"><div class="visual-emoji">${emoji || '💡'}</div></div>`;
  }

  function pantallaConcepto(r){
    const b = BLOQUES[r.id];
    if (!b) return `<div class="c-nombre">Cargando…</div>`;
    const marcado = !!st[`c-${r.id}`];
    const tituloPantalla = r.pasos[0] && r.pasos[0].titulo;
    const hayImgs = r.pasos.some(p => p.img);

    const encabezado = `
      <div class="paso-n">Concepto ${r.ci + 1} de ${taller.conceptos.length}${
        r.partes > 1 ? ` · parte ${r.parte} de ${r.partes}` : ''}</div>
      <h1 class="c-nombre">${esc(tituloPantalla || b.nombre)}</h1>
      ${r.parte === 1 && b.banner ? `<figure class="c-banner"><img src="/bloques/${r.id}/${b.banner}" alt="" /></figure>` : ''}
      ${r.parte === 1 ? `<p class="c-desc">${esc(b.descripcion)}</p>` : ''}`;

    const cuerpo = r.pasos.map(o => {
      // `recurso` es un paso que manda afuera: cuadro verde con su botón
      if (o.recurso) return `
        <div class="paso-recurso">
          <span class="num">${o._n}</span>
          <div>
            <span>${esc(o.texto)}</span>
            ${o.url ? `<a class="pr-link" href="${esc(o.url)}" target="_blank" rel="noopener">${esc(o.url_texto || 'Abrir')} →</a>` : ''}
          </div>
        </div>${o.img ? `<figure class="paso-img"><img src="/bloques/${r.id}/${o.img}" alt="" /></figure>` : ''}`;

      // `instr` deja la captura chica al lado del texto, en vez de a lo ancho
      if (o.instr && o.img) return `
        <div class="paso-instr">
          <figure class="pi-img"><img src="/bloques/${r.id}/${o.img}" alt="" /></figure>
          <div class="pi-box"><span class="num">${o._n}</span><span>${esc(o.texto)}</span></div>
        </div>`;
      const img = o.img ? `<figure class="paso-img${o.angosta ? ' angosta' : ''}"><img src="/bloques/${r.id}/${o.img}" alt="" /></figure>` : '';
      return `<div class="paso-item"><span class="num">${o._n}</span><span>${esc(o.texto)}</span></div>${img}`;
    }).join('');

    // El pro tip y el check solo al final del concepto
    // Un solo botón: el avance registra el concepto. Pedirle a la gente que
    // se autoevalúe agrega fricción y devuelve un dato poco confiable.
    const cierre = `
      ${r.ultima && b.pro_tip ? `<div class="tip"><b>💡 Pro tip:</b> ${esc(b.pro_tip)}</div>` : ''}
      ${r.ultima && marcado ? '<div class="marcado">✓ Ya recorriste este concepto</div>' : ''}
      <div class="acciones">
        <button class="btn btn-amber" id="a-sig">Continuar →</button>
        <button class="btn btn-ghost" id="a-atras">← Volver atrás</button>
      </div>`;

    // Portada explícita del bloque; si no hay y tampoco imágenes en los pasos,
    // cae al recuadro con emoji.
    const portada = (r.parte === 1 && b.portada)
      ? `<div class="visual"><img src="/bloques/${r.id}/${b.portada}" alt="" /></div>`
      : (!hayImgs && r.parte === 1 ? visualHTML(r.id, b.emoji) : '');

    return `${portada}${encabezado}
      <div class="lista">${cuerpo}</div>${cierre}`;
  }

  function pantallaQuiz(){
    if (st[`${N}-quiz`]){
      const s = st[`${N}-quizScore`], t = st[`${N}-quizTotal`];
      return `
        <div class="visual"><img src="/claude-jul26-k7x9/img/quiz-portada.webp" alt="" /></div>
        <div class="paso-n">Quiz de la sesión</div>
        <h1 class="c-nombre">Quiz completado</h1>
        <p class="c-desc">${s != null ? `Respondiste <b>${s} de ${t}</b> correctamente.` : 'Ya rendiste este quiz.'}</p>
        <div class="acciones"><button class="btn btn-amber" id="a-sig">Continuar →</button></div>`;
    }
    const q = taller.quiz[qIdx];
    return `
      ${qIdx === 0 ? '<div class="visual"><img src="/claude-jul26-k7x9/img/quiz-portada.webp" alt="" /></div>' : ''}
      <div class="q-num">Pregunta ${qIdx + 1} de ${taller.quiz.length}</div>
      <h1 class="q-text">${esc(q.q)}</h1>
      <div class="opts" id="opts">
        ${q.opts.map((o, i) => `<button class="opt" data-i="${i}">${esc(o)}</button>`).join('')}
      </div>
      <div class="fb" id="fb"></div>
      <div class="acciones" id="acc-q"></div>`;
  }

  function pantallaEjercicios(){
    const lista = ejerciciosDe(N);
    if (!lista.length){
      return `${visualHTML(null,'🔨')}
        <div class="paso-n">Ejercicios</div>
        <h1 class="c-nombre">Sin ejercicios en esta sesión</h1>
        <p class="c-desc">Esta sesión no trae ejercicios hands-on.</p>
        <div class="acciones"><button class="btn btn-amber" id="a-sig">Continuar →</button></div>`;
    }
    const hechos = ejerciciosOk(N);
    return `
      <div class="paso-n">Ejercicios hands-on · ${hechos} de ${lista.length}</div>
      <h1 class="c-nombre">Manos a la obra</h1>
      <p class="c-desc">Estos son para hacer durante la sesión. Si alguno no alcanzas, déjalo sin marcar: sirve para saber dónde apretar.</p>
      <div class="ejercicios">
        ${lista.map((e, i) => {
          const ok = !!st[`e-${e.id}`];
          return `
          <div class="ej ${ok ? 'done' : ''}" id="ej-${e.id}">
            <div class="ej-head">
              <span class="ej-n">${i + 1}</span>
              <div class="ej-t">
                <div class="ej-tema">${e.bloque.emoji} ${esc(e.bloque.nombre)}</div>
                <div class="ej-enun">${esc(e.enunciado)}</div>
              </div>
              <span class="ej-tick">✓</span>
            </div>
            ${e.prompt ? `
              <div class="ej-prompt">
                <div class="ej-prompt-top">
                  <span>Prompt sugerido</span>
                  <button class="ej-copy" data-copy="${esc(e.prompt)}">Copiar</button>
                </div>
                <code>${esc(e.prompt)}</code>
              </div>` : ''}
            <div class="ej-acc">
              ${ok ? '<span class="ej-listo">✓ Lo hiciste</span>'
                   : `<button class="btn btn-green ej-ok" data-ej="${e.id}">Lo hice ✓</button>`}
            </div>
          </div>`;
        }).join('')}
      </div>
      <div class="acciones" style="margin-top:20px">
        <button class="btn btn-amber" id="a-sig">${hechos === lista.length ? 'Continuar →' : 'Continuar sin marcar todos →'}</button>
      </div>`;
  }

  // El desafío puede ser un texto suelto o un objeto con pasos y prompt.
  function desafioHTML(d){
    if (typeof d === 'string') return `<div class="des-box"><div class="des-txt">${esc(d)}</div></div>`;
    return `
      <div class="des-box">
        ${d.titulo ? `<div class="des-titulo">${esc(d.titulo)}</div>` : ''}
        ${d.intro  ? `<div class="des-txt">${esc(d.intro)}</div>` : ''}
        ${Array.isArray(d.pasos) ? `<ol class="des-pasos">${d.pasos.map(p => `<li>${esc(p)}</li>`).join('')}</ol>` : ''}
        ${d.prompt ? `
          <div class="ej-prompt">
            <div class="ej-prompt-top">
              <span>Prompt para dictar</span>
              <button class="ej-copy" data-copy="${esc(d.prompt)}">Copiar</button>
            </div>
            <code>${esc(d.prompt)}</code>
          </div>` : ''}
        ${d.cierre ? `<div class="des-cierre">${esc(d.cierre)}</div>` : ''}
      </div>`;
  }

  function pantallaDesafio(){
    const hecho = !!st[`${N}-des`];
    return `
      ${visualHTML(null, '🎯')}
      <div class="paso-n">Desafío entre sesiones</div>
      <h1 class="c-nombre">Tu desafío</h1>
      ${desafioHTML(taller.desafio)}
      <div class="acciones">
        ${hecho
          ? `<div class="marcado">✓ Declaraste que completaste el desafío</div>
             <button class="btn btn-amber" id="a-sig">Continuar →</button>`
          : `<button class="btn btn-green" id="a-ok">Sí, lo completé con compromiso ✓</button>
             <button class="btn btn-ghost" id="a-no">Todavía no lo hago →</button>`}
      </div>`;
  }

  function pantallaFin(){
    const done = isComplete(N);
    const hab = taller.conceptos.filter(id => st[`c-${id}`]).map(id => BLOQUES[id]).filter(Boolean);
    const falta = [];
    const ej = ejerciciosDe(N);
    if (conceptosOk(N) < taller.conceptos.length) falta.push(`${taller.conceptos.length - conceptosOk(N)} concepto(s) por marcar`);
    if (ejerciciosOk(N) < ej.length) falta.push(`${ej.length - ejerciciosOk(N)} ejercicio(s)`);
    if (!st[`${N}-quiz`]) falta.push('el quiz');
    if (!st[`${N}-des`])  falta.push('el desafío');
    return `
      <div class="fin">
        <div class="fin-star">${done ? '⭐' : '🚧'}</div>
        <div class="fin-h">${done ? '¡Sesión dominada!' : 'Vas avanzando'}</div>
        <p class="fin-p">${done
          ? 'Completaste los conceptos, el quiz, los ejercicios y el desafío. Tu estrella ya está en el programa.'
          : `Para ganar la estrella de esta sesión te falta: ${esc(falta.join(', '))}.`}</p>
        ${hab.length ? `<div class="fin-hab">${hab.map(b => `<span class="fin-chip">${b.emoji} ${esc(b.nombre)}</span>`).join('')}</div>` : ''}
        <div class="fin-acc">
          <a class="btn btn-amber" href="${urlHub()}" style="text-align:center;text-decoration:none;display:block;">Volver al programa →</a>
          ${!done ? `<button class="btn btn-ghost" id="a-volver">Revisar lo que falta</button>` : ''}
        </div>
      </div>`;
  }

  /* ---------------- Pintado y acciones ---------------- */

  function pintar(){
    document.getElementById('t-label').textContent = taller.label;
    document.getElementById('t-title').textContent = taller.title;

    const r = RUTA[paso] || { tipo: 'fin' };
    const cont = document.getElementById('escena');
    if (r.tipo === 'concepto')        cont.innerHTML = pantallaConcepto(r);
    else if (r.tipo === 'quiz')       cont.innerHTML = pantallaQuiz();
    else if (r.tipo === 'ejercicios') cont.innerHTML = pantallaEjercicios();
    else if (r.tipo === 'desafio')    cont.innerHTML = pantallaDesafio();
    else                              cont.innerHTML = pantallaFin();

    pintarStepper();
    document.getElementById('contador').textContent =
      r.tipo === 'fin' ? 'Fin de la sesión' : `Pantalla ${paso + 1} de ${iFin()}`;
    conectar();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function avanzar(){
    const r = RUTA[paso];
    // Salir de la última pantalla de un concepto lo da por recorrido
    if (r && r.tipo === 'concepto' && r.ultima && !st[`c-${r.id}`]){
      st[`c-${r.id}`] = true; saveStars();
      syncProgreso(N, 'concepto', r.id);
      const b = BLOQUES[r.id];
      toast(`🧠 Habilidad desbloqueada: ${b ? b.nombre : r.id}`);
      renderSkills(r.id);
      if (isComplete(N)) { irAlFin(); return; }
    }
    paso = Math.min(paso + 1, iFin());
    desbloquear(paso);
    reiniciarQuiz();
    pintar();
  }

  function retroceder(){ paso = Math.max(paso - 1, 0); reiniciarQuiz(); pintar(); }

  function conectar(){
    const sig = document.getElementById('a-sig');
    if (sig) sig.onclick = avanzar;

    const atras = document.getElementById('a-atras');
    if (atras){ atras.disabled = paso === 0; atras.onclick = retroceder; }

    const no = document.getElementById('a-no');
    if (no) no.onclick = () => { toast('Sin problema, puedes volver cuando quieras'); avanzar(); };

    // El desafío sí es una declaración: ahí la elección tiene sentido.
    const ok = document.getElementById('a-ok');
    if (ok) ok.onclick = () => {
      st[`${N}-des`] = true; saveStars();
      syncProgreso(N, 'desafio', '');
      toast('🎯 ¡Desafío completado!');
      if (isComplete(N)) { irAlFin(); return; }
      avanzar();
    };

    const volver = document.getElementById('a-volver');
    if (volver) volver.onclick = () => { paso = 0; reiniciarQuiz(); pintar(); };

    document.querySelectorAll('.ej-ok').forEach(b => { b.onclick = () => marcarEjercicio(b.dataset.ej); });
    document.querySelectorAll('.ej-copy').forEach(b => {
      b.onclick = async () => {
        try { await navigator.clipboard.writeText(b.dataset.copy); b.textContent = 'Copiado ✓'; }
        catch (e) { b.textContent = 'Copia manual'; }
        setTimeout(() => { b.textContent = 'Copiar'; }, 1500);
      };
    });

    const opts = document.getElementById('opts');
    if (opts) opts.querySelectorAll('.opt').forEach(b => { b.onclick = () => responder(parseInt(b.dataset.i, 10)); });
  }

  function irAlFin(){
    paso = iFin(); desbloquear(paso); reiniciarQuiz(); pintar();
    toast('⭐ ¡Sesión dominada!');
  }

  function marcarEjercicio(id){
    if (st[`e-${id}`]) return;
    st[`e-${id}`] = true; saveStars();
    syncProgreso(N, 'ejercicio', id);
    const b = BLOQUES[id];
    toast(`🔨 Ejercicio completado: ${b ? b.nombre : id}`);
    if (isComplete(N)) { irAlFin(); return; }
    pintar();
  }

  function responder(i){
    if (qRespondida) return;
    qRespondida = true;
    const q = taller.quiz[qIdx];
    const ok = i === q.correct;
    if (ok) qAciertos++;
    syncRespuesta(N, qIdx, i, ok);
    document.querySelectorAll('.opt').forEach((b, idx) => {
      b.disabled = true;
      if (idx === q.correct) b.classList.add('correct');
      else if (idx === i) b.classList.add('wrong');
    });
    const fb = document.getElementById('fb');
    fb.className = 'fb ' + (ok ? 'ok' : 'no');
    fb.textContent = (ok ? '✅ Correcto. ' : '❌ No era esa. ') + q.explain;

    const ultima = qIdx === taller.quiz.length - 1;
    document.getElementById('acc-q').innerHTML =
      `<button class="btn btn-amber" id="a-qsig">${ultima ? 'Terminar quiz ✓' : 'Siguiente pregunta →'}</button>`;
    document.getElementById('a-qsig').onclick = () => {
      if (!ultima){ qIdx++; qRespondida = false; pintar(); return; }
      st[`${N}-quiz`] = true;
      st[`${N}-quizScore`] = qAciertos;
      st[`${N}-quizTotal`] = taller.quiz.length;
      saveStars();
      syncProgreso(N, 'quiz', '', qAciertos, taller.quiz.length);
      toast(`🧠 Quiz completado · ${qAciertos}/${taller.quiz.length} correctas`);
      if (isComplete(N)) { irAlFin(); return; }
      avanzar();
    };
  }

  document.getElementById('btn-skills').onclick = () => openSkills();
  document.getElementById('nav-hub').href = urlHub();
  document.getElementById('pie-ver').textContent = `Versión ${VERSION}`;

  (async () => {
    await bootPortal(taller.conceptos);
    construirRuta();
    retomar();
    renderSkills();
  })();
</script>
</body>
</html>
