                    <div style={{ textAlign: "right" }}>
                      <div style={{ fontSize: 22, fontWeight: 800, color: "#f59e0b", fontFamily: "monospace" }}>${p.ventaMM}M</div>
                      <div style={{ fontSize: 11, color: "#64748b" }}>Venta anual</div>
                    </div>
                  </div>

                  {expandedYear === i && (
                    <div>
                      <div style={{ marginBottom: 14 }}>
                        <div style={{ display: "flex", borderRadius: 8, overflow: "hidden", height: 28 }}>
                          <div style={{
                            width: `${Math.round(p.costoVentaMM / p.ventaMM * 100)}%`,
                            background: "#ef444444",
                            display: "flex", alignItems: "center", justifyContent: "center",
                            fontSize: 10, fontWeight: 700, color: "#ef4444"
                          }}>Costo {Math.round(p.costoVentaMM / p.ventaMM * 100)}%</div>
                          <div style={{
                            width: `${Math.round(p.gastosOpMM / p.ventaMM * 100)}%`,
                            background: "#f59e0b33",
                            display: "flex", alignItems: "center", justifyContent: "center",
                            fontSize: 10, fontWeight: 700, color: "#f59e0b"
                          }}>Gastos Op</div>
                          <div style={{
                            flex: 1,
                            background: p.ebitdaMM > 0 ? "#22c55e33" : "#ef444433",
                            display: "flex", alignItems: "center", justifyContent: "center",
                            fontSize: 10, fontWeight: 700, color: p.ebitdaMM > 0 ? "#22c55e" : "#ef4444"
                          }}>EBITDA {p.margenEbitda}</div>
                        </div>
                      </div>

                      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 12 }}>
                        <MiniStat label="Venta neta" value={`$${p.ventaMM}M`} />
                        <MiniStat label="Costo de venta" value={`$${p.costoVentaMM}M`} color="#ef4444" />
                        <MiniStat label="Margen bruto" value={`$${p.margenBrutoMM}M`} sub={`${Math.round(p.margenBrutoMM / p.ventaMM * 100)}%`} color="#22c55e" />
                        <MiniStat label="Gastos operacionales" value={`$${p.gastosOpMM}M`} color="#f59e0b" />
                        <MiniStat label="EBITDA" value={`$${p.ebitdaMM}M`} sub={p.margenEbitda} color={p.ebitdaMM > 0 ? "#22c55e" : "#ef4444"} />
                        <MiniStat label="Ticket prom./mes" value={p.ticketPromMes} />
                      </div>

                      <div style={{
                        fontSize: 12,
                        color: "#94a3b8",
                        lineHeight: 1.6,
                        background: "#0f172a",
                        padding: 12,
                        borderRadius: 8,
                        borderLeft: "3px solid #f59e0b33"
                      }}>
                        {p.nota}
                      </div>
                    </div>
                  )}
                </div>
              ))}

              <Card style={{ marginTop: 12 }}>
                <h3 style={{ fontSize: 14, fontWeight: 700, marginTop: 0, marginBottom: 10, color: "#f8fafc" }}>
                  Estructura de costos fijos mensuales (Año 1)
                </h3>
                {data.costosFijos.year1.map((c, i) => (
                  <div key={i} style={{
                    display: "flex", justifyContent: "space-between",
                    padding: "6px 0",
                    borderBottom: i < data.costosFijos.year1.length - 1 ? "1px solid #1e293b" : "none",
                    fontSize: 13
                  }}>
                    <span style={{ color: "#94a3b8" }}>{c.concepto}</span>
                    <span style={{ color: "#e2e8f0", fontFamily: "monospace", fontWeight: 600 }}>
                      ${(c.monto / 1000000).toFixed(1)}M
                    </span>
                  </div>
                ))}
                <div style={{
                  display: "flex", justifyContent: "space-between",
                  padding: "10px 0 0",
                  borderTop: "2px solid #f59e0b33",
                  marginTop: 6,
                  fontSize: 14,
                  fontWeight: 700
                }}>
                  <span style={{ color: "#f8fafc" }}>Total mensual</span>
                  <span style={{ color: "#f59e0b", fontFamily: "monospace" }}>
                    ${(totalCostoFijoMes / 1000000).toFixed(1)}M
                  </span>
                </div>
                <div style={{ fontSize: 11, color: "#64748b", marginTop: 4 }}>
                  = ${Math.round(totalCostoFijoMes * 12 / 1000000)}M anuales en gastos operacionales (Año 1)
                </div>
              </Card>

              <Card style={{ marginTop: 12 }}>
                <h3 style={{ fontSize: 14, fontWeight: 700, marginTop: 0, marginBottom: 10, color: "#f8fafc" }}>
                  Uso del capital de trabajo ($500M)
                </h3>
                <div style={{ fontSize: 13, color: "#94a3b8", lineHeight: 1.7 }}>
                  {[
                    ["Stock inicial (2-3 meses rotación)", "$250M", "50%"],
                    ["Capital de operación (3 meses gastos)", "$120M", "24%"],
                    ["Depósitos + equipamiento logístico", "$60M", "12%"],
                    ["Marketing lanzamiento + muestras", "$40M", "8%"],
                    ["Reserva de contingencia", "$30M", "6%"],
                  ].map(([c, v, p], i) => (
                    <div key={i} style={{ display: "flex", justifyContent: "space-between", marginBottom: 4 }}>
                      <span>{c}</span>
                      <span style={{ fontFamily: "monospace", color: "#f59e0b", fontWeight: 600 }}>{v} ({p})</span>
                    </div>
                  ))}
                </div>
              </Card>
            </div>
          )}

          {/* RIESGOS */}
          {tab === "riesgos" && (
            <div>
              <SectionTitle>Riesgos, mitigantes y recomendaciones</SectionTitle>

              {[
                {
                  riesgo: "Tipo de cambio ARS/CLP",
                  nivel: "Alto",
                  color: "#ef4444",
                  detalle: "Argentina tiene volatilidad cambiaria extrema. El costo de importación puede fluctuar significativamente.",
                  mitigante: "Negociar precios en USD con Pehuenia. Contratos con banda de precio ±10%. Stock buffer de 2-3 meses."
                },
                {
                  riesgo: "Regulación sanitaria (ISP/Seremi Salud)",
                  nivel: "Medio",
                  color: "#f59e0b",
                  detalle: "Todos los productos alimenticios importados requieren resolución sanitaria y etiquetado conforme a la ley chilena (octógonos, alérgenos).",
                  mitigante: "Pehuenia tiene FSSC22000 y Kosher, lo cual facilita. Presupuestar $15-20M en certificaciones y re-etiquetado para el mercado chileno."
                },
                {
                  riesgo: "Competencia de precio de Puratos (producción local)",
                  nivel: "Medio",
                  color: "#f59e0b",
                  detalle: "Puratos tiene planta en Chile, lo que le da ventaja en costos de flete y plazos de entrega vs importación desde Argentina.",
                  mitigante: "Diferenciación por especialización (heladería artesanal), amplitud de catálogo en categorías donde Puratos es débil (variegatos, cremosos, syrups)."
                },
                {
                  riesgo: "Estacionalidad del helado",
                  nivel: "Medio-bajo",
                  color: "#f59e0b",
                  detalle: "Heladería tiene pico en noviembre-marzo. Invierno puede caer 40-50% en volumen.",
                  mitigante: "Portafolio diversificado: syrups y cafetería compensan en invierno. Pastelería y chocolatería son counter-cíclicos."
                },
                {
                  riesgo: "Logística cadena de frío",
                  nivel: "Medio",
                  color: "#f59e0b",
                  detalle: "Frutas congeladas y algunos productos requieren cadena de frío desde Argentina.",
                  mitigante: "Empezar sin frutas congeladas IQF (foco en productos ambiente/refrigerado). Evaluar importación de IQF en Año 2 cuando haya volumen."
                },
                {
                  riesgo: "Plazo de cobro vs inversión en stock",
                  nivel: "Medio",
                  color: "#f59e0b",
                  detalle: "Heladerías artesanales suelen pagar a 30-45 días. Stock importado requiere pago anticipado o a 30 días.",
                  mitigante: "Capital de trabajo de $500M cubre 3+ meses de desfase. Pactar 15 días con descuento por pronto pago. Exigir 50% adelantado a clientes nuevos."
                },
              ].map((r, i) => (
                <Card key={i} style={{ borderLeft: `3px solid ${r.color}44` }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
                    <h4 style={{ fontSize: 14, fontWeight: 700, margin: 0, color: "#f8fafc" }}>{r.riesgo}</h4>
                    <span style={{
                      background: r.color + "22",
                      color: r.color,
                      fontSize: 11,
                      fontWeight: 700,
                      padding: "2px 10px",
                      borderRadius: 6
                    }}>{r.nivel}</span>
                  </div>
                  <div style={{ fontSize: 12, color: "#94a3b8", lineHeight: 1.6, marginBottom: 6 }}>
                    {r.detalle}
                  </div>
                  <div style={{ fontSize: 12, color: "#22c55e", lineHeight: 1.6 }}>
                    <strong>Mitigante:</strong> {r.mitigante}
                  </div>
                </Card>
              ))}

              <Card style={{ marginTop: 16, borderColor: "#22c55e33" }}>
                <h3 style={{ fontSize: 15, fontWeight: 700, marginTop: 0, marginBottom: 10, color: "#22c55e" }}>
                  Veredicto
                </h3>
                <div style={{ fontSize: 13, color: "#94a3b8", lineHeight: 1.8 }}>
                  <p style={{ margin: "0 0 10px" }}>
                    <strong style={{ color: "#f8fafc" }}>El negocio es viable y atractivo</strong>, con un break-even estimado entre el mes 10-14 del Año 1 y un EBITDA de ~$555M al Año 3 sobre una inversión de $500M. El ROI acumulado a 3 años es significativo.
                  </p>
                  <p style={{ margin: "0 0 10px" }}>
                    <strong style={{ color: "#f59e0b" }}>Las claves del éxito son:</strong> (1) negociar precios en USD para blindar la volatilidad argentina, (2) arrancar fuerte con syrups + pastas como productos de entrada rápida, (3) invertir en asesoría técnica tipo PreGel (capacitación a heladeros), y (4) aprovechar los 260 clientes ya identificados como pipeline concreto.
                  </p>
                  <p style={{ margin: 0 }}>
                    <strong style={{ color: "#f59e0b" }}>Riesgo principal:</strong> el tipo de cambio argentino. Si Pehuenia acepta facturar en USD con precios estables, el riesgo baja significativamente y el negocio tiene fundamentals sólidos.
                  </p>
                </div>
              </Card>
            </div>
          )}

          <div style={{ textAlign: "center", padding: "20px 0 10px", fontSize: 11, color: "#334155" }}>
            Análisis preparado para Alfonso Lobato · Mayo 2026 · Cifras estimadas basadas en investigación de mercado público
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<PehueniaAnalysis />);
  </script>
</body>
</html>
