<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Reporte de avance — Reyes IA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy1:#042C53; --navy2:#0C447C; --navy3:#185FA5;
    --bg:#f0f0ee; --card:#ffffff; --border:#e5e5e3;
    --green:#16A34A; --greenbg:#E8F8EE;
    --amber:#F59E0B;
    --gray:#9aa3ad;
    --text:#1a1a1a; --sub:#6b7280; --muted:#9ca3af;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Poppins',sans-serif;background:var(--bg);color:var(--text);}
  a{text-decoration:none;color:inherit;}

  .navbar{position:sticky;top:0;z-index:100;background:linear-gradient(135deg,var(--navy1) 0%,var(--navy2) 50%,var(--navy3) 100%);
    padding:14px 24px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 12px rgba(0,0,0,0.15);}
  .navbar-title{color:#fff;font-weight:700;font-size:16px;display:flex;align-items:center;gap:10px;}
  .navbar-title .dot{width:8px;height:8px;border-radius:50%;background:#4ADE80;}
  .navbar-links a{color:rgba(255,255,255,0.85);font-size:13px;font-weight:500;}

  .wrap{max-width:860px;margin:0 auto;padding:26px 20px 80px;}

  /* HERO */
  .hero{background:linear-gradient(135deg,var(--navy1) 0%,var(--navy2) 55%,var(--navy3) 100%);
    border-radius:22px;padding:28px;color:#fff;margin-bottom:16px;
    display:flex;align-items:center;gap:26px;flex-wrap:wrap;}
  .hero-info{flex:1;min-width:200px;}
  .hero .name{font-size:26px;font-weight:800;margin-bottom:6px;line-height:1.15;}
  .hero .meta{font-size:13px;opacity:.82;}
  .vivo{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:600;
    background:rgba(255,255,255,.14);padding:5px 11px;border-radius:20px;margin-top:14px;}
  .vivo .pulso{width:8px;height:8px;border-radius:50%;background:#4ADE80;box-shadow:0 0 0 0 rgba(74,222,128,.7);
    animation:pulso 2s infinite;}
  @keyframes pulso{0%{box-shadow:0 0 0 0 rgba(74,222,128,.6);}70%{box-shadow:0 0 0 7px rgba(74,222,128,0);}100%{box-shadow:0 0 0 0 rgba(74,222,128,0);}}

  /* Anillo de avance */
  .ring-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;}
  .ring{position:relative;width:150px;height:150px;}
  .ring svg{transform:rotate(-90deg);}
  .ring-track{fill:none;stroke:rgba(255,255,255,.22);stroke-width:14;}
  .ring-fill{fill:none;stroke:#fff;stroke-width:14;stroke-linecap:round;transition:stroke-dashoffset .9s ease;}
  .ring-num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .ring-num b{font-size:34px;font-weight:800;line-height:1;}
  .ring-num span{font-size:11px;opacity:.8;margin-top:3px;letter-spacing:.03em;}

  /* Tiles */
  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px;}
  .tile{background:var(--card);border:1.5px solid var(--border);border-radius:16px;padding:16px 18px;}
  .tile .n{font-size:22px;font-weight:800;color:var(--navy1);line-height:1.1;}
  .tile .l{font-size:11.5px;font-weight:600;color:var(--sub);margin-top:4px;letter-spacing:.02em;}
  @media (max-width:560px){ .tiles{grid-template-columns:1fr;} .hero{justify-content:center;text-align:center;} }

  /* Sección */
  .sec-title{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--navy2);
    margin:26px 0 12px;}

  /* Barras por sesión */
  .barras{background:var(--card);border:1.5px solid var(--border);border-radius:16px;padding:18px 20px;}
  .barra{margin-bottom:15px;}
  .barra:last-child{margin-bottom:0;}
  .barra .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;gap:10px;}
  .barra .lbl{font-size:13px;font-weight:600;}
  .barra .val{font-size:12px;font-weight:600;color:var(--sub);white-space:nowrap;}
  .track{height:10px;background:#edeeec;border-radius:6px;overflow:hidden;}
  .fill{height:100%;border-radius:6px;transition:width .9s ease;}
  .leyenda{display:flex;gap:16px;flex-wrap:wrap;margin-top:16px;font-size:11.5px;color:var(--sub);}
  .leyenda span{display:inline-flex;align-items:center;gap:6px;}
  .dot{width:10px;height:10px;border-radius:3px;}

  /* Detalle */
  .session-block{background:var(--card);border:1.5px solid var(--border);border-radius:16px;margin-bottom:14px;overflow:hidden;}
  .session-head{padding:15px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border);}
  .session-num{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:14px;flex-shrink:0;}
  .session-num.done{background:var(--greenbg);color:#166534;}
  .session-num.current{background:var(--navy2);color:#fff;}
  .session-num.future{background:#f0f0f0;color:var(--sub);}
  .session-title{font-weight:700;font-size:15px;}
  .session-date{font-size:12px;color:var(--sub);font-weight:500;margin-top:2px;}
  .estado-chip{margin-left:auto;font-size:11px;font-weight:700;padding:4px 11px;border-radius:20px;white-space:nowrap;}
  .estado-done{background:var(--greenbg);color:#166534;}
  .estado-current{background:#EAF2FB;color:var(--navy2);}
  .estado-future{background:#f2f2f0;color:var(--sub);}

  .session-body{padding:6px 20px 14px;}
  .tema-row{display:flex;align-items:flex-start;gap:12px;padding:11px 0;border-bottom:1px solid #f2f2f0;}
  .tema-row:last-child{border-bottom:none;}
  .mark{width:21px;height:21px;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    margin-top:1px;font-size:12px;font-weight:800;}
  .mark.done{background:var(--green);color:#fff;}
  .mark.pend{border:2px solid #cbd5e1;}
  .tema-content{flex:1;min-width:0;}
  .tema-nombre{font-size:14px;font-weight:500;line-height:1.4;}
  .tema-nombre.done{color:#166534;}
  .tema-coment{font-size:12.5px;color:var(--sub);line-height:1.5;margin-top:4px;white-space:pre-wrap;
    border-left:2px solid var(--border);padding-left:10px;}

  .empty,.loading{color:var(--sub);font-size:14px;padding:50px 20px;text-align:center;}
  .footer{text-align:center;color:var(--muted);font-size:12px;margin-top:28px;line-height:1.7;}
</style>
</head>
<body>

<div class="navbar">
  <div class="navbar-title"><span class="dot"></span> Reyes IA · Reporte de avance</div>
  <div class="navbar-links"><a href="https://reyesia.com" target="_blank" rel="noopener">reyesia.com</a></div>
</div>

<div class="wrap" id="app">
  <div class="loading">Cargando reporte…</div>
</div>

<script>
const app = document.getElementById('app');
const ID = new URLSearchParams(location.search).get('id');

const C_DONE = '#16A34A', C_CURRENT = '#185FA5', C_FUTURE = '#c8ccd1';

function esc(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function fechaLarga(iso){
  if (!iso) return '';
  const d = new Date(iso);
  let txt = d.toLocaleDateString('es-CL', { weekday:'long', day:'numeric', month:'long' });
  if (d.getHours() || d.getMinutes())
    txt += ' · ' + d.toLocaleTimeString('es-CL', { hour:'2-digit', minute:'2-digit' });
  return txt.charAt(0).toUpperCase() + txt.slice(1);
}
function fechaCorta(iso){
  if (!iso) return null;
  return new Date(iso).toLocaleDateString('es-CL', { day:'numeric', month:'short' });
}
function horaAhora(){
  return new Date().toLocaleTimeString('es-CL', { hour:'2-digit', minute:'2-digit' });
}

let firmaPrevia = null;

async function cargar(){
  if (!ID){ app.innerHTML = '<div class="empty">Enlace inválido.</div>'; return; }

  let datos;
  try {
    const r = await fetch(`/api/reporte?id=${encodeURIComponent(ID)}`);
    if (r.status === 404){ app.innerHTML = '<div class="empty">No se encontró el programa.</div>'; return; }
    if (!r.ok) throw new Error('http ' + r.status);
    datos = await r.json();
  } catch (e) {
    // Si ya hay un reporte dibujado, se conserva; si no, se avisa.
    if (firmaPrevia === null) app.innerHTML = '<div class="empty">No se pudo cargar el reporte. Reintenta en un momento.</div>';
    return;
  }

  // Evita re-dibujar (y el parpadeo) si nada cambió desde el último refresco.
  const firma = JSON.stringify(datos);
  if (firma === firmaPrevia) return;
  firmaPrevia = firma;

  render(datos.programa, datos.temas || [], datos.sesiones || []);
}

function render(programa, temas, sesInfo){
  const fechas = {};
  sesInfo.forEach(f => { fechas[f.numero_sesion] = f.fecha_hora; });

  const bySesion = {};
  temas.forEach(t => { (bySesion[t.numero_sesion] ||= []).push(t); });
  const nums = Object.keys(bySesion).map(Number);
  const total = programa.total_sesiones || Math.max(1, ...nums);
  const maxNum = Math.max(total, ...nums, 0);

  const totalTemas = temas.length;
  const temasListos = temas.filter(t => t.estado === 'visto').length;
  const pctGlobal = totalTemas ? Math.round(temasListos / totalTemas * 100) : 0;

  // Estado por sesión
  const meta = {};
  let sesionesCompletas = 0;
  for (let n = 1; n <= maxNum; n++){
    const list = (bySesion[n] || []).slice().sort((a,b)=>a.orden-b.orden);
    const listos = list.filter(t => t.estado === 'visto').length;
    const allDone = list.length > 0 && listos === list.length;
    const empezada = listos > 0;
    if (allDone) sesionesCompletas++;
    meta[n] = { list, listos, allDone, empezada,
      cls: allDone ? 'done' : empezada ? 'current' : 'future',
      lbl: allDone ? 'Completada' : empezada ? 'En curso' : 'Próxima',
      color: allDone ? C_DONE : empezada ? C_CURRENT : C_FUTURE };
  }

  // Próxima sesión: entre las sesiones aún NO completadas, la reunión agendada
  // más cercana en el futuro; si ninguna pendiente tiene fecha, la primera
  // sesión sin terminar.
  const ahora = Date.now();
  const pendientes = [];
  for (let n = 1; n <= maxNum; n++){ if (!meta[n].allDone) pendientes.push(n); }
  let proxima = null, mejorFecha = Infinity;
  for (const n of pendientes){
    if (fechas[n]){
      const t = new Date(fechas[n]).getTime();
      if (t >= ahora && t < mejorFecha){ mejorFecha = t; proxima = { n, fecha: fechas[n] }; }
    }
  }
  if (!proxima && pendientes.length){ const n = pendientes[0]; proxima = { n, fecha: fechas[n] || null }; }
  const proximaTxt = proxima
    ? (proxima.fecha ? `S${proxima.n} · ${fechaCorta(proxima.fecha)}` : `Sesión ${proxima.n}`)
    : '¡Completo! 🎉';

  // Anillo
  const r = 61, Circ = 2 * Math.PI * r;
  const off = Circ * (1 - pctGlobal / 100);

  // Barras por sesión
  let barras = '';
  for (let n = 1; n <= maxNum; n++){
    const m = meta[n];
    const t = m.list.length;
    const pct = t ? Math.round(m.listos / t * 100) : 0;
    barras += `
      <div class="barra">
        <div class="top">
          <span class="lbl">Sesión ${n}</span>
          <span class="val">${m.listos}/${t} · ${pct}% · ${m.lbl}</span>
        </div>
        <div class="track"><div class="fill" style="width:${pct}%;background:${m.color}"></div></div>
      </div>`;
  }

  // Detalle
  let detalle = '';
  for (let n = 1; n <= maxNum; n++){
    const m = meta[n];
    const filas = m.list.map(t => {
      const visto = t.estado === 'visto';
      return `
      <div class="tema-row">
        <div class="mark ${visto?'done':'pend'}">${visto?'✓':''}</div>
        <div class="tema-content">
          <div class="tema-nombre ${visto?'done':''}">${esc(t.tema)}</div>
          ${t.comentario ? `<div class="tema-coment">${esc(t.comentario)}</div>` : ''}
        </div>
      </div>`;
    }).join('') || '<div class="tema-row"><div class="tema-content"><div class="tema-nombre" style="color:var(--sub)">Contenido por definir.</div></div></div>';

    detalle += `
    <div class="session-block">
      <div class="session-head">
        <div class="session-num ${m.cls}">${n}</div>
        <div>
          <div class="session-title">Sesión ${n}</div>
          ${fechas[n] ? `<div class="session-date">${fechaLarga(fechas[n])}</div>` : ''}
        </div>
        <span class="estado-chip estado-${m.cls}">${m.lbl} · ${m.listos}/${m.list.length}</span>
      </div>
      <div class="session-body">${filas}</div>
    </div>`;
  }

  app.innerHTML = `
    <div class="hero">
      <div class="hero-info">
        <div class="name">${esc(programa.cliente)}</div>
        <div class="meta">${programa.tipo === 'mentoria_1a1' ? 'Mentoría 1:1' : 'Programa de Adopción Profunda de IA'} · Reyes IA</div>
        <div class="vivo"><span class="pulso"></span> En vivo · actualizado a las ${horaAhora()}</div>
      </div>
      <div class="ring-wrap">
        <div class="ring">
          <svg width="150" height="150" viewBox="0 0 150 150">
            <circle class="ring-track" cx="75" cy="75" r="${r}"></circle>
            <circle class="ring-fill" cx="75" cy="75" r="${r}"
                    stroke-dasharray="${Circ.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"></circle>
          </svg>
          <div class="ring-num"><b>${pctGlobal}%</b><span>avanzado</span></div>
        </div>
      </div>
    </div>

    <div class="tiles">
      <div class="tile"><div class="n">${sesionesCompletas}/${total}</div><div class="l">Sesiones completas</div></div>
      <div class="tile"><div class="n">${temasListos}/${totalTemas}</div><div class="l">Temas cubiertos</div></div>
      <div class="tile"><div class="n">${proximaTxt}</div><div class="l">Próxima sesión</div></div>
    </div>

    <div class="sec-title">Avance por sesión</div>
    <div class="barras">
      ${barras}
      <div class="leyenda">
        <span><i class="dot" style="background:${C_DONE}"></i> Completada</span>
        <span><i class="dot" style="background:${C_CURRENT}"></i> En curso</span>
        <span><i class="dot" style="background:${C_FUTURE}"></i> Próxima</span>
      </div>
    </div>

    <div class="sec-title">Detalle por sesión</div>
    ${detalle}

    <div class="footer">
      Este reporte se actualiza solo a medida que avanzamos.<br>
      Reyes IA · reyesia.com
    </div>
  `;
}

cargar();
// Refresco automático: cada 45 s y al volver a la pestaña.
setInterval(cargar, 45000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) cargar(); });
</script>
</body>
</html>
