<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Programa de acompañamiento — Reyes IA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --navy1:#042C53; --navy2:#0C447C; --navy3:#185FA5;
    --bg:#f0f0ee; --card:#ffffff; --border:#e0e0e0;
    --green:#22C55E; --greenbg:#E8F8EE;
    --amber:#F59E0B; --amberbg:#FEF3E2;
    --text:#1a1a1a; --sub:#6b7280;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Poppins',sans-serif;background:var(--bg);color:var(--text);}
  a{text-decoration:none;color:inherit;}

  .navbar{position:sticky;top:0;z-index:100;background:linear-gradient(135deg,var(--navy1) 0%,var(--navy2) 50%,var(--navy3) 100%);
    padding:14px 24px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 12px rgba(0,0,0,0.15);}
  .navbar-title{color:#fff;font-weight:700;font-size:16px;display:flex;align-items:center;gap:10px;}
  .navbar-title .dot{width:8px;height:8px;border-radius:50%;background:var(--green);}
  .navbar-links a{color:rgba(255,255,255,0.85);font-size:13px;font-weight:500;}

  .wrap{max-width:820px;margin:0 auto;padding:28px 20px 80px;}

  .client-header{background:linear-gradient(135deg,var(--navy1) 0%,var(--navy2) 55%,var(--navy3) 100%);
    border-radius:20px;padding:26px 28px;color:#fff;margin-bottom:14px;}
  .client-header .name{font-size:24px;font-weight:800;margin-bottom:6px;}
  .client-header .meta{font-size:13px;opacity:.85;margin-bottom:16px;}
  .progress-track{height:8px;background:rgba(255,255,255,0.2);border-radius:6px;overflow:hidden;margin-bottom:8px;}
  .progress-fill{height:100%;background:#fff;border-radius:6px;}
  .progress-text{font-size:12px;color:rgba(255,255,255,0.9);font-weight:600;display:flex;justify-content:space-between;}

  .aviso-lectura{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--sub);
    background:var(--card);border:1.5px solid var(--border);border-radius:12px;padding:10px 14px;margin-bottom:22px;}

  .session-block{background:var(--card);border:1.5px solid var(--border);border-radius:16px;margin-bottom:14px;overflow:hidden;}
  .session-head{padding:16px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border);}
  .session-num{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:14px;flex-shrink:0;}
  .session-num.done{background:var(--greenbg);color:#166534;}
  .session-num.current{background:var(--navy2);color:#fff;}
  .session-num.future{background:#f0f0f0;color:var(--sub);}
  .session-title{font-weight:700;font-size:15px;}
  .session-date{font-size:12px;color:var(--sub);font-weight:500;margin-top:2px;}
  .estado-chip{margin-left:auto;font-size:11px;font-weight:700;padding:4px 11px;border-radius:20px;white-space:nowrap;}
  .estado-done{background:var(--greenbg);color:#166534;}
  .estado-current{background:#EAF2FB;color:var(--navy2);}
  .estado-future{background:#f2f2f0;color:var(--sub);}

  .session-body{padding:6px 20px 14px;}
  .tema-row{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid #f2f2f0;}
  .tema-row:last-child{border-bottom:none;}
  .mark{width:22px;height:22px;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    margin-top:1px;font-size:13px;font-weight:800;}
  .mark.done{background:var(--green);color:#fff;}
  .mark.pend{border:2px solid #cbd5e1;color:transparent;}
  .tema-content{flex:1;min-width:0;}
  .tema-nombre{font-size:14px;font-weight:500;line-height:1.4;}
  .tema-nombre.done{color:#166534;}
  .tema-coment{font-size:12.5px;color:var(--sub);line-height:1.5;margin-top:4px;white-space:pre-wrap;
    border-left:2px solid var(--border);padding-left:10px;}

  .empty,.loading{color:var(--sub);font-size:14px;padding:50px 20px;text-align:center;}
  .footer{text-align:center;color:var(--sub);font-size:12px;margin-top:30px;}

  @media (max-width:600px){
    .client-header{padding:20px;}
    .client-header .name{font-size:19px;}
  }
</style>
</head>
<body>

<div class="navbar">
  <div class="navbar-title"><span class="dot"></span> Reyes IA · Programa de acompañamiento</div>
  <div class="navbar-links"><a href="https://reyesia.com" target="_blank" rel="noopener">reyesia.com</a></div>
</div>

<div class="wrap" id="app">
  <div class="loading">Cargando…</div>
</div>

<script>
const SUPABASE_URL = "https://lzrhpmwrbcrprsnpuadh.supabase.co";
const SUPABASE_KEY = "sb_publishable_oak2a-feuA_tdZxbyqufCw_XpqWGgTZ";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const app = document.getElementById('app');

function esc(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function fechaLegible(iso){
  if (!iso) return '';
  const d = new Date(iso);
  let txt = d.toLocaleDateString('es-CL', { weekday:'long', day:'numeric', month:'long' });
  if (d.getHours() || d.getMinutes())
    txt += ' · ' + d.toLocaleTimeString('es-CL', { hour:'2-digit', minute:'2-digit' });
  return txt.charAt(0).toUpperCase() + txt.slice(1);
}

async function render(){
  const id = new URLSearchParams(location.search).get('id');
  if (!id){ app.innerHTML = '<div class="empty">Enlace inválido.</div>'; return; }

  const [{ data: programa }, { data: temas }, { data: sesInfo }] = await Promise.all([
    sb.from('programas_clientes').select('cliente,tipo,total_sesiones,sesiones_completadas').eq('id', id).single(),
    sb.from('temario_temas').select('numero_sesion,orden,tema,estado,comentario').eq('programa_id', id).order('numero_sesion').order('orden'),
    sb.from('sesiones_cliente').select('numero_sesion,fecha_hora').eq('programa_id', id)
  ]);

  if (!programa){ app.innerHTML = '<div class="empty">No se encontró el programa.</div>'; return; }

  const fechas = {};
  (sesInfo || []).forEach(f => { fechas[f.numero_sesion] = f.fecha_hora; });

  const bySesion = {};
  (temas || []).forEach(t => { (bySesion[t.numero_sesion] ||= []).push(t); });
  const total = programa.total_sesiones || Math.max(1, ...Object.keys(bySesion).map(Number));
  const maxNum = Math.max(total, ...Object.keys(bySesion).map(Number), 0);

  const done = programa.sesiones_completadas || 0;
  const pct = total ? Math.round((done/total)*100) : 0;

  let bloques = '';
  for (let n = 1; n <= maxNum; n++){
    const list = (bySesion[n] || []).slice().sort((a,b)=>a.orden-b.orden);
    const listos = list.filter(t => t.estado === 'visto').length;
    const allDone = list.length > 0 && listos === list.length;
    const empezada = listos > 0;
    const stateClass = allDone ? 'done' : empezada ? 'current' : 'future';
    const stateLabel = allDone ? 'Completada' : empezada ? 'En curso' : 'Próxima';

    const filas = list.map(t => {
      const visto = t.estado === 'visto';
      return `
      <div class="tema-row">
        <div class="mark ${visto?'done':'pend'}">${visto?'✓':''}</div>
        <div class="tema-content">
          <div class="tema-nombre ${visto?'done':''}">${esc(t.tema)}</div>
          ${t.comentario ? `<div class="tema-coment">${esc(t.comentario)}</div>` : ''}
        </div>
      </div>`;
    }).join('') || '<div class="tema-row"><div class="tema-content"><div class="tema-nombre" style="color:var(--sub)">Contenido por definir.</div></div></div>';

    bloques += `
    <div class="session-block">
      <div class="session-head">
        <div class="session-num ${stateClass}">${n}</div>
        <div>
          <div class="session-title">Sesión ${n}</div>
          ${fechas[n] ? `<div class="session-date">${fechaLegible(fechas[n])}</div>` : ''}
        </div>
        <span class="estado-chip estado-${stateClass}">${stateLabel} · ${listos}/${list.length}</span>
      </div>
      <div class="session-body">${filas}</div>
    </div>`;
  }

  app.innerHTML = `
    <div class="client-header">
      <div class="name">${esc(programa.cliente)}</div>
      <div class="meta">${programa.tipo === 'mentoria_1a1' ? 'Mentoría 1:1' : 'Programa de Adopción Profunda de IA'} · Reyes IA</div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="progress-text"><span>${done} de ${total} sesiones</span><span>${pct}% avanzado</span></div>
    </div>
    <div class="aviso-lectura">👁️ Vista de solo lectura · el avance lo registra tu equipo de Reyes IA.</div>
    ${bloques}
    <div class="footer">Reyes IA · reyesia.com</div>
  `;
}

render();
</script>
</body>
</html>
