<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Panel de Clientes — Reyes IA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --navy1:#042C53; --navy2:#0C447C; --navy3:#185FA5;
    --bg:#f0f0ee; --card:#ffffff; --border:#e0e0e0;
    --green:#22C55E; --greenbg:#E8F8EE;
    --amber:#F59E0B; --amberbg:#FEF3E2;
    --purple:#7C3AED;
    --text:#1a1a1a; --sub:#6b7280;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Poppins',sans-serif;background:var(--bg);color:var(--text);}
  a{text-decoration:none;color:inherit;}

  /* NAVBAR */
  .navbar{position:sticky;top:0;z-index:100;background:linear-gradient(135deg,var(--navy1) 0%,var(--navy2) 50%,var(--navy3) 100%);
    padding:14px 24px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 12px rgba(0,0,0,0.15);}
  .navbar-title{color:#fff;font-weight:700;font-size:16px;display:flex;align-items:center;gap:10px;cursor:pointer;}
  .navbar-title .dot{width:8px;height:8px;border-radius:50%;background:var(--green);}
  .navbar-links{display:flex;gap:16px;}
  .navbar-links a{color:rgba(255,255,255,0.85);font-size:13px;font-weight:500;}

  .wrap{max-width:960px;margin:0 auto;padding:28px 20px 80px;}

  /* LANDING */
  .page-header{margin-bottom:24px;}
  .page-header h1{font-size:22px;font-weight:800;margin:0 0 4px;color:var(--navy1);}
  .page-header p{color:var(--sub);font-size:14px;margin:0;}

  .group-label{font-size:12px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--navy2);
    margin:28px 0 12px;display:flex;align-items:center;gap:8px;}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;}

  .client-card{background:var(--card);border:1.5px solid var(--border);border-radius:16px;padding:18px 20px;cursor:pointer;
    transition:transform .15s, box-shadow .15s, border-color .15s;}
  .client-card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(4,44,83,0.10);border-color:var(--navy3);}
  .client-card .name{font-weight:700;font-size:16px;margin-bottom:2px;}
  .client-card .meta{font-size:12px;color:var(--sub);margin-bottom:14px;}
  .progress-track{height:8px;background:#eee;border-radius:6px;overflow:hidden;margin-bottom:8px;}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--navy3),var(--navy1));border-radius:6px;}
  .progress-text{font-size:12px;color:var(--sub);font-weight:600;display:flex;justify-content:space-between;}
  .badge{display:inline-block;font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;letter-spacing:.03em;}
  .badge-activo{background:var(--greenbg);color:#166534;}
  .badge-pausado{background:var(--amberbg);color:#92400E;}
  .badge-completado{background:#EEF2FF;color:#3730A3;}

  .page-header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;}
  .btn-nuevo{flex-shrink:0;background:linear-gradient(135deg,var(--navy2),var(--navy3));color:#fff;border:none;
    border-radius:11px;padding:10px 16px;font-size:13px;font-weight:700;font-family:'Poppins',sans-serif;cursor:pointer;}
  .btn-nuevo:hover{filter:brightness(1.08);}
  .barra-ficha{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;}
  .barra-ficha .back-btn{margin-bottom:0;}
  .btn-duplicar{background:#fff;border:1.5px solid var(--border);border-radius:10px;padding:7px 13px;
    font-size:12.5px;font-weight:600;font-family:'Poppins',sans-serif;color:var(--navy2);cursor:pointer;}
  .btn-duplicar:hover{border-color:var(--navy3);}
  .acciones-ficha{display:flex;gap:8px;flex-wrap:wrap;}
  .btn-compartir{background:var(--greenbg);border:1.5px solid #A7E3BF;border-radius:10px;padding:7px 13px;
    font-size:12.5px;font-weight:700;font-family:'Poppins',sans-serif;color:#166534;cursor:pointer;}
  .btn-compartir:hover{border-color:var(--green);}
  .share-panel{display:none;background:var(--card);border:1.5px solid #A7E3BF;border-radius:14px;
    padding:14px 16px;margin-bottom:18px;}
  .share-panel.show{display:block;}
  .sp-title{font-size:13px;font-weight:700;color:#166534;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
  .sp-badge{font-size:10px;font-weight:700;background:var(--greenbg);color:#166534;padding:2px 8px;border-radius:20px;
    text-transform:uppercase;letter-spacing:.04em;}
  .sp-row{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap;}
  .sp-url{flex:1;min-width:220px;border:1.5px solid var(--border);border-radius:9px;padding:9px 11px;
    font-family:'Poppins',sans-serif;font-size:12.5px;color:var(--text);background:#fafafa;outline:none;}
  .sp-url:focus{border-color:var(--navy3);}
  .sp-copy{background:var(--navy2);color:#fff;border:none;border-radius:9px;padding:9px 16px;
    font-size:12.5px;font-weight:700;font-family:'Poppins',sans-serif;cursor:pointer;white-space:nowrap;}
  .sp-copy:hover{filter:brightness(1.1);}
  .sp-open{display:inline-flex;align-items:center;background:#fff;border:1.5px solid var(--border);border-radius:9px;
    padding:9px 14px;font-size:12.5px;font-weight:600;color:var(--navy2);white-space:nowrap;}
  .sp-open:hover{border-color:var(--navy3);}
  .sp-hint{font-size:11.5px;color:var(--sub);margin-top:9px;}
  .btn-eliminar{background:#fff;border:1.5px solid var(--border);border-radius:10px;padding:7px 13px;
    font-size:12.5px;font-weight:600;font-family:'Poppins',sans-serif;color:#B91C1C;cursor:pointer;}
  .btn-eliminar:hover{border-color:#EF4444;background:#FEF2F2;}
  .client-header .name{cursor:pointer;}
  .lapiz{font-size:14px;opacity:.35;}
  .client-header .name:hover .lapiz{opacity:.9;}
  .nombre-input{width:100%;max-width:420px;border:none;border-radius:9px;padding:4px 9px;
    font-family:'Poppins',sans-serif;font-size:23px;font-weight:800;color:var(--navy1);
    background:rgba(255,255,255,.95);outline:none;}

  /* Modal de nuevo cliente */
  .modal-bg{position:fixed;inset:0;background:rgba(4,44,83,.45);z-index:500;padding:20px;
    display:none;align-items:center;justify-content:center;}
  .modal-bg.show{display:flex;}
  .modal{background:#fff;border-radius:18px;padding:24px 24px 22px;width:100%;max-width:440px;
    box-shadow:0 20px 50px rgba(4,44,83,.28);}
  .modal h3{margin:0 0 16px;font-size:18px;font-weight:800;color:var(--navy1);}
  .campo{margin-bottom:13px;flex:1;min-width:0;}
  .campo label{display:block;font-size:11.5px;font-weight:700;color:var(--navy2);margin-bottom:5px;}
  .campo input,.campo select{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:10px 12px;
    font-family:'Poppins',sans-serif;font-size:13.5px;color:var(--text);background:#fff;outline:none;}
  .campo input:focus,.campo select:focus{border-color:var(--navy3);}
  .campo-fila{display:flex;gap:10px;}
  .campo-corto{max-width:110px;}
  .check-linea{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--sub);cursor:pointer;}
  .modal-acciones{display:flex;gap:10px;margin-top:20px;}
  .btn-primario{flex:1;background:linear-gradient(135deg,var(--navy2),var(--navy3));color:#fff;border:none;
    border-radius:11px;padding:12px;font-size:13.5px;font-weight:700;font-family:'Poppins',sans-serif;cursor:pointer;}
  .btn-primario:disabled{opacity:.6;cursor:default;}
  .btn-secundario{background:#f2f2f0;color:var(--sub);border:none;border-radius:11px;padding:12px 18px;
    font-size:13.5px;font-weight:600;font-family:'Poppins',sans-serif;cursor:pointer;}

  .empty{color:var(--sub);font-size:14px;padding:20px;text-align:center;background:var(--card);border-radius:14px;border:1.5px dashed var(--border);}

  /* DETAIL */
  .back-btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--navy2);cursor:pointer;margin-bottom:18px;}

  .client-header{background:linear-gradient(135deg,var(--navy1) 0%,var(--navy2) 55%,var(--navy3) 100%);
    border-radius:20px;padding:26px 28px;color:#fff;margin-bottom:24px;}
  .client-header .name{font-size:24px;font-weight:800;margin-bottom:6px;}
  .client-header .meta{font-size:13px;opacity:.85;margin-bottom:16px;}
  .client-header .progress-track{background:rgba(255,255,255,0.2);}
  .client-header .progress-fill{background:#fff;}
  .client-header .progress-text{color:rgba(255,255,255,0.9);}
  .ch-row{display:flex;align-items:center;gap:24px;flex-wrap:wrap;}
  .ch-info{flex:1;min-width:200px;}
  .prog-seg{display:flex;gap:4px;margin:14px 0 8px;}
  .prog-seg .seg{flex:1;height:10px;background:rgba(255,255,255,0.22);border-radius:5px;overflow:hidden;
    transition:background .15s;}
  .prog-seg .seg:hover{background:rgba(255,255,255,0.34);}
  .prog-seg .seg-fill{height:100%;background:#fff;border-radius:5px;transition:width .8s ease;}
  .hring{position:relative;width:104px;height:104px;flex-shrink:0;}
  .hring svg{transform:rotate(-90deg);}
  .hring-track{fill:none;stroke:rgba(255,255,255,0.22);stroke-width:11;}
  .hring-fill{fill:none;stroke:#fff;stroke-width:11;stroke-linecap:round;transition:stroke-dashoffset .9s ease;}
  .hring-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:23px;font-weight:800;color:#fff;}
  @media (max-width:560px){ .ch-row{justify-content:center;} }

  .session-block{background:var(--card);border:1.5px solid var(--border);border-radius:16px;margin-bottom:14px;overflow:hidden;}
  .session-head{padding:16px 20px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;}
  .session-head .left{display:flex;align-items:center;gap:12px;}
  .session-num{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0;}
  .session-num.done{background:var(--greenbg);color:#166534;}
  .session-num.current{background:var(--navy2);color:#fff;}
  .session-num.future{background:#f0f0f0;color:var(--sub);}
  .session-title{font-weight:700;font-size:14.5px;}
  .session-date{font-size:12px;color:var(--sub);font-weight:500;}
  .session-status{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;}
  .chev{color:var(--sub);transition:transform .2s;font-size:12px;}
  .chev.open{transform:rotate(180deg);}

  .session-body{display:none;padding:4px 20px 18px;border-top:1px solid var(--border);}
  .session-body.open{display:block;}

  .tema-row{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid #f2f2f0;}
  .tema-row:last-child{border-bottom:none;}
  .checkbox{width:22px;height:22px;border-radius:6px;border:2px solid #cbd5e1;flex-shrink:0;cursor:pointer;
    display:flex;align-items:center;justify-content:center;margin-top:1px;transition:all .15s;}
  .checkbox.checked{background:var(--green);border-color:var(--green);}
  .checkbox.checked::after{content:'✓';color:#fff;font-size:13px;font-weight:800;}
  .tema-content{flex:1;min-width:0;}
  .tema-nombre{font-size:14px;font-weight:500;line-height:1.4;cursor:text;}
  .tema-nombre.done{color:#166534;}
  .lapiz-tema{font-size:12px;opacity:0;margin-left:6px;color:var(--sub);transition:opacity .15s;}
  .tema-row:hover .lapiz-tema{opacity:.5;}
  .tema-nombre-input{width:100%;border:1.5px solid var(--navy3);border-radius:7px;padding:3px 8px;
    font-family:'Poppins',sans-serif;font-size:14px;font-weight:500;color:var(--text);background:#fff;outline:none;}
  .tema-comment{width:100%;border:1px solid transparent;background:transparent;font-family:'Poppins',sans-serif;
    font-size:12.5px;color:var(--sub);padding:4px 0;margin-top:2px;resize:none;outline:none;}
  .tema-comment:focus{color:var(--text);}
  .tema-comment::placeholder{color:#c4c4c4;}
  .comment-wrap{display:flex;align-items:flex-start;gap:8px;}
  .comment-wrap .tema-comment{flex:1;}
  .drag-handle{flex-shrink:0;cursor:grab;color:#d5d9de;font-size:15px;line-height:1;letter-spacing:-2px;
    padding:3px 1px;margin-top:2px;user-select:none;}
  .drag-handle:hover{color:var(--navy3);}
  .drag-handle:active{cursor:grabbing;}
  .tema-row.dragging{opacity:.35;}

  /* Temas arrastrados desde una sesión anterior */
  .pendientes-box{background:var(--amberbg);border:1.5px solid #FCD9A0;border-radius:12px;
    padding:4px 14px 8px;margin:12px 0 6px;}
  .pendientes-title{font-size:11.5px;font-weight:700;color:#92400E;letter-spacing:.02em;
    padding:8px 0 2px;}
  .pendientes-box .tema-row{border-bottom-color:#F6E4C8;}
  .pendientes-box .tema-comment::placeholder{color:#C9A87C;}
  .pendientes-box .tema-row{transition:opacity .25s, transform .25s;}
  .pendientes-box .tema-row.saliendo{opacity:0;transform:translateX(18px);}
  .pend-origen{flex-shrink:0;background:var(--amber);color:#fff;font-size:10px;font-weight:800;
    border-radius:6px;padding:3px 6px;margin-top:2px;line-height:1;}
  .pend-count{color:#B45309;font-weight:700;}
  .temas-list.dragging-on .tema-comment{pointer-events:none;}
  .fecha-chip{display:inline-flex;gap:6px;margin-left:8px;vertical-align:middle;}
  .fecha-input,.hora-input{border:1px solid var(--border);border-radius:7px;padding:3px 7px;font-size:11px;
    font-family:'Poppins',sans-serif;color:var(--sub);background:#fff;cursor:pointer;}
  .fecha-input:hover,.hora-input:hover{border-color:var(--navy3);}
  .tema-del{color:#d1d5db;font-size:16px;cursor:pointer;padding:2px 6px;flex-shrink:0;}
  .tema-del:hover{color:#EF4444;}

  .add-tema-row{display:flex;gap:8px;margin-top:10px;}
  .add-tema-row input{flex:1;border:1.5px solid var(--border);border-radius:10px;padding:8px 12px;font-family:'Poppins',sans-serif;font-size:13px;outline:none;}
  .add-tema-row input:focus{border-color:var(--navy3);}
  .add-tema-row button{background:var(--navy2);color:#fff;border:none;border-radius:10px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;}

  .add-session-btn{display:block;width:100%;background:var(--card);border:1.5px dashed var(--border);border-radius:16px;
    padding:14px;text-align:center;font-size:13px;font-weight:600;color:var(--navy2);cursor:pointer;margin-bottom:14px;}

  .save-pill{position:fixed;bottom:20px;right:20px;background:#111;color:#fff;font-size:12px;font-weight:600;
    padding:8px 16px;border-radius:20px;opacity:0;transition:opacity .3s;pointer-events:none;}
  .save-pill.show{opacity:0.92;}

  .loading{padding:60px 20px;text-align:center;color:var(--sub);font-size:14px;}

  @media (max-width:600px){
    .navbar-links a:not(.always){display:none;}
    .client-header{padding:20px;}
    .client-header .name{font-size:19px;}
  }

  /* Gate de acceso */
  .lock{position:fixed;inset:0;background:var(--navy1);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;}
  .lock.hide{display:none;}
  .lock-box{background:#fff;border-radius:20px;padding:30px 26px;width:100%;max-width:360px;text-align:center;}
  .lock-ico{font-size:34px;margin-bottom:10px;}
  .lock-title{font-size:19px;font-weight:800;color:var(--navy1);margin-bottom:5px;}
  .lock-sub{font-size:12.5px;color:var(--sub);margin-bottom:18px;}
  .lock-box input{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:12px 14px;font-size:14px;font-family:inherit;outline:none;margin-bottom:10px;}
  .lock-box input:focus{border-color:var(--navy3);}
  .lock-box button{width:100%;background:linear-gradient(135deg,var(--navy2),var(--navy3));color:#fff;border:none;border-radius:11px;padding:13px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;}
  .lock-err{font-size:12px;color:#B91C1C;margin-top:10px;display:none;}
  .lock-err.show{display:block;}
</style>
</head>
<body>

<div class="lock" id="lock">
  <div class="lock-box">
    <div class="lock-ico">🔒</div>
    <div class="lock-title">Panel de Clientes</div>
    <div class="lock-sub">Panel interno de Reyes IA.</div>
    <input type="email" id="lock-email" placeholder="Correo" autocomplete="username" inputmode="email">
    <input type="password" id="lock-pw" placeholder="Contraseña" autocomplete="current-password">
    <button id="lock-btn">Entrar</button>
    <div class="lock-err" id="lock-err"></div>
  </div>
</div>

<div class="navbar">
  <div class="navbar-title" onclick="location.hash='#/'"><span class="dot"></span> Panel de Clientes — Reyes IA</div>
  <div class="navbar-links"><a href="#" onclick="event.preventDefault(); salir();">Salir</a></div>
</div>

<div class="wrap" id="app">
  <div class="loading">Cargando…</div>
</div>

<div class="save-pill" id="savePill">Guardado ✓</div>

<div class="modal-bg" id="modalNuevo" onclick="if(event.target===this) cerrarNuevoCliente()">
  <div class="modal">
    <h3 id="nc-titulo">Nuevo cliente</h3>
    <div class="campo">
      <label for="nc-nombre">Nombre del cliente</label>
      <input type="text" id="nc-nombre" placeholder="Ej: Peñuelas" autocomplete="off">
    </div>
    <div class="campo-fila">
      <div class="campo">
        <label for="nc-tipo">Tipo de programa</label>
        <select id="nc-tipo">
          <option value="empresa">Adopción Profunda — Empresa</option>
          <option value="mentoria_1a1">Mentoría 1:1</option>
        </select>
      </div>
      <div class="campo campo-corto">
        <label for="nc-total">Sesiones</label>
        <input type="number" id="nc-total" min="1" max="20" value="4">
      </div>
    </div>
    <div class="campo">
      <label for="nc-plantilla">Copiar el temario de…</label>
      <select id="nc-plantilla" onchange="plantillaElegida()">
        <option value="">Empezar en blanco</option>
      </select>
    </div>
    <label class="check-linea"><input type="checkbox" id="nc-avance"> Copiar también los checks y comentarios</label>
    <div class="modal-acciones">
      <button class="btn-secundario" onclick="cerrarNuevoCliente()">Cancelar</button>
      <button class="btn-primario" id="nc-crear" onclick="crearCliente()">Crear cliente</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://lzrhpmwrbcrprsnpuadh.supabase.co";
const SUPABASE_KEY = "sb_publishable_oak2a-feuA_tdZxbyqufCw_XpqWGgTZ";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const app = document.getElementById('app');
const savePill = document.getElementById('savePill');

function flashSaved(){
  savePill.classList.add('show');
  clearTimeout(flashSaved._t);
  flashSaved._t = setTimeout(()=>savePill.classList.remove('show'), 1200);
}

function esc(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

window.addEventListener('hashchange', () => { if (desbloqueado) route(); });

/* ---- Acceso con Supabase Auth ----
   Solo una sesión con login (rol authenticated) puede leer y escribir. Las
   tablas están cerradas por RLS: la publishable key sin sesión no ve nada.
   El reporte del cliente (ver.html) va por /api/reporte, no por esta llave. */
let desbloqueado = false;
const lock = document.getElementById('lock');
const lockEmail = document.getElementById('lock-email');
const lockPw = document.getElementById('lock-pw');
const lockErr = document.getElementById('lock-err');

async function entrar(){
  const email = lockEmail.value.trim();
  const pw = lockPw.value;
  lockErr.classList.remove('show');
  if (!email || !pw){ lockErr.textContent = 'Escribe tu correo y contraseña.'; lockErr.classList.add('show'); return; }

  const btn = document.getElementById('lock-btn');
  btn.disabled = true; const t = btn.textContent; btn.textContent = 'Entrando…';

  const { error } = await sb.auth.signInWithPassword({ email, password: pw });

  btn.disabled = false; btn.textContent = t;
  if (error){
    lockErr.textContent = /invalid/i.test(error.message) ? 'Correo o contraseña incorrectos.' : error.message;
    lockErr.classList.add('show');
    return;
  }
  abrir();
}

async function salir(){
  await sb.auth.signOut();
  location.reload();
}

function abrir(){
  desbloqueado = true;
  lock.classList.add('hide');
  route();
}

document.getElementById('lock-btn').onclick = entrar;
lockPw.addEventListener('keydown', e => { if (e.key === 'Enter') entrar(); });
lockEmail.addEventListener('keydown', e => { if (e.key === 'Enter') lockPw.focus(); });

window.addEventListener('DOMContentLoaded', async () => {
  const { data } = await sb.auth.getSession();
  if (data.session) abrir();
  else lockEmail.focus();
});

function route(){
  const h = location.hash;
  const m = h.match(/^#\/cliente\/([a-f0-9-]+)/);
  if (m) renderDetail(m[1]);
  else renderLanding();
}

// ---------- LANDING ----------
async function renderLanding(){
  app.innerHTML = '<div class="loading">Cargando programas…</div>';
  const { data: programas, error } = await sb
    .from('programas_clientes')
    .select('*')
    .order('updated_at', { ascending: false });

  if (error){ app.innerHTML = '<div class="empty">Error cargando datos: '+esc(error.message)+'</div>'; return; }

  // Progreso real de cada tarjeta desde los checks (una sola consulta liviana).
  const { data: temas } = await sb.from('temario_temas').select('programa_id,numero_sesion,estado');
  const prog = {};
  (temas || []).forEach(t => {
    const g = (prog[t.programa_id] ||= { total: 0, listos: 0, ses: {} });
    g.total++; if (t.estado === 'visto') g.listos++;
    const s = (g.ses[t.numero_sesion] ||= { t: 0, v: 0 });
    s.t++; if (t.estado === 'visto') s.v++;
  });

  const empresas = programas.filter(p => (p.tipo || 'empresa') === 'empresa');
  const mentorias = programas.filter(p => p.tipo === 'mentoria_1a1');

  const cardHtml = p => {
    const total = p.total_sesiones || 8;
    const g = prog[p.id] || { total: 0, listos: 0, ses: {} };
    const pct = g.total ? Math.round(g.listos / g.total * 100) : 0;
    const done = Object.values(g.ses).filter(s => s.t > 0 && s.v === s.t).length;
    return `<a class="client-card" onclick="location.hash='#/cliente/${p.id}'">
      <div class="name">${esc(p.cliente)}</div>
      <div class="meta">${esc(p.contacto || '')} ${p.contacto ? '· ' : ''}<span class="badge badge-${p.estado}">${p.estado}</span></div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="progress-text"><span>${done}/${total} sesiones</span><span>${pct}%</span></div>
    </a>`;
  };

  app.innerHTML = `
    <div class="page-header">
      <div>
        <h1>Panel de Clientes</h1>
        <p>Selecciona una empresa o una mentoría para ver la bitácora y el temario en vivo.</p>
      </div>
      <button class="btn-nuevo" onclick="abrirNuevoCliente()">+ Nuevo cliente</button>
    </div>
    ${empresas.length ? `<div class="group-label">🏢 Adopción Profunda — Empresas</div><div class="grid">${empresas.map(cardHtml).join('')}</div>` : ''}
    ${mentorias.length ? `<div class="group-label">🎯 Mentorías 1:1</div><div class="grid">${mentorias.map(cardHtml).join('')}</div>` : ''}
    ${!programas.length ? '<div class="empty">Aún no hay programas registrados.</div>' : ''}
  `;
}

// Una fila de tema. `arrastrado` = viene de una sesión anterior sin terminar:
// se muestra destacado, sin manilla de arrastre y con la sesión de origen.
function temaRowHtml(t, arrastrado){
  const visto = t.estado === 'visto';
  return `
  <div class="tema-row ${arrastrado ? 'arrastrado' : ''}" data-tema-id="${t.id}"
       ${arrastrado ? '' : 'ondragstart="temaDragStart(event, this)" ondragend="temaDragEnd(event, this)"'}>
    ${arrastrado
      ? `<div class="pend-origen" title="Viene de la sesión ${t.numero_sesion}">S${t.numero_sesion}</div>`
      : `<div class="drag-handle" title="Arrastrar para reordenar"
              onmousedown="this.closest('.tema-row').draggable = true">⠿</div>`}
    <div class="checkbox ${visto?'checked':''}" onclick="toggleTema('${t.id}', this)"></div>
    <div class="tema-content">
      <div class="tema-nombre ${visto?'done':''}" data-tema="${esc(t.tema)}" title="Clic para editar el título"
           onclick="editarTema('${t.id}', this)">${esc(t.tema)}<span class="lapiz-tema">✎</span></div>
      <div class="comment-wrap">
        <textarea class="tema-comment" rows="1" placeholder="Agregar comentario…"
          onfocus="this.rows=2"
          oninput="autoSaveComentario('${t.id}', this)"
          onblur="saveComentario('${t.id}', this.value); if(!this.value) this.rows=1">${esc(t.comentario||'')}</textarea>
      </div>
    </div>
    <div class="tema-del" onclick="deleteTema('${t.id}')">✕</div>
  </div>`;
}

// Editar el título de un tema con un clic. Enter guarda, Escape cancela.
function pintarTema(caja, texto){
  caja.dataset.tema = texto;
  caja.innerHTML = esc(texto) + '<span class="lapiz-tema">✎</span>';
}

function editarTema(id, caja){
  if (caja.querySelector('input')) return;
  caja.innerHTML = `<input class="tema-nombre-input" value="${esc(caja.dataset.tema)}"
    onclick="event.stopPropagation()"
    onkeydown="if(event.key==='Enter'){this.blur();} if(event.key==='Escape'){this.dataset.cancelar='1';this.blur();}"
    onblur="guardarTema('${id}', this)">`;
  const inp = caja.querySelector('input');
  inp.focus(); inp.select();
}

async function guardarTema(id, inp){
  const caja  = inp.closest('.tema-nombre');
  const antes = caja.dataset.tema;
  const nuevo = inp.value.trim();

  if (inp.dataset.cancelar || !nuevo || nuevo === antes){ pintarTema(caja, antes); return; }

  const { error } = await sb.from('temario_temas')
    .update({ tema: nuevo, fecha_actualizacion: new Date().toISOString() }).eq('id', id);

  if (error){ alert('No se pudo renombrar el tema: ' + error.message); pintarTema(caja, antes); return; }
  // El tema puede aparecer varias veces (su fila y las copias en amarillo).
  document.querySelectorAll(`.tema-row[data-tema-id="${id}"] .tema-nombre`).forEach(el => pintarTema(el, nuevo));
  flashSaved();
}

// ---------- DETAIL ----------
async function renderDetail(programaId){
  app.innerHTML = '<div class="loading">Cargando cliente…</div>';

  const [{ data: programa, error: e1 }, { data: temas, error: e2 }, { data: sesInfo }] = await Promise.all([
    sb.from('programas_clientes').select('*').eq('id', programaId).single(),
    sb.from('temario_temas').select('*').eq('programa_id', programaId).order('numero_sesion').order('orden'),
    sb.from('sesiones_cliente').select('*').eq('programa_id', programaId)
  ]);

  // Bitácora: fecha y hora de cada reunión
  const fechas = {};
  (sesInfo || []).forEach(f => { fechas[f.numero_sesion] = f; });

  if (e1 || !programa){ app.innerHTML = '<div class="empty">No se encontró el cliente.</div>'; return; }

  const total = programa.total_sesiones || (temas.length ? Math.max(...temas.map(t=>t.numero_sesion)) : 4);

  // Agrupar temas por sesión
  const bySesion = {};
  (temas || []).forEach(t => { (bySesion[t.numero_sesion] ||= []).push(t); });
  const sesionesNums = Object.keys(bySesion).map(Number).sort((a,b)=>a-b);
  const maxNum = Math.max(total, ...sesionesNums, 0);

  // Avance REAL calculado desde los checks (no desde el contador manual
  // sesiones_completadas, que quedaba siempre en 0).
  const totalTemas = temas.length;
  const temasListos = temas.filter(t => t.estado === 'visto').length;
  const pct = totalTemas ? Math.round(temasListos / totalTemas * 100) : 0;
  let done = 0;
  for (let n = 1; n <= maxNum; n++){ const l = bySesion[n] || []; if (l.length && l.every(t => t.estado === 'visto')) done++; }

  // Una sesión "ya se hizo" si tiene al menos un tema marcado o si su fecha ya
  // pasó. Solo desde una sesión ya realizada tiene sentido arrastrar pendientes:
  // los temas de una sesión que aún no ocurre no están "pendientes", solo esperan
  // su turno.
  const ahora = Date.now();
  const sesionRealizada = n => {
    const list = bySesion[n] || [];
    if (list.some(t => t.estado === 'visto')) return true;
    const f = fechas[n]?.fecha_hora;
    return !!f && new Date(f).getTime() < ahora;
  };

  // Un tema sin check de una sesión YA REALIZADA se muestra destacado en todas
  // las sesiones siguientes, hasta que se marque.
  const pendientesPrevios = n => (temas || [])
    .filter(t => t.numero_sesion < n && t.estado !== 'visto' && sesionRealizada(t.numero_sesion))
    .sort((a,b) => a.numero_sesion - b.numero_sesion || a.orden - b.orden);

  let sessionsHtml = '';
  for (let n = 1; n <= maxNum; n++){
    const list = bySesion[n] || [];
    const allDone = list.length > 0 && list.every(t => t.estado === 'visto');
    const isCurrent = n === done + 1;
    const arrastrados = pendientesPrevios(n);
    const stateClass = allDone ? 'done' : isCurrent ? 'current' : 'future';
    const stateLabel = allDone ? 'Completada' : isCurrent ? 'En curso' : 'Próxima';
    const openAttr = isCurrent ? 'open' : '';

    sessionsHtml += `
    <div class="session-block">
      <div class="session-head" onclick="this.parentElement.querySelector('.session-body').classList.toggle('open'); this.querySelector('.chev').classList.toggle('open')">
        <div class="left">
          <div class="session-num ${stateClass}">${n}</div>
          <div>
            <div class="session-title">
              Sesión ${n}
              <span class="fecha-chip" onclick="event.stopPropagation()">
                <input type="date" class="fecha-input" value="${diaParaInput(fechas[n]?.fecha_hora)}"
                       onchange="saveFecha('${programaId}', ${n}, this)">
                <input type="time" class="hora-input" value="${horaParaInput(fechas[n]?.fecha_hora)}"
                       onchange="saveFecha('${programaId}', ${n}, this)">
              </span>
            </div>
            <div class="session-date"><span class="fecha-legible">${fechaLegible(fechas[n]?.fecha_hora)}</span>${list.length} tema${list.length===1?'':'s'}${arrastrados.length ? `<span class="pend-count"> · ${arrastrados.length} pendiente${arrastrados.length===1?'':'s'}</span>` : ''} · ${stateLabel}</div>
          </div>
        </div>
        <div class="chev ${openAttr}">▼</div>
      </div>
      <div class="session-body ${openAttr}">
        ${arrastrados.length ? `
        <div class="pendientes-box">
          <div class="pendientes-title">⚠️ Quedó pendiente de sesiones anteriores</div>
          ${arrastrados.map(t => temaRowHtml(t, true)).join('')}
        </div>` : ''}
        <div class="temas-list" data-sesion="${n}" data-programa="${programaId}" ondragover="temaDragOver(event, this)">
        ${list.map(t => temaRowHtml(t, false)).join('')}
        </div>
        <div class="add-tema-row">
          <input type="text" placeholder="+ agregar tema a la sesión ${n}" onkeydown="if(event.key==='Enter'){addTema('${programaId}', ${n}, this); event.preventDefault();}">
          <button onclick="addTema('${programaId}', ${n}, this.previousElementSibling)">Agregar</button>
        </div>
      </div>
    </div>`;
  }

  // Gráficos del encabezado: barra segmentada por sesión + anillo global.
  let segHtml = '';
  for (let n = 1; n <= maxNum; n++){
    const l = bySesion[n] || [];
    const listos = l.filter(x => x.estado === 'visto').length;
    const p = l.length ? Math.round(listos / l.length * 100) : 0;
    segHtml += `<div class="seg" title="Sesión ${n}: ${listos}/${l.length} temas"><div class="seg-fill" style="width:${p}%"></div></div>`;
  }
  const Rc = 46, RCirc = 2 * Math.PI * Rc, Roff = RCirc * (1 - pct / 100);

  app.innerHTML = `
    <div class="barra-ficha">
      <div class="back-btn" onclick="location.hash='#/'">← Volver al panel</div>
      <div class="acciones-ficha">
        <button class="btn-compartir" onclick="compartirVista('${programaId}', this)">🔗 Compartir con el cliente</button>
        <button class="btn-duplicar" onclick="abrirNuevoCliente('${programaId}')">⧉ Duplicar este programa</button>
        <button class="btn-eliminar" onclick="eliminarPrograma('${programaId}', ${JSON.stringify(programa.cliente).replace(/"/g,'&quot;')}, ${temas.length})">🗑 Eliminar</button>
      </div>
    </div>
    <div class="share-panel" id="sharePanel"></div>
    <div class="client-header">
      <div class="ch-row">
        <div class="ch-info">
          <div class="name" data-nombre="${esc(programa.cliente)}" title="Clic para renombrar"
               onclick="editarNombre('${programaId}', this)">${esc(programa.cliente)} <span class="lapiz">✎</span></div>
          <div class="meta">${programa.tipo === 'mentoria_1a1' ? 'Mentoría 1:1' : 'Adopción Profunda de IA'}${programa.contacto ? ' · ' + esc(programa.contacto) : ''}${programa.fecha_inicio ? ' · Inicio: ' + programa.fecha_inicio : ''}</div>
          <div class="prog-seg">${segHtml}</div>
          <div class="progress-text"><span>${done}/${total} sesiones completas · ${temasListos}/${totalTemas} temas vistos</span></div>
        </div>
        <div class="hring" title="${pct}% de los contenidos">
          <svg width="104" height="104" viewBox="0 0 104 104">
            <circle class="hring-track" cx="52" cy="52" r="${Rc}"></circle>
            <circle class="hring-fill" cx="52" cy="52" r="${Rc}" stroke-dasharray="${RCirc.toFixed(1)}" stroke-dashoffset="${Roff.toFixed(1)}"></circle>
          </svg>
          <div class="hring-num">${pct}%</div>
        </div>
      </div>
    </div>
    ${sessionsHtml}
    <div class="add-session-btn" onclick="addSession('${programaId}', ${maxNum+1})">+ Agregar sesión ${maxNum+1}</div>
  `;
}

// ---------- ACTIONS ----------
async function toggleTema(id, el){
  const nowChecked = !el.classList.contains('checked');
  // Un tema arrastrado aparece dos veces en pantalla (su sesión y la sesión
  // en curso): las dos filas tienen que reflejar el mismo check.
  document.querySelectorAll(`.tema-row[data-tema-id="${id}"]`).forEach(row => {
    row.querySelector('.checkbox').classList.toggle('checked', nowChecked);
    row.querySelector('.tema-nombre').classList.toggle('done', nowChecked);
  });
  // Las cajas ámbar solo muestran lo que sigue pendiente: al marcarlo, se va de
  // todas las sesiones donde aparecía como recordatorio.
  if (nowChecked) sacarDePendientes(id);

  await sb.from('temario_temas').update({ estado: nowChecked ? 'visto' : 'pendiente', fecha_actualizacion: new Date().toISOString() }).eq('id', id);
  flashSaved();
}

function sacarDePendientes(id){
  document.querySelectorAll(`.pendientes-box .tema-row[data-tema-id="${id}"]`).forEach(fila => {
    const caja = fila.closest('.pendientes-box');
    const bloque = caja.closest('.session-block');
    fila.classList.add('saliendo');
    setTimeout(() => {
      fila.remove();
      const quedan = caja.querySelectorAll('.tema-row').length;
      const chip = bloque.querySelector('.pend-count');
      if (!quedan){
        caja.remove();
        if (chip) chip.remove();
      } else if (chip){
        chip.textContent = ` · ${quedan} pendiente${quedan===1?'':'s'}`;
      }
    }, 300);
  });
}

// --- Bitácora: fecha y hora de cada sesión ---
// Día y hora van en campos separados a propósito: un <input datetime-local>
// no entrega ningún valor hasta que están completos el día Y la hora, así que
// anotar solo la fecha se perdía en silencio. La hora es opcional; cuando no
// se indica, se guarda a medianoche y no se muestra.
const p2 = n => String(n).padStart(2,'0');

function diaParaInput(iso){
  if (!iso) return '';
  const d = new Date(iso);
  return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
}

function horaParaInput(iso){
  if (!iso) return '';
  const d = new Date(iso);
  if (!d.getHours() && !d.getMinutes()) return '';
  return `${p2(d.getHours())}:${p2(d.getMinutes())}`;
}

function fechaLegible(iso){
  if (!iso) return '';
  const d = new Date(iso);
  let txt = d.toLocaleDateString('es-CL', { weekday:'long', day:'numeric', month:'long' });
  if (d.getHours() || d.getMinutes())
    txt += ' · ' + d.toLocaleTimeString('es-CL', { hour:'2-digit', minute:'2-digit' });
  return txt.charAt(0).toUpperCase() + txt.slice(1) + ' · ';
}

// Mientras se escribe una fecha, el navegador dispara un `change` por cada
// estado intermedio válido: tecleando el año 2026 pasa por el año 2, 20 y 202.
// Por eso se espera a que termine de escribir y se descartan los años absurdos.
const timersFecha = {};

function saveFecha(programaId, numeroSesion, el){
  const chip = el.closest('.fecha-chip');
  clearTimeout(timersFecha[numeroSesion]);
  timersFecha[numeroSesion] = setTimeout(() => guardarFecha(programaId, numeroSesion, chip), 700);
}

async function guardarFecha(programaId, numeroSesion, chip){
  const dia  = chip.querySelector('.fecha-input').value;
  const hora = chip.querySelector('.hora-input').value;

  // Una hora sin día no dice nada: se espera a que anote el día.
  if (!dia && hora) return;
  if (dia && Number(dia.slice(0,4)) < 2000) return;

  const fechaHora = dia ? new Date(`${dia}T${hora || '00:00'}`).toISOString() : null;
  const { error } = await sb.from('sesiones_cliente').upsert({
    programa_id: programaId,
    numero_sesion: numeroSesion,
    fecha_hora: fechaHora,
    updated_at: new Date().toISOString()
  }, { onConflict: 'programa_id,numero_sesion' });

  if (error){ alert('No se pudo guardar la fecha: ' + error.message); return; }

  // Se actualiza el texto en el lugar, sin volver a dibujar toda la ficha.
  const etiqueta = chip.closest('.session-block').querySelector('.fecha-legible');
  if (etiqueta) etiqueta.textContent = fechaLegible(fechaHora);
  flashSaved();
}

// Los comentarios se guardan solos: 800 ms después de dejar de escribir,
// y también al salir del campo por si el timer aún no alcanzó a correr.
const timersComentario = {};
let ultimoGuardado = {};

function autoSaveComentario(id, el){
  clearTimeout(timersComentario[id]);
  timersComentario[id] = setTimeout(() => saveComentario(id, el.value), 800);
}

async function saveComentario(id, valor){
  clearTimeout(timersComentario[id]);
  if (ultimoGuardado[id] === valor) return;
  ultimoGuardado[id] = valor;

  const { error } = await sb.from('temario_temas')
    .update({ comentario: valor, fecha_actualizacion: new Date().toISOString() })
    .eq('id', id);

  if (error){
    delete ultimoGuardado[id];
    alert('No se pudo guardar el comentario: ' + error.message);
    return;
  }
  // Espeja el texto en la otra copia de la fila (tema arrastrado).
  document.querySelectorAll(`.tema-row[data-tema-id="${id}"] .tema-comment`).forEach(ta => {
    if (ta !== document.activeElement) ta.value = valor;
  });
  flashSaved();
}

// ---------- ARRASTRAR TEMAS (reordenar dentro de la sesión y entre sesiones) ----------
// Se puede soltar un tema en la lista de otra sesión: cambia su numero_sesion
// y se reordenan las dos sesiones afectadas.
let temaArrastrado = null, listaOrigen = null;

function temaDragStart(e, row){
  temaArrastrado = row;
  listaOrigen = row.parentElement;
  row.classList.add('dragging');
  listaOrigen.classList.add('dragging-on');
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', row.dataset.temaId);
}

function temaDragOver(e, lista){
  if (!temaArrastrado) return;
  e.preventDefault();
  lista.classList.add('dragging-on');
  const siguiente = temaDespuesDe(lista, e.clientY);
  if (siguiente) lista.insertBefore(temaArrastrado, siguiente);
  else lista.appendChild(temaArrastrado);
}

function temaDespuesDe(lista, y){
  const filas = [...lista.querySelectorAll('.tema-row:not(.dragging)')];
  let mejor = { dist: Number.NEGATIVE_INFINITY, el: null };
  for (const fila of filas){
    const caja = fila.getBoundingClientRect();
    const dist = y - caja.top - caja.height / 2;
    if (dist < 0 && dist > mejor.dist) mejor = { dist, el: fila };
  }
  return mejor.el;
}

async function temaDragEnd(e, row){
  const destino = row.parentElement;
  const origen  = listaOrigen;
  row.draggable = false;
  row.classList.remove('dragging');
  document.querySelectorAll('.temas-list.dragging-on').forEach(l => l.classList.remove('dragging-on'));
  temaArrastrado = null; listaOrigen = null;

  const cambioSesion = origen && origen !== destino;
  const ahora = new Date().toISOString();
  const programaId = destino.dataset.programa;
  const sesDestino = Number(destino.dataset.sesion);

  // La lista destino: reasigna sesión (por si el tema vino de otra) y reordena.
  const ops = [...destino.querySelectorAll('.tema-row')].map((r, i) =>
    sb.from('temario_temas').update({ numero_sesion: sesDestino, orden: i + 1, fecha_actualizacion: ahora }).eq('id', r.dataset.temaId));

  // La lista de origen solo necesita recompactar su orden.
  if (cambioSesion){
    [...origen.querySelectorAll('.tema-row')].forEach((r, i) =>
      ops.push(sb.from('temario_temas').update({ orden: i + 1, fecha_actualizacion: ahora }).eq('id', r.dataset.temaId)));
  }

  const res = await Promise.all(ops);
  const fallo = res.find(r => r.error);
  if (fallo){ alert('No se pudo guardar el cambio: ' + fallo.error.message); }
  flashSaved();

  // Mover entre sesiones cambia conteos y el amarillo: se redibuja sin perder
  // la posición de scroll. Reordenar dentro de una sesión no necesita redibujo.
  if (cambioSesion && programaId){
    const y = window.scrollY;
    await renderDetail(programaId);
    window.scrollTo(0, y);
  }
}

async function deleteTema(id){
  if (!confirm('¿Eliminar este tema?')) return;
  await sb.from('temario_temas').delete().eq('id', id);
  route();
}

async function addTema(programaId, numeroSesion, inputEl){
  const val = inputEl.value.trim();
  if (!val) return;
  await sb.from('temario_temas').insert({ programa_id: programaId, numero_sesion: numeroSesion, tema: val, orden: 999 });
  inputEl.value = '';
  route();
}

// ---------- COMPARTIR (vista de solo lectura) ----------
// Arma el enlace del reporte para CUALQUIER cliente (el id lo genera la base
// al crearlo). Muestra el link en pantalla para copiar o abrir; no depende
// de nada externo.
function compartirVista(programaId, btn){
  const panel = document.getElementById('sharePanel');
  if (panel.classList.contains('show')){ panel.classList.remove('show'); panel.innerHTML = ''; return; }

  const url = `${location.origin}/panel-clientes/ver.html?id=${programaId}`;
  panel.innerHTML = `
    <div class="sp-title">🔗 Enlace de reporte para el cliente <span class="sp-badge">solo lectura</span></div>
    <div class="sp-row">
      <input class="sp-url" readonly value="${url}" onclick="this.select()">
      <button class="sp-copy" onclick="copiarUrl(${JSON.stringify(url)}, this)">Copiar</button>
      <a class="sp-open" href="${url}" target="_blank" rel="noopener">Abrir ↗</a>
    </div>
    <div class="sp-hint">Compártelo una sola vez: el reporte se actualiza solo cada vez que marcas avances.</div>`;
  panel.classList.add('show');
  panel.querySelector('.sp-url').select();
}

async function copiarUrl(url, btn){
  const original = btn.textContent;
  try {
    await navigator.clipboard.writeText(url);
    btn.textContent = '✓ Copiado';
  } catch (e) {
    btn.textContent = 'Selecciónalo y copia';
  }
  setTimeout(() => { btn.textContent = original; }, 1600);
}

// ---------- RENOMBRAR / ELIMINAR ----------
function pintarNombre(caja, nombre){
  caja.dataset.nombre = nombre;
  caja.innerHTML = esc(nombre) + ' <span class="lapiz">✎</span>';
}

function editarNombre(programaId, caja){
  if (caja.querySelector('input')) return;
  caja.innerHTML = `<input class="nombre-input" value="${esc(caja.dataset.nombre)}"
    onclick="event.stopPropagation()"
    onkeydown="if(event.key==='Enter'){this.blur();} if(event.key==='Escape'){this.dataset.cancelar='1';this.blur();}"
    onblur="guardarNombre('${programaId}', this)">`;
  const inp = caja.querySelector('input');
  inp.focus(); inp.select();
}

async function guardarNombre(programaId, inp){
  const caja  = inp.closest('.name');
  const antes = caja.dataset.nombre;
  const nuevo = inp.value.trim();

  if (inp.dataset.cancelar || !nuevo || nuevo === antes){ pintarNombre(caja, antes); return; }

  const { error } = await sb.from('programas_clientes')
    .update({ cliente: nuevo, updated_at: new Date().toISOString() }).eq('id', programaId);

  if (error){ alert('No se pudo renombrar: ' + error.message); pintarNombre(caja, antes); return; }
  pintarNombre(caja, nuevo);
  flashSaved();
}

// Borrar el programa se lleva por delante su temario, sus comentarios y sus
// fechas (la base borra en cascada). Por eso pide escribir el nombre.
async function eliminarPrograma(programaId, nombre, nTemas){
  if (!confirm(`Vas a eliminar «${nombre}» con sus ${nTemas} temas, comentarios y fechas.\n\nEsto no se puede deshacer.`)) return;

  const escrito = prompt(`Para confirmar, escribe el nombre del cliente:\n\n${nombre}`);
  if (escrito === null) return;
  if (escrito.trim() !== nombre){ alert('El nombre no coincide. No se eliminó nada.'); return; }

  const { error } = await sb.from('programas_clientes').delete().eq('id', programaId);
  if (error){ alert('No se pudo eliminar: ' + error.message); return; }
  flashSaved();
  location.hash = '#/';
}

// ---------- NUEVO CLIENTE / DUPLICAR ----------
// El temario se copia tema por tema: el cliente nuevo queda independiente
// del original, así que editarlo no toca al que sirvió de molde.
let PLANTILLAS = [];

async function abrirNuevoCliente(plantillaId){
  const { data, error } = await sb.from('programas_clientes')
    .select('id,cliente,tipo,total_sesiones,sesiones_completadas').order('cliente');
  if (error){ alert('No se pudo cargar la lista de clientes: ' + error.message); return; }
  PLANTILLAS = data || [];

  const molde = plantillaId ? PLANTILLAS.find(p => p.id === plantillaId) : null;
  document.getElementById('nc-titulo').textContent = molde ? 'Duplicar programa' : 'Nuevo cliente';
  document.getElementById('nc-nombre').value = molde ? molde.cliente + ' (copia)' : '';
  document.getElementById('nc-tipo').value = molde ? (molde.tipo || 'empresa') : 'empresa';
  document.getElementById('nc-total').value = molde ? (molde.total_sesiones || 4) : 4;
  document.getElementById('nc-avance').checked = false;

  const sel = document.getElementById('nc-plantilla');
  sel.innerHTML = '<option value="">Empezar en blanco</option>' +
    PLANTILLAS.map(p => `<option value="${p.id}">${esc(p.cliente)}</option>`).join('');
  sel.value = plantillaId || '';

  document.getElementById('modalNuevo').classList.add('show');
  document.getElementById('nc-nombre').focus();
  document.getElementById('nc-nombre').select();
}

function cerrarNuevoCliente(){
  document.getElementById('modalNuevo').classList.remove('show');
}

// Al elegir un molde, el número de sesiones se ajusta al del original.
function plantillaElegida(){
  const molde = PLANTILLAS.find(p => p.id === document.getElementById('nc-plantilla').value);
  if (molde) document.getElementById('nc-total').value = molde.total_sesiones || 4;
}

async function crearCliente(){
  const nombre = document.getElementById('nc-nombre').value.trim();
  if (!nombre){ alert('Ponle un nombre al cliente.'); return; }

  const tipo      = document.getElementById('nc-tipo').value;
  const total     = parseInt(document.getElementById('nc-total').value, 10) || 4;
  const moldeId   = document.getElementById('nc-plantilla').value;
  const conAvance = document.getElementById('nc-avance').checked;
  const molde     = PLANTILLAS.find(p => p.id === moldeId);

  const btn = document.getElementById('nc-crear');
  btn.disabled = true; btn.textContent = 'Creando…';
  const soltar = () => { btn.disabled = false; btn.textContent = 'Crear cliente'; };

  const { data: nuevo, error } = await sb.from('programas_clientes').insert({
    cliente: nombre,
    tipo,
    estado: 'activo',
    total_sesiones: total,
    sesiones_completadas: (conAvance && molde) ? (molde.sesiones_completadas || 0) : 0
  }).select('id').single();

  if (error){ alert('No se pudo crear el cliente: ' + error.message); soltar(); return; }

  if (moldeId){
    const { data: temas, error: e2 } = await sb.from('temario_temas')
      .select('numero_sesion,orden,tema,estado,comentario')
      .eq('programa_id', moldeId).order('numero_sesion').order('orden');

    if (e2){ alert('El cliente se creó, pero no se pudo leer el temario a copiar: ' + e2.message); }
    else if (temas && temas.length){
      const { error: e3 } = await sb.from('temario_temas').insert(temas.map(t => ({
        programa_id: nuevo.id,
        numero_sesion: t.numero_sesion,
        orden: t.orden,
        tema: t.tema,
        estado: conAvance ? t.estado : 'pendiente',
        comentario: conAvance ? t.comentario : null
      })));
      if (e3) alert('El cliente se creó, pero el temario no se copió: ' + e3.message);
    }
  }

  soltar();
  cerrarNuevoCliente();
  flashSaved();
  location.hash = '#/cliente/' + nuevo.id;
}

async function addSession(programaId, numeroSesion){
  const val = prompt('Primer tema de la sesión ' + numeroSesion + ':');
  if (!val) return;
  await sb.from('temario_temas').insert({ programa_id: programaId, numero_sesion: numeroSesion, tema: val, orden: 1 });
  route();
}
</script>
