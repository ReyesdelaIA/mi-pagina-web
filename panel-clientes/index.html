<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Panel de Clientes — Reyes IA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --navy:#092e56; --navy2:#104b85; --blue:#1266ad; --cyan:#00c9e9; --pale:#eaf9fc;
    --bg:#f5f8fc; --card:#ffffff; --stroke:#e4edf5; --border:#d9e5ee;
    --text:#183047; --muted:#73849a; --sub:#73849a;
    --green:#13a776; --greenbg:#e3f7ed; --greentx:#168653;
    --amber:#e09a2d; --amberbg:#fdf3e2; --red:#c2410c;
    --shadow:0 4px 14px rgba(18,55,91,.05);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);}
  button,input,select,textarea{font:inherit;}
  button{cursor:pointer;}
  a{text-decoration:none;color:inherit;}

  /* ---------- ESTRUCTURA: barra lateral + contenido ---------- */
  .shell{display:flex;min-height:100vh;}
  .sidebar{width:220px;flex:none;background:var(--navy);color:#fff;display:flex;flex-direction:column;
    padding:22px 13px;gap:20px;position:sticky;top:0;height:100vh;}
  .brand{display:flex;align-items:center;gap:10px;padding:2px 9px 18px;border-bottom:1px solid #ffffff22;
    font-size:18px;font-weight:800;cursor:pointer;}
  .brand img{width:40px;height:40px;border-radius:50%;object-fit:cover;}
  .brand small{display:block;color:#99cbf1;font-size:9.5px;font-weight:600;letter-spacing:1.8px;margin-top:2px;}
  .navtitle{font-size:9.5px;text-transform:uppercase;letter-spacing:1.8px;color:#86a9cc;padding:0 13px;margin-bottom:7px;}
  .navbtn{width:100%;text-align:left;border:0;border-radius:10px;background:transparent;color:#bad1e5;
    padding:10px 13px;font-size:13.5px;font-weight:600;margin:2px 0;display:flex;align-items:center;}
  .navbtn.active,.navbtn:hover{color:#fff;background:#ffffff18;}
  .navbtn .ico{display:inline-block;width:24px;color:#61def4;}
  .navbtn .n{margin-left:auto;font-size:11px;color:#86a9cc;font-weight:700;}
  .sidefoot{margin-top:auto;padding:14px 9px 0;border-top:1px solid #ffffff22;font-size:12px;color:#c2d6e8;line-height:1.5;}
  .sidefoot strong{color:#fff;}
  .salir{margin-top:10px;background:transparent;border:1px solid #ffffff30;color:#d6e6f3;border-radius:9px;
    padding:6px 12px;font-size:12px;font-weight:600;}
  .salir:hover{background:#ffffff14;color:#fff;}

  .mobilebar{display:none;}
  .main{flex:1;min-width:0;}
  .wrap{max-width:1240px;margin:0 auto;padding:26px clamp(18px,3vw,40px) 70px;}

  /* ---------- PORTADA ---------- */
  .eyebrow{text-transform:uppercase;font-size:10.5px;font-weight:800;letter-spacing:1.6px;color:var(--blue);}
  .topline{display:flex;justify-content:space-between;align-items:center;gap:15px;}
  .topline h1{margin:4px 0 4px;font-size:clamp(24px,2.6vw,30px);letter-spacing:-1px;color:var(--navy);}
  .lead{font-size:13.5px;color:var(--muted);margin:0;}
  .btn-nuevo{flex-shrink:0;border:0;border-radius:11px;background:var(--blue);color:#fff;padding:11px 16px;
    font-size:13.5px;font-weight:700;box-shadow:0 7px 17px #1266ad26;}
  .btn-nuevo:hover{filter:brightness(1.08);}

  .statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0 22px;}
  .stat{background:var(--card);border:1px solid var(--stroke);border-radius:15px;padding:13px 16px;box-shadow:var(--shadow);}
  .stat-l{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;font-weight:500;}
  .stat-l .sicon{width:24px;height:24px;border-radius:8px;background:var(--pale);color:var(--blue);
    display:grid;place-items:center;font-size:12px;font-weight:800;}
  .stat strong{display:block;color:var(--navy);font-size:24px;letter-spacing:-.8px;margin:7px 0 1px;line-height:1.15;}
  .stat em{display:block;font-style:normal;color:var(--green);font-size:11px;font-weight:600;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  .sectionhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:0 0 12px;}
  .sectionhead h2{font-size:17px;margin:3px 0 0;color:var(--navy);}
  .sectionhead .hint{font-size:12px;color:var(--muted);}
  .buscador{position:relative;width:100%;max-width:300px;}
  .buscador input{width:100%;border:1px solid var(--stroke);border-radius:11px;padding:10px 13px 10px 34px;
    background:#fff;outline:none;font-size:13.5px;color:var(--text);transition:border-color .15s, box-shadow .15s;}
  .buscador input::placeholder{color:#a3b2c0;}
  .buscador input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px #00c9e91f;}
  .buscador .lupa{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#9aabbb;font-size:15px;pointer-events:none;}

  .filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px;}
  .chip{border:1px solid #dce8f0;background:#fff;border-radius:30px;color:#5f7790;padding:6px 12px;font-size:12px;font-weight:700;}
  .chip:hover{border-color:#b9d0e2;}
  .chip.selected{background:var(--navy);border-color:var(--navy);color:#fff;}
  .chip .n{opacity:.6;margin-left:3px;}

  .sec-cli{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:1.4px;
    text-transform:uppercase;color:var(--muted);margin:22px 0 10px;}
  .sec-cli .cuenta{font-size:10.5px;color:var(--muted);background:#e8eff5;padding:2px 8px;border-radius:20px;letter-spacing:0;}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(265px,1fr));gap:12px;}
  .grid-comp{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;}

  .client-card{background:#fff;border:1px solid var(--stroke);border-radius:15px;padding:14px 16px;cursor:pointer;display:block;
    box-shadow:var(--shadow);transition:transform .15s, box-shadow .15s, border-color .15s;}
  .client-card:hover{transform:translateY(-2px);box-shadow:0 10px 24px #12375b17;border-color:#d3e2ee;}
  .ctop{display:flex;align-items:center;gap:11px;}
  .avatar{width:36px;height:36px;border-radius:11px;background:var(--pale);color:var(--blue);display:grid;place-items:center;
    font-weight:800;font-size:13px;flex:none;}
  .avatar.mentoria{background:#fff3e3;color:#c47a17;}
  .cinfo{min-width:0;flex:1;}
  .cname{font-size:14.5px;font-weight:800;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cprog{font-size:11.5px;color:var(--muted);margin-top:1px;}
  .percent{font-weight:800;color:var(--blue);font-size:19px;letter-spacing:-.5px;flex:none;}
  .percent span{font-size:12px;opacity:.7;}
  .track{height:6px;border-radius:20px;background:#eaf1f6;margin:12px 0 9px;overflow:hidden;}
  .fill{height:100%;border-radius:20px;background:linear-gradient(90deg,var(--blue),var(--cyan));transition:width .9s cubic-bezier(.22,1,.36,1);}
  .cbottom{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--muted);gap:8px;}
  .status{color:var(--green);font-weight:700;}
  .status.empezar{color:#d38d25;}
  .cnext{margin-top:7px;font-size:11px;color:#627c95;}
  .cnext b{color:var(--blue);font-weight:700;}

  .client-card.completado{background:#fbfcfe;box-shadow:none;padding:11px 14px;}
  .client-card.completado .avatar{width:30px;height:30px;font-size:11px;border-radius:9px;background:var(--greenbg);color:var(--greentx);}
  .client-card.completado .cname{font-size:13.5px;color:#4a6178;}
  .client-card.completado .cprog{color:var(--greentx);font-weight:700;}

  .empty{color:var(--muted);font-size:14px;padding:20px;text-align:center;background:var(--card);border-radius:14px;border:1.5px dashed var(--border);}
  .loading{padding:60px 20px;text-align:center;color:var(--muted);font-size:14px;}

  /* ---------- FICHA DEL CLIENTE ---------- */
  .barra-ficha{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
  .back-btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--blue);cursor:pointer;}
  .acciones-ficha{display:flex;gap:7px;flex-wrap:wrap;}
  .btn-compartir{border:0;border-radius:10px;background:var(--blue);color:#fff;padding:8px 13px;font-size:12.5px;font-weight:700;
    box-shadow:0 6px 14px #1266ad22;}
  .btn-compartir:hover{filter:brightness(1.08);}
  .btn-duplicar,.btn-completar,.btn-reactivar,.btn-eliminar{border:1px solid var(--border);border-radius:10px;background:#fff;
    color:var(--navy);padding:7px 12px;font-size:12.5px;font-weight:700;}
  .btn-duplicar:hover,.btn-reactivar:hover{border-color:var(--blue);}
  .btn-completar{color:var(--greentx);}
  .btn-completar:hover{border-color:var(--green);background:var(--greenbg);}
  .btn-eliminar{color:#b91c1c;}
  .btn-eliminar:hover{border-color:#ef4444;background:#fef2f2;}

  .share-panel{display:none;background:var(--card);border:1px solid #c8edf4;border-radius:14px;padding:13px 15px;margin-bottom:14px;}
  .share-panel.show{display:block;}
  .sp-title{font-size:13px;font-weight:800;color:var(--navy);margin-bottom:9px;display:flex;align-items:center;gap:8px;}
  .sp-badge{font-size:10px;font-weight:800;background:var(--pale);color:#296c85;padding:2px 8px;border-radius:20px;
    text-transform:uppercase;letter-spacing:.04em;}
  .sp-row{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap;}
  .sp-url{flex:1;min-width:220px;border:1px solid var(--border);border-radius:9px;padding:8px 11px;font-size:12.5px;
    color:var(--text);background:#f8fbfd;outline:none;}
  .sp-url:focus{border-color:var(--cyan);}
  .sp-copy{background:var(--blue);color:#fff;border:none;border-radius:9px;padding:8px 16px;font-size:12.5px;font-weight:700;white-space:nowrap;}
  .sp-open{display:inline-flex;align-items:center;background:#fff;border:1px solid var(--border);border-radius:9px;
    padding:8px 14px;font-size:12.5px;font-weight:700;color:var(--navy);white-space:nowrap;}
  .sp-hint{font-size:11.5px;color:var(--muted);margin-top:8px;}

  .client-header{background:linear-gradient(114deg,var(--navy),#165fa4);border-radius:18px;color:#fff;padding:20px 26px;
    box-shadow:0 12px 30px #092e5626;}
  .client-header .eyebrow{color:#9deef8;}
  .ch-row{display:flex;align-items:center;gap:26px;}
  .ch-info{flex:1;min-width:0;}
  .client-header .name{font-size:24px;font-weight:800;letter-spacing:-.8px;margin:5px 0 3px;display:inline-flex;align-items:center;gap:9px;cursor:pointer;}
  .lapiz{font-size:14px;opacity:.35;}
  .client-header .name:hover .lapiz{opacity:.9;}
  .nombre-input{width:100%;max-width:420px;border:none;border-radius:9px;padding:3px 9px;font-size:21px;font-weight:800;
    color:var(--navy);background:rgba(255,255,255,.96);outline:none;}
  .client-header .meta{font-size:12.5px;color:#c4dded;}
  .prog-seg{display:flex;gap:5px;margin:14px 0 8px;}
  .prog-seg .seg{flex:1;height:6px;background:rgba(255,255,255,.16);border-radius:6px;overflow:hidden;}
  .prog-seg .seg-fill{height:100%;background:var(--cyan);border-radius:6px;transition:width .9s cubic-bezier(.22,1,.36,1);}
  .progress-text{font-size:12px;color:#d8e9fa;}
  .hring{position:relative;width:96px;height:96px;flex-shrink:0;}
  .hring svg{transform:rotate(-90deg);}
  .hring-track{fill:none;stroke:rgba(255,255,255,.15);stroke-width:8;}
  .hring-fill{fill:none;stroke:var(--cyan);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.22,1,.36,1);}
  .hring-num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;}
  .hring-num b{font-size:23px;font-weight:800;letter-spacing:-.5px;line-height:1;}
  .hring-num b i{font-size:13px;font-style:normal;opacity:.85;}
  .hring-num span{font-size:9.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.65;margin-top:3px;}

  .detailstats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:12px 0 20px;}
  .detailstats>div{background:#fff;border:1px solid var(--stroke);border-radius:13px;padding:11px 15px;box-shadow:var(--shadow);}
  .detailstats small{display:block;color:var(--muted);font-size:11.5px;}
  .detailstats strong{display:block;font-size:19px;color:var(--navy);margin:3px 0 1px;letter-spacing:-.4px;}

  /* Sesiones */
  .session-block{background:var(--card);border:1px solid var(--stroke);border-radius:14px;margin-bottom:9px;overflow:hidden;
    box-shadow:var(--shadow);}
  .session-head{padding:11px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;}
  .session-head .left{display:flex;align-items:center;gap:12px;min-width:0;}
  .head-right{display:flex;align-items:center;gap:9px;flex-shrink:0;}
  .session-num{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-weight:800;font-size:13.5px;flex-shrink:0;}
  .session-num.done{background:var(--greenbg);color:var(--greentx);}
  .session-num.current{background:var(--blue);color:#fff;box-shadow:0 5px 12px #1266ad33;}
  .session-num.future{background:#eef4f9;color:#6a8299;}
  .session-title{font-weight:800;font-size:14px;color:var(--navy);display:flex;align-items:center;flex-wrap:wrap;gap:4px;}
  .session-date{font-size:11.5px;color:var(--muted);margin-top:2px;}
  .sessionstate{border-radius:20px;padding:4px 10px;font-size:10.5px;font-weight:800;white-space:nowrap;}
  .sessionstate.done{background:var(--greenbg);color:var(--greentx);}
  .sessionstate.current{background:var(--pale);color:#0e7f99;}
  .sessionstate.future{background:#eef5fa;color:#5d7d97;}
  .btn-sesion{background:#fff;color:var(--greentx);border:1px solid #bfe6cd;border-radius:9px;padding:5px 10px;
    font-size:11.5px;font-weight:700;white-space:nowrap;transition:all .15s;}
  .btn-sesion:hover{border-color:var(--green);background:var(--greenbg);}
  .btn-sesion.is-done{color:var(--muted);border-color:var(--stroke);}
  .btn-sesion.is-done:hover{background:#f3f7fa;}
  .chev{color:#8aa0b3;transition:transform .2s;font-size:11px;}
  .chev.open{transform:rotate(180deg);}

  .fecha-chip{display:inline-flex;gap:5px;margin-left:6px;}
  .fecha-input,.hora-input{border:1px solid var(--stroke);border-radius:7px;padding:2px 6px;font-size:11px;
    color:var(--muted);background:#f8fbfd;cursor:pointer;}
  .fecha-input:hover,.hora-input:hover{border-color:var(--blue);}

  .session-body{display:none;padding:0 16px 12px 62px;}
  .session-body.open{display:block;}

  .tema-row{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-top:1px solid var(--stroke);}
  .checkbox{width:19px;height:19px;border-radius:6px;border:2px solid #c3d3e0;flex-shrink:0;cursor:pointer;
    display:flex;align-items:center;justify-content:center;margin-top:1px;transition:all .15s;background:#fff;}
  .checkbox:hover{border-color:var(--blue);}
  .checkbox.checked{background:var(--blue);border-color:var(--blue);}
  .checkbox.checked::after{content:'✓';color:#fff;font-size:11.5px;font-weight:800;}
  .tema-content{flex:1;min-width:0;}
  .tema-nombre{font-size:13.5px;font-weight:500;line-height:1.4;cursor:text;}
  .tema-nombre.done{color:#4a6178;}
  .lapiz-tema{font-size:11px;opacity:0;margin-left:6px;color:var(--muted);transition:opacity .15s;}
  .tema-row:hover .lapiz-tema{opacity:.5;}
  .tema-nombre-input{width:100%;border:1.5px solid var(--blue);border-radius:7px;padding:2px 8px;font-size:13.5px;font-weight:500;
    color:var(--text);background:#fff;outline:none;}
  .tema-comment{width:100%;border:1px solid transparent;background:transparent;font-size:12px;color:var(--muted);
    padding:2px 0 0;margin:0;resize:none;outline:none;display:block;}
  .tema-comment:focus{color:var(--text);}
  .tema-comment::placeholder{color:#b9c6d2;}
  .comment-wrap{display:flex;align-items:flex-start;gap:8px;}
  .comment-wrap .tema-comment{flex:1;}
  .drag-handle{flex-shrink:0;cursor:grab;color:#cfdae4;font-size:14px;line-height:1;letter-spacing:-2px;padding:3px 0;user-select:none;margin-left:-22px;width:12px;}
  .drag-handle:hover{color:var(--blue);}
  .drag-handle:active{cursor:grabbing;}
  .tema-row.dragging{opacity:.35;}
  .temas-list.dragging-on .tema-comment{pointer-events:none;}
  .tema-del{color:#cbd5df;font-size:14px;cursor:pointer;padding:1px 5px;flex-shrink:0;opacity:0;transition:opacity .15s;}
  .tema-row:hover .tema-del{opacity:1;}
  .tema-del:hover{color:#ef4444;}

  .pendientes-box{background:var(--amberbg);border:1px solid #f6d9a8;border-radius:11px;padding:2px 12px 4px;margin:4px 0 8px;}
  .pendientes-title{font-size:11.5px;font-weight:700;color:#92400e;padding:7px 0 5px;}
  .pendientes-box .tema-row{border-top-color:#f3e1c2;transition:opacity .25s, transform .25s;}
  .pendientes-box .tema-row.saliendo{opacity:0;transform:translateX(18px);}
  .pendientes-box .tema-comment::placeholder{color:#c9a87c;}
  .pend-origen{flex-shrink:0;background:var(--amber);color:#fff;font-size:10px;font-weight:800;border-radius:6px;padding:3px 6px;margin-top:1px;line-height:1;}
  .pend-count{color:#b45309;font-weight:700;}

  .add-tema-row{display:flex;gap:8px;margin-top:8px;}
  .add-tema-row input{flex:1;border:1px dashed var(--border);border-radius:9px;padding:7px 11px;font-size:12.5px;outline:none;background:#fbfdfe;}
  .add-tema-row input:focus{border-style:solid;border-color:var(--cyan);background:#fff;}
  .add-tema-row button{background:var(--pale);color:var(--blue);border:none;border-radius:9px;padding:7px 14px;font-size:12.5px;font-weight:700;}
  .add-tema-row button:hover{background:#d8f3f9;}

  .add-session-btn{display:block;width:100%;background:transparent;border:1.5px dashed var(--border);border-radius:14px;
    padding:11px;text-align:center;font-size:13px;font-weight:700;color:var(--blue);cursor:pointer;margin-top:4px;}
  .add-session-btn:hover{background:#fff;border-color:var(--cyan);}

  .save-pill{position:fixed;bottom:20px;right:20px;background:var(--navy);color:#fff;font-size:12px;font-weight:700;
    padding:8px 16px;border-radius:20px;opacity:0;transition:opacity .3s;pointer-events:none;box-shadow:0 8px 20px #092e5640;z-index:600;}
  .save-pill.show{opacity:.95;}

  /* Ficha de la mentoría (dashboard sobre el avance por sesión) */
  .ficha-dash{background:var(--card);border:1px solid var(--stroke);border-radius:14px;padding:14px 18px;margin:-8px 0 20px;box-shadow:var(--shadow);}
  .fd-head{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
  .fd-t{font-size:14px;font-weight:800;color:var(--navy);display:flex;align-items:center;gap:8px;}
  .fd-edit{margin-left:auto;background:#fff;border:1px solid var(--border);color:var(--navy);border-radius:9px;padding:6px 12px;font-size:12px;font-weight:700;}
  .fd-edit:hover{border-color:var(--blue);}
  .fd-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px 22px;}
  .fd-b{min-width:0;}
  .fd-l{font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px;}
  .fd-chips{display:flex;flex-wrap:wrap;gap:5px;}
  .fd-c{border-radius:20px;padding:3px 10px;font-size:11.5px;font-weight:700;background:#eef3f7;color:var(--muted);white-space:nowrap;}
  .fd-c.pago{background:var(--greenbg);color:var(--greentx);}
  .fd-c.free{background:var(--amberbg);color:#b45309;}
  .fd-kv{font-size:12.5px;line-height:1.7;}
  .fd-kv b{color:var(--muted);font-weight:600;}
  .fd-nivel{display:inline-flex;align-items:baseline;gap:7px;background:var(--pale);border-radius:10px;padding:6px 12px;}
  .fd-nivel b{font-size:18px;font-weight:800;color:var(--blue);line-height:1;}
  .fd-nivel span{font-size:11.5px;font-weight:700;color:#296c85;}
  .fd-acts{font-size:12.5px;line-height:1.65;}
  .fd-acts i{font-style:normal;color:var(--blue);font-weight:700;}
  .fd-txt{font-size:12.5px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;}
  .fd-vacio{background:var(--amberbg);border:1px dashed var(--amber);border-radius:14px;padding:16px 20px;margin:-8px 0 20px;
    display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
  .fd-vacio-t{font-size:14px;font-weight:800;color:#92400e;margin-bottom:3px;}
  .fd-vacio-s{font-size:12.5px;color:#b45309;line-height:1.5;}
  .fd-vacio button{margin-left:auto;background:var(--amber);border:none;color:#fff;border-radius:10px;padding:10px 16px;
    font-size:13px;font-weight:800;white-space:nowrap;}

  /* Modal de nuevo cliente */
  .modal-bg{position:fixed;inset:0;background:rgba(9,46,86,.45);z-index:500;padding:20px;display:none;align-items:center;justify-content:center;}
  .modal-bg.show{display:flex;}
  .modal{background:#fff;border-radius:18px;padding:22px 22px 20px;width:100%;max-width:440px;box-shadow:0 20px 50px rgba(9,46,86,.28);}
  .modal h3{margin:0 0 14px;font-size:18px;font-weight:800;color:var(--navy);}
  .campo{margin-bottom:12px;flex:1;min-width:0;}
  .campo label{display:block;font-size:11.5px;font-weight:700;color:var(--navy2);margin-bottom:5px;}
  .campo input,.campo select{width:100%;border:1px solid var(--border);border-radius:10px;padding:9px 12px;font-size:13.5px;
    color:var(--text);background:#fff;outline:none;}
  .campo input:focus,.campo select:focus{border-color:var(--cyan);}
  .campo-fila{display:flex;gap:10px;}
  .campo-corto{max-width:110px;}
  .check-linea{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);cursor:pointer;}
  .modal-acciones{display:flex;gap:10px;margin-top:18px;}
  .btn-primario{flex:1;background:var(--blue);color:#fff;border:none;border-radius:11px;padding:11px;font-size:13.5px;font-weight:700;}
  .btn-primario:disabled{opacity:.6;cursor:default;}
  .btn-secundario{background:#eef3f7;color:var(--muted);border:none;border-radius:11px;padding:11px 18px;font-size:13.5px;font-weight:700;}

  /* Gate de acceso */
  .lock{position:fixed;inset:0;background:linear-gradient(135deg,var(--navy),#165fa4);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;}
  .lock.hide{display:none;}
  .lock-box{background:#fff;border-radius:20px;padding:28px 26px;width:100%;max-width:360px;text-align:center;box-shadow:0 24px 60px #00000033;}
  .lock-logo{width:64px;height:64px;border-radius:50%;object-fit:cover;margin-bottom:8px;}
  .lock-title{font-size:19px;font-weight:800;color:var(--navy);margin-bottom:4px;}
  .lock-sub{font-size:12.5px;color:var(--muted);margin-bottom:18px;}
  .lock-box input{width:100%;border:1px solid var(--border);border-radius:10px;padding:11px 14px;font-size:14px;outline:none;margin-bottom:10px;}
  .lock-box input:focus{border-color:var(--cyan);}
  .lock-box button{width:100%;background:var(--blue);color:#fff;border:none;border-radius:11px;padding:12px;font-size:14px;font-weight:700;}
  .lock-err{font-size:12px;color:#b91c1c;margin-top:10px;display:none;}
  .lock-err.show{display:block;}

  /* ---------- RESPONSIVE ---------- */
  @media (max-width:1050px){
    .statgrid{grid-template-columns:repeat(2,1fr);}
  }
  @media (max-width:760px){
    .sidebar{display:none;}
    .shell{display:block;}
    .mobilebar{display:flex;align-items:center;justify-content:space-between;background:var(--navy);color:#fff;
      padding:10px 16px;position:sticky;top:0;z-index:100;font-weight:700;font-size:14px;}
    .mobilebar .mb-brand{display:flex;align-items:center;gap:8px;cursor:pointer;}
    .mobilebar img{width:30px;height:30px;border-radius:50%;}
    .mobilebar .salir{margin:0;}
    .wrap{padding:18px 16px 60px;}
    .topline{align-items:flex-start;}
    .statgrid{gap:8px;margin:16px 0 18px;}
    .stat{padding:11px 13px;}
    .stat strong{font-size:20px;}
    .sectionhead{flex-direction:column;align-items:stretch;}
    .buscador{max-width:none;}
    .grid,.grid-comp{grid-template-columns:1fr;}
    .client-header{padding:18px;}
    .ch-row{gap:12px;}
    .client-header .name{font-size:20px;}
    .hring{width:76px;height:76px;}
    .hring svg{width:76px;height:76px;}
    .hring-num b{font-size:18px;}
    .hring-num span{display:none;}
    .detailstats{gap:7px;}
    .detailstats>div{padding:9px 11px;}
    .detailstats strong{font-size:15px;}
    .session-head{padding:11px 12px;flex-wrap:wrap;}
    .head-right{padding-left:46px;}
    .session-body{padding:0 12px 12px 14px;}
    .drag-handle{margin-left:0;}
    .sessionstate{display:none;}
    .tema-del{opacity:1;}
  }
</style>
</head>
<body>

<div class="lock" id="lock">
  <div class="lock-box">

    <div class="lock-title">Panel de Clientes</div>
    <div class="lock-sub">Panel interno de Reyes IA.</div>
    <input type="email" id="lock-email" placeholder="Correo" autocomplete="username" inputmode="email">

</div>

<div class="mobilebar">

</div>

<div class="shell">
  <aside class="sidebar">
    <div class="brand" onclick="irA('todos')"><img src="/icon%20reyes%20IA.png" alt="Reyes IA"><div>Reyes IA<small>PANEL DE CLIENTES</small></div></div>
    <div>
      <div class="navtitle">Espacio de trabajo</div>
      <button class="navbtn" data-nav="todos" onclick="irA('todos')"><span class="ico">▦</span> Vista general</button>
      <button class="navbtn" data-nav="activos" onclick="irA('activos')"><span class="ico">◫</span> Activos</button>

      <strong>Felipe Reyes</strong><br>Administrador · Reyes IA<br>
      <button class="salir" onclick="salir()">Salir</button>

  </aside>
  <main class="main">
    <div class="wrap" id="app">
      <div class="loading">Cargando…</div>
    </div>
  </main>
</div>

<div class="save-pill" id="savePill">Guardado ✓</div>

<div class="modal-bg" id="modalNuevo" onclick="if(event.target===this) cerrarNuevoCliente()">
  <div class="modal">
    <h3 id="nc-titulo">Nuevo cliente</h3>
    <div class="campo">
      <label for="nc-nombre">Nombre del cliente</label>
      <input type="text" id="nc-nombre" placeholder="Ej: Peñuelas" autocomplete="off">

      <div class="campo">
        <label for="nc-tipo">Tipo de programa</label>
        <select id="nc-tipo">
          <option value="empresa">Adopción Profunda — Empresa</option>
          <option value="mentoria_1a1">Mentoría 1:1</option>
        </select>

      <select id="nc-plantilla" onchange="plantillaElegida()">
        <option value="">Empezar en blanco</option>
      </select>

      <button class="btn-secundario" onclick="cerrarNuevoCliente()">Cancelar</button>

    </div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://lzrhpmwrbcrprsnpuadh.supabase.co";
const SUPABASE_KEY = "sb_publishable_oak2a-feuA_tdZxbyqufCw_XpqWGgTZ";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const app = document.getElementById('app');
const savePill = document.getElementById('savePill');

function flashSaved(){
  savePill.classList.add('show');
  clearTimeout(flashSaved._t);
  flashSaved._t = setTimeout(()=>savePill.classList.remove('show'), 1200);
}

function esc(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

window.addEventListener('hashchange', () => { if (desbloqueado) route(); });

/* ---- Acceso con Supabase Auth ----
   Solo una sesión con login (rol authenticated) puede leer y escribir. Las
   tablas quedan cerradas por RLS: la publishable key sin sesión no ve nada.
   El afiche del cliente (/taller) va por /api/afiche con service key, no por
   esta llave. */
let desbloqueado = false;
const lock = document.getElementById('lock');
const lockEmail = document.getElementById('lock-email');
const lockPw = document.getElementById('lock-pw');
const lockErr = document.getElementById('lock-err');

async function entrar(){
  const email = lockEmail.value.trim();
  const pw = lockPw.value;
  lockErr.classList.remove('show');
  if (!email || !pw){ lockErr.textContent = 'Escribe tu correo y contraseña.'; lockErr.classList.add('show'); return; }

  const btn = document.getElementById('lock-btn');
  btn.disabled = true; const t = btn.textContent; btn.textContent = 'Entrando…';

  const { error } = await sb.auth.signInWithPassword({ email, password: pw });

  btn.disabled = false; btn.textContent = t;
  if (error){
    lockErr.textContent = /invalid/i.test(error.message) ? 'Correo o contraseña incorrectos.' : error.message;
    lockErr.classList.add('show');
    return;
  }
  abrir();
}

async function salir(){
  await sb.auth.signOut();
  location.reload();
}

function abrir(){
  desbloqueado = true;
  lock.classList.add('hide');
  route();
}

document.getElementById('lock-btn').onclick = entrar;
lockPw.addEventListener('keydown', e => { if (e.key === 'Enter') entrar(); });
lockEmail.addEventListener('keydown', e => { if (e.key === 'Enter') lockPw.focus(); });

window.addEventListener('DOMContentLoaded', async () => {
  const { data } = await sb.auth.getSession();
  if (data.session) abrir();
  else lockEmail.focus();
});

function route(){
  const h = location.hash;
  const m = h.match(/^#\/cliente\/([a-f0-9-]+)/);
  if (m) renderDetail(m[1]);
  else renderLanding();
  marcarNav();
}

// Barra lateral: "Vista general", "En curso" y "Completados" son filtros de la
// portada. Desde la ficha de un cliente, vuelven a la portada con ese filtro.
let filtroEstado = 'todos';

function irA(filtro){
  filtroEstado = filtro;
  if (location.hash.startsWith('#/cliente/')) location.hash = '#/';
  else { aplicarFiltros(); marcarNav(); window.scrollTo(0, 0); }
}

function marcarNav(){
  const enFicha = location.hash.startsWith('#/cliente/');
  document.querySelectorAll('.navbtn').forEach(b =>
    b.classList.toggle('active', !enFicha && b.dataset.nav ===
      (['curso', 'empezar'].includes(filtroEstado) ? 'activos' : filtroEstado)));
}

function saludo(){
  const h = new Date().getHours();
  return h < 12 ? 'Buenos días' : h < 20 ? 'Buenas tardes' : 'Buenas noches';
}

function iniciales(nombre){
  return (nombre || '?').replace(/[^\p{L}\p{N} ]/gu, ' ').trim().split(/\s+/).slice(0, 2)
    .map(x => x[0]).join('').toUpperCase() || '?';
}

// "mié 28 oct · 10:30" (la hora solo si se anotó).
function fechaCorta(iso){
  const d = new Date(iso);
  let txt = d.toLocaleDateString('es-CL', { weekday:'short', day:'numeric', month:'short' }).replace(/\./g, '');
  if (d.getHours() || d.getMinutes()) txt += ' · ' + d.toLocaleTimeString('es-CL', { hour:'2-digit', minute:'2-digit' });
  return txt;
}

// ---------- LANDING ----------
async function renderLanding(){
  app.innerHTML = '<div class="loading">Cargando programas…</div>';
  const { data: programas, error } = await sb
    .from('programas_clientes')
    .select('*')
    .order('updated_at', { ascending: false });

  if (error){ app.innerHTML = '<div class="empty">Error cargando datos: '+esc(error.message)+'</div>'; return; }

  // Avance por SESIONES: una sesión cuenta como hecha cuando todos sus temas
  // están marcados (la fecha es solo el calendario, no completa la sesión sola).
  // Próximas reuniones (desde hoy a medianoche, para que una sesión de hoy sin
  // hora no quede fuera).
  const hoy = new Date(); hoy.setHours(0, 0, 0, 0);
  const [{ data: temas }, { data: proximas }] = await Promise.all([
    sb.from('temario_temas').select('programa_id,numero_sesion,estado'),
    sb.from('sesiones_cliente').select('programa_id,fecha_hora')
      .gte('fecha_hora', hoy.toISOString()).order('fecha_hora')
  ]);
  const proxDe = {};
  (proximas || []).forEach(f => { proxDe[f.programa_id] ||= f.fecha_hora; });
  const prog = {};
  (temas || []).forEach(t => {
    const g = (prog[t.programa_id] ||= {});
    const s = (g[t.numero_sesion] ||= { t: 0, v: 0 });
    s.t++; if (t.estado === 'visto') s.v++;
  });
  const doneDe = id => Object.values(prog[id] || {}).filter(s => s.t > 0 && s.v === s.t).length;
  const esMentoria = p => p.tipo === 'mentoria_1a1';
  const tipoTexto = p => esMentoria(p) ? 'Mentoría 1:1' : 'Adopción Profunda de IA';
  const avance = p => {
    const total = p.total_sesiones || 8;
    const done = doneDe(p.id);
    return { total, done, pct: total ? Math.round(done / total * 100) : 0 };
  };

  const cardActivo = p => {
    const { total, done, pct } = avance(p);
    const estado = done > 0 ? 'curso' : 'empezar';
    return `<a class="client-card" data-nombre="${esc((p.cliente||'').toLowerCase())}" data-estado="${estado}" onclick="location.hash='#/cliente/${p.id}'">
      <div class="ctop">
        <div class="avatar ${esMentoria(p) ? 'mentoria' : ''}">${esc(iniciales(p.cliente))}</div>
        <div class="cinfo"><div class="cname">${esc(p.cliente)}</div><div class="cprog">${tipoTexto(p)}</div></div>
        <div class="percent">${pct}<span>%</span></div>
      </div>
      <div class="track"><div class="fill" style="width:${pct}%"></div></div>
      <div class="cbottom"><span class="status ${estado}">● ${estado === 'curso' ? 'En curso' : 'Por empezar'}</span><span>${done} de ${total} sesiones</span></div>
      ${proxDe[p.id] ? `<div class="cnext">◷ Próxima: <b>${fechaCorta(proxDe[p.id])}</b></div>` : ''}
    </a>`;
  };

  const cardCompletado = p => `<a class="client-card completado" data-nombre="${esc((p.cliente||'').toLowerCase())}" data-estado="completado" onclick="location.hash='#/cliente/${p.id}'">
      <div class="ctop">
        <div class="avatar">✓</div>
        <div class="cinfo"><div class="cname">${esc(p.cliente)}</div><div class="cprog">Completado</div></div>
      </div>
    </a>`;

  const activos = programas.filter(p => p.estado !== 'completado');
  const completados = programas.filter(p => p.estado === 'completado');
  const enCurso = activos.filter(p => doneDe(p.id) > 0).length;

  // Indicadores de arriba, con datos reales de Supabase.
  const sesionesHechas = programas.reduce((s, p) => s + doneDe(p.id), 0);
  const promedio = activos.length ? Math.round(activos.reduce((s, p) => s + avance(p).pct, 0) / activos.length) : 0;
  const proxima = (proximas || []).find(f => activos.some(p => p.id === f.programa_id));
  const proxCliente = proxima ? programas.find(p => p.id === proxima.programa_id) : null;

  app.innerHTML = `
    <div class="topline">
      <div>
        <div class="eyebrow">Panel de clientes</div>
        <h1>${saludo()}, Felipe 👋</h1>
        <p class="lead">Un vistazo al avance de tus programas de acompañamiento.</p>
      </div>
      <button class="btn-nuevo" onclick="abrirNuevoCliente()">+ Nuevo cliente</button>
    </div>
    <div class="statgrid">
      <div class="stat"><div class="stat-l"><span class="sicon">◫</span>Programas activos</div><strong>${activos.length}</strong><em>${enCurso} en curso · ${activos.length - enCurso} por empezar</em></div>
      <div class="stat"><div class="stat-l"><span class="sicon">✓</span>Sesiones completadas</div><strong>${sesionesHechas}</strong><em>${completados.length} programa${completados.length===1?'':'s'} terminado${completados.length===1?'':'s'}</em></div>
      <div class="stat"><div class="stat-l"><span class="sicon">◷</span>Próxima sesión</div><strong>${proxima ? fechaCorta(proxima.fecha_hora).split(' · ')[0] : '—'}</strong><em>${proxima ? esc(proxCliente.cliente) + (fechaCorta(proxima.fecha_hora).includes(' · ') ? ' · ' + fechaCorta(proxima.fecha_hora).split(' · ')[1] : '') : 'Sin fechas agendadas'}</em></div>
      <div class="stat"><div class="stat-l"><span class="sicon">↗</span>Avance promedio</div><strong>${promedio}%</strong><em>De los programas activos</em></div>
    </div>
    <div class="sectionhead">
      <div><div class="eyebrow">Programas</div><h2>Tus clientes</h2></div>
      <div class="buscador">
        <span class="lupa">⌕</span>
        <input type="text" placeholder="Buscar cliente…" oninput="filtrarClientes(this.value)" autocomplete="off" spellcheck="false">
      </div>
    </div>
    <div class="filters">
      <button class="chip" data-filtro="todos" onclick="irA('todos')">Todos <span class="n">${programas.length}</span></button>
      <button class="chip" data-filtro="curso" onclick="irA('curso')">En curso <span class="n">${enCurso}</span></button>
      <button class="chip" data-filtro="empezar" onclick="irA('empezar')">Por empezar <span class="n">${activos.length - enCurso}</span></button>
      <button class="chip" data-filtro="completado" onclick="irA('completado')">Completados <span class="n">${completados.length}</span></button>
    </div>
    <div id="sinResultados" class="empty" style="display:none">Ningún cliente coincide con la búsqueda.</div>
    ${activos.length ? `
      <div class="cli-seccion">
        <div class="grid">${activos.map(cardActivo).join('')}</div>
      </div>` : ''}
    ${completados.length ? `
      <div class="cli-seccion">
        <div class="sec-cli">✓ Completados <span class="cuenta">${completados.length}</span></div>
        <div class="grid grid-comp">${completados.map(cardCompletado).join('')}</div>
      </div>` : ''}
    ${!programas.length ? '<div class="empty">Aún no hay programas registrados.</div>' : ''}
  `;
  busqueda = '';
  aplicarFiltros();
}

// Búsqueda por nombre + filtro por estado (chips y barra lateral).
let busqueda = '';

function filtrarClientes(q){
  busqueda = (q || '').trim().toLowerCase();
  aplicarFiltros();
}

function aplicarFiltros(){
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('selected', c.dataset.filtro === filtroEstado));
  // "activos" (barra lateral) junta los que van en curso y los por empezar.
  const pasa = e => filtroEstado === 'todos' || e === filtroEstado ||
    (filtroEstado === 'activos' && e !== 'completado');
  let algo = false;
  document.querySelectorAll('.client-card').forEach(c => {
    const ok = pasa(c.dataset.estado) && (!busqueda || (c.dataset.nombre || '').includes(busqueda));
    c.style.display = ok ? '' : 'none';
    if (ok) algo = true;
  });
  document.querySelectorAll('.cli-seccion').forEach(sec => {
    const vis = [...sec.querySelectorAll('.client-card')].some(c => c.style.display !== 'none');
    sec.style.display = vis ? '' : 'none';
  });
  const sr = document.getElementById('sinResultados');
  if (sr) sr.style.display = (algo || !document.querySelector('.client-card')) ? 'none' : '';
}

// Una fila de tema. `arrastrado` = viene de una sesión anterior sin terminar:
// se muestra destacado, sin manilla de arrastre y con la sesión de origen.
function temaRowHtml(t, arrastrado, sesActual, programaId){
  const visto = t.estado === 'visto';
  return `
  <div class="tema-row ${arrastrado ? 'arrastrado' : ''}" data-tema-id="${t.id}"
       ${arrastrado ? '' : 'ondragstart="temaDragStart(event, this)" ondragend="temaDragEnd(event, this)"'}>
    ${arrastrado
      ? `<div class="pend-origen" title="Viene de la sesión ${t.numero_sesion}">S${t.numero_sesion}</div>`
      : `<div class="drag-handle" title="Arrastrar para reordenar"
              onmousedown="this.closest('.tema-row').draggable = true">⠿</div>`}
    ${arrastrado
      ? `<div class="checkbox ${visto?'checked':''}" title="Marcar como hecho en esta sesión" onclick="marcarPendienteAqui('${t.id}', ${sesActual}, '${programaId}', this)"></div>`
      : `<div class="checkbox ${visto?'checked':''}" onclick="toggleTema('${t.id}', this)"></div>`}
    <div class="tema-content">
      <div class="tema-nombre ${visto?'done':''}" data-tema="${esc(t.tema)}" title="Clic para editar el título"
           onclick="editarTema('${t.id}', this)">${esc(t.tema)}<span class="lapiz-tema">✎</span></div>
      <div class="comment-wrap">
        <textarea class="tema-comment" rows="1" placeholder="Agregar comentario…"
          onfocus="this.rows=2"
          oninput="autoSaveComentario('${t.id}', this)"
          onblur="saveComentario('${t.id}', this.value); if(!this.value) this.rows=1">${esc(t.comentario||'')}</textarea>
      </div>
    </div>
    <div class="tema-del" onclick="deleteTema('${t.id}')">✕</div>
  </div>`;
}

// Editar el título de un tema con un clic. Enter guarda, Escape cancela.
function pintarTema(caja, texto){
  caja.dataset.tema = texto;
  caja.innerHTML = esc(texto) + '<span class="lapiz-tema">✎</span>';
}

function editarTema(id, caja){
  if (caja.querySelector('input')) return;
  caja.innerHTML = `<input class="tema-nombre-input" value="${esc(caja.dataset.tema)}"
    onclick="event.stopPropagation()"
    onkeydown="if(event.key==='Enter'){this.blur();} if(event.key==='Escape'){this.dataset.cancelar='1';this.blur();}"
    onblur="guardarTema('${id}', this)">`;
  const inp = caja.querySelector('input');
  inp.focus(); inp.select();
}

async function guardarTema(id, inp){
  const caja  = inp.closest('.tema-nombre');
  const antes = caja.dataset.tema;
  const nuevo = inp.value.trim();

  if (inp.dataset.cancelar || !nuevo || nuevo === antes){ pintarTema(caja, antes); return; }

  const { error } = await sb.from('temario_temas')
    .update({ tema: nuevo, fecha_actualizacion: new Date().toISOString() }).eq('id', id);

  if (error){ alert('No se pudo renombrar el tema: ' + error.message); pintarTema(caja, antes); return; }
  // El tema puede aparecer varias veces (su fila y las copias en amarillo).
  document.querySelectorAll(`.tema-row[data-tema-id="${id}"] .tema-nombre`).forEach(el => pintarTema(el, nuevo));
  flashSaved();
}

// ---------- DETAIL ----------
async function renderDetail(programaId){
  app.innerHTML = '<div class="loading">Cargando cliente…</div>';

  const [{ data: programa, error: e1 }, { data: temas, error: e2 }, { data: sesInfo }, { data: ficha }] = await Promise.all([
    sb.from('programas_clientes').select('*').eq('id', programaId).single(),
    sb.from('temario_temas').select('*').eq('programa_id', programaId).order('numero_sesion').order('orden'),
    sb.from('sesiones_cliente').select('*').eq('programa_id', programaId),
    sb.from('ficha_mentoria').select('datos').eq('programa_id', programaId).maybeSingle()
  ]);

  // Bitácora: fecha y hora de cada reunión
  const fechas = {};
  (sesInfo || []).forEach(f => { fechas[f.numero_sesion] = f; });

  if (e1 || !programa){ app.innerHTML = '<div class="empty">No se encontró el cliente.</div>'; return; }

  const total = programa.total_sesiones || (temas.length ? Math.max(...temas.map(t=>t.numero_sesion)) : 4);

  // Agrupar temas por sesión
  const bySesion = {};
  (temas || []).forEach(t => { (bySesion[t.numero_sesion] ||= []).push(t); });
  const sesionesNums = Object.keys(bySesion).map(Number).sort((a,b)=>a-b);
  // Algunos programas parten con una sesión 0 (el taller inicial de fundamentos).
  // Cuando existe, la numeración corre de 0 a total-1; si no, de 1 a total.
  const minNum = sesionesNums.includes(0) ? 0 : 1;
  const maxNum = Math.max(minNum + total - 1, ...sesionesNums, 0);

  // Avance real. Regla: una sesión cuenta como HECHA si su fecha ya pasó o si
  // todos sus temas están marcados. Un tema cuenta como cubierto si está
  // marcado o si su sesión ya ocurrió (fecha pasada). Así, poner la fecha de
  // una sesión que ya se dio hace subir el avance sin marcar tema por tema.
  const ahora = Date.now();
  const fechaPaso = n => {
    const f = fechas[n]?.fecha_hora;
    return !!f && new Date(f).getTime() < ahora;
  };
  // Una sesión cuenta como HECHA solo cuando marcaste todos sus temas (o usaste
  // "Marcar completa"). La fecha es el calendario, no completa la sesión sola.
  const sesionCompleta = n => {
    const l = bySesion[n] || [];
    return l.length > 0 && l.every(t => t.estado === 'visto');
  };

  const totalTemas = temas.length;
  const temasMarcados = temas.filter(t => t.estado === 'visto').length;
  let done = 0;
  for (let n = minNum; n <= maxNum; n++){ if (sesionCompleta(n)) done++; }
  // El avance se mide por SESIONES completas sobre el total, no por temas.
  const pct = total ? Math.round(done / total * 100) : 0;

  // Próxima reunión agendada (desde hoy a medianoche).
  const hoy = new Date(); hoy.setHours(0, 0, 0, 0);
  const proxSes = Object.keys(fechas).map(Number)
    .filter(n => fechas[n]?.fecha_hora && new Date(fechas[n].fecha_hora) >= hoy)
    .sort((a, b) => new Date(fechas[a].fecha_hora) - new Date(fechas[b].fecha_hora))[0];

  // Para arrastrar pendientes: una sesión "ya se empezó" si tiene algún tema
  // marcado. Sus temas sin marcar se arrastran a las siguientes.
  const sesionRealizada = n => (bySesion[n] || []).some(t => t.estado === 'visto');

  // Un tema SIN MARCAR de una sesión ya realizada se arrastra destacado a las
  // siguientes, hasta que se marque o se mueva — aunque la fecha ya haya pasado.
  const pendientesPrevios = n => (temas || [])
    .filter(t => t.numero_sesion < n && t.estado !== 'visto' && sesionRealizada(t.numero_sesion))
    .sort((a,b) => a.numero_sesion - b.numero_sesion || a.orden - b.orden);

  let sessionsHtml = '';
  for (let n = minNum; n <= maxNum; n++){
    const list = bySesion[n] || [];
    const todosMarcados = list.length > 0 && list.every(t => t.estado === 'visto');
    const completa = todosMarcados;
    const isCurrent = n === minNum + done;
    const arrastrados = pendientesPrevios(n);
    const stateClass = completa ? 'done' : isCurrent ? 'current' : 'future';
    const stateLabel = completa ? 'Completada' : isCurrent ? 'En curso' : 'Próxima';
    const openAttr = isCurrent ? 'open' : '';

    sessionsHtml += `
    <div class="session-block">
      <div class="session-head" onclick="this.parentElement.querySelector('.session-body').classList.toggle('open'); this.querySelector('.chev').classList.toggle('open')">
        <div class="left">
          <div class="session-num ${stateClass}">${completa ? '✓' : p2(n)}</div>
          <div>
            <div class="session-title">
              Sesión ${n}
              <span class="fecha-chip" onclick="event.stopPropagation()">
                <input type="date" class="fecha-input" value="${diaParaInput(fechas[n]?.fecha_hora)}"
                       onchange="saveFecha('${programaId}', ${n}, this)">
                <input type="time" class="hora-input" value="${horaParaInput(fechas[n]?.fecha_hora)}"
                       onchange="saveFecha('${programaId}', ${n}, this)">
              </span>
            </div>
            <div class="session-date"><span class="fecha-legible">${fechaLegible(fechas[n]?.fecha_hora)}</span>${list.length} tema${list.length===1?'':'s'}${arrastrados.length ? `<span class="pend-count"> · ${arrastrados.length} pendiente${arrastrados.length===1?'':'s'}</span>` : ''}</div>
          </div>
        </div>
        <div class="head-right">
          <span class="sessionstate ${stateClass}">${stateLabel}</span>
          ${list.length ? `<button class="btn-sesion ${todosMarcados?'is-done':''}" onclick="event.stopPropagation(); marcarSesionCompleta('${programaId}', ${n}, ${todosMarcados ? 'false' : 'true'})">${todosMarcados ? '↺ Desmarcar' : '✓ Marcar completa'}</button>` : ''}
          <div class="chev ${openAttr}">▼</div>
        </div>
      </div>
      <div class="session-body ${openAttr}">
        ${arrastrados.length ? `
        <div class="pendientes-box">
          <div class="pendientes-title">⚠️ Quedó pendiente de sesiones anteriores</div>
          ${arrastrados.map(t => temaRowHtml(t, true, n, programaId)).join('')}
        </div>` : ''}
        <div class="temas-list" data-sesion="${n}" data-programa="${programaId}" ondragover="temaDragOver(event, this)">
        ${list.map(t => temaRowHtml(t, false)).join('')}
        </div>
        <div class="add-tema-row">
          <input type="text" placeholder="+ agregar tema a la sesión ${n}" onkeydown="if(event.key==='Enter'){addTema('${programaId}', ${n}, this); event.preventDefault();}">
          <button onclick="addTema('${programaId}', ${n}, this.previousElementSibling)">Agregar</button>
        </div>
      </div>
    </div>`;
  }

  // Gráficos del encabezado: barra segmentada por sesión + anillo global.
  let segHtml = '';
  for (let n = minNum; n <= maxNum; n++){
    const l = bySesion[n] || [];
    const marc = l.filter(x => x.estado === 'visto').length;
    // La barra sigue el avance de la sesión: llena si la sesión está hecha
    // (todo marcado o fecha pasada), si no, la proporción de temas marcados.
    const p = sesionCompleta(n) ? 100 : (l.length ? Math.round(marc / l.length * 100) : 0);
    segHtml += `<div class="seg" title="Sesión ${n}: ${marc}/${l.length} temas marcados"><div class="seg-fill" style="width:${p}%"></div></div>`;
  }
  const Rc = 46, RCirc = 2 * Math.PI * Rc, Roff = RCirc * (1 - pct / 100);

  app.innerHTML = `
    <div class="barra-ficha">
      <div class="back-btn" onclick="location.hash='#/'">← Volver al panel</div>
      <div class="acciones-ficha">
        <button class="btn-compartir" onclick="compartirVista('${programa.share_token || ''}', this)">↗ Compartir con el cliente</button>
        ${programa.estado === 'completado'
          ? `<button class="btn-reactivar" onclick="cambiarEstado('${programaId}', 'activo')">↩ Reactivar programa</button>`
          : `<button class="btn-completar" onclick="cambiarEstado('${programaId}', 'completado')">✓ Marcar completado</button>`}
        <button class="btn-duplicar" onclick="abrirNuevoCliente('${programaId}')">⧉ Duplicar</button>
        <button class="btn-eliminar" onclick="eliminarPrograma('${programaId}', ${JSON.stringify(programa.cliente).replace(/"/g,'&quot;')}, ${temas.length})">🗑 Eliminar</button>
      </div>
    </div>
    <div class="share-panel" id="sharePanel"></div>
    <div class="client-header">
      <div class="ch-row">
        <div class="ch-info">
          <div class="eyebrow">${programa.tipo === 'mentoria_1a1' ? 'Mentoría 1:1' : 'Programa de acompañamiento'}</div>
          <div class="name" data-nombre="${esc(programa.cliente)}" title="Clic para renombrar"
               onclick="editarNombre('${programaId}', this)">${esc(programa.cliente)} <span class="lapiz">✎</span></div>
          <div class="meta">${programa.tipo === 'mentoria_1a1' ? 'Mentoría 1:1' : 'Adopción Profunda de IA'}${programa.contacto ? ' · ' + esc(programa.contacto) : ''}${programa.fecha_inicio ? ' · Inicio: ' + programa.fecha_inicio : ''}</div>
          <div class="prog-seg">${segHtml}</div>
          <div class="progress-text"><span>${done}/${total} sesiones completas · ${temasMarcados}/${totalTemas} temas marcados</span></div>
        </div>
        <div class="hring" title="${pct}% de los contenidos">
          <svg width="96" height="96" viewBox="0 0 112 112">
            <circle class="hring-track" cx="56" cy="56" r="${Rc}"></circle>
            <circle class="hring-fill" cx="56" cy="56" r="${Rc}" stroke-dasharray="${RCirc.toFixed(1)}" stroke-dashoffset="${Roff.toFixed(1)}"></circle>
          </svg>
          <div class="hring-num"><b>${pct}<i>%</i></b><span>avance</span></div>
        </div>
      </div>
    </div>
    <div class="detailstats">
      <div><small>Sesiones realizadas</small><strong>${done} / ${total}</strong><small>${pct}% del programa</small></div>
      <div><small>Temas cubiertos</small><strong>${temasMarcados} / ${totalTemas}</strong><small>${totalTemas ? Math.round(temasMarcados / totalTemas * 100) : 0}% del temario</small></div>
      <div><small>Próxima sesión</small><strong>${proxSes ? fechaCorta(fechas[proxSes].fecha_hora).split(' · ')[0] : 'Por definir'}</strong><small>${proxSes ? 'Sesión ' + proxSes + (fechaCorta(fechas[proxSes].fecha_hora).includes(' · ') ? ' · ' + fechaCorta(fechas[proxSes].fecha_hora).split(' · ')[1] : '') : 'Anota la fecha en la sesión'}</small></div>
    </div>
    ${programa.tipo === 'mentoria_1a1' ? fichaDashHtml(programaId, ficha) : ''}
    <div class="sectionhead">
      <div><div class="eyebrow">Ruta de aprendizaje</div><h2>Sesiones del programa</h2></div>
      <span class="hint">Marca temas para registrar el avance</span>
    </div>
    ${sessionsHtml}
    <div class="add-session-btn" onclick="addSession('${programaId}', ${maxNum+1})">+ Agregar sesión ${maxNum+1}</div>
  `;
}

/* ---- Ficha de la mentoría ----
   El diagnóstico que se llena en la primera sesión (mentoria.html) se muestra
   acá arriba como dashboard: lo que tiene, dónde trabaja y en qué se le va la
   semana, para tenerlo a la vista mientras registras el avance por sesión.
   Las etiquetas se repiten a mano porque el contenido viaja como jsonb: la
   ficha puede cambiar de preguntas sin migrar la base. */
const FD_IAS = ['Claude','ChatGPT','Gemini','Copilot','Perplexity','NotebookLM'];
const FD_ECO = { mail:'Mail', repo:'Archivos', comu:'Comunicación', reu:'Reuniones', gestion:'Gestión' };
const FD_GOB = { compra:'Compra', equipo:'Equipo', apoyo:'Apoyo TI' };
const FD_NIV = { 1:'No la usa', 2:'Curioso', 3:'La usa a ratos', 4:'La usa a diario', 5:'Le enseña a otros' };

function fichaDashHtml(programaId, ficha){
  const D = (ficha && ficha.datos) || null;
  const irAFicha = `location.href='/panel-clientes/mentoria.html?p=${programaId}'`;

  if (!D || !Object.keys(D).length){
    return `<div class="fd-vacio">
      <div>
        <div class="fd-vacio-t">Esta mentoría todavía no tiene ficha</div>
        <div class="fd-vacio-s">El diagnóstico se llena en la primera sesión: qué herramientas tiene, dónde vive su trabajo y en qué se le va la semana.</div>
      </div>
      <button onclick="${irAFicha}">Llenar la ficha →</button>
    </div>`;
  }

  const ia = D.ia || {}, eco = D.eco || {}, gob = D.gob || {}, txt = D.txt || {};
  const porEstado = e => FD_IAS.filter(n => (ia[n] || {}).estado === e);
  const chip = (n, cls) => {
    const plan = (ia[n] || {}).plan;
    return `<span class="fd-c ${cls}"${plan ? ` title="${esc(plan)}"` : ''}>${n}</span>`;
  };
  const pago = porEstado('pago'), free = porEstado('free'), sinTener = porEstado('no');

  const ecoLineas = Object.keys(FD_ECO).filter(k => eco[k])
    .map(k => `<b>${FD_ECO[k]}:</b> ${esc(eco[k])}`).join('<br>');
  const gobLineas = Object.keys(FD_GOB).filter(k => gob[k])
    .map(k => `<b>${FD_GOB[k]}:</b> ${esc(gob[k])}`).join('<br>');

  const acts = (D.acts || []).filter(a => (a.t || '').trim())
    .sort((a, b) => (parseFloat(b.h) || 0) - (parseFloat(a.h) || 0)).slice(0, 5)
    .map(a => `· ${esc(a.t)}${a.h ? ` <i>${esc(a.h)} h</i>` : ''}`).join('<br>');

  const bloque = (l, cont) => cont ? `<div class="fd-b"><div class="fd-l">${l}</div>${cont}</div>` : '';

  return `<div class="ficha-dash">
    <div class="fd-head">
      <div class="fd-t">🎯 Ficha del mentoreado</div>
      <button class="fd-edit" onclick="${irAFicha}">✎ Editar ficha</button>
    </div>
    <div class="fd-grid">
      ${bloque('Herramientas', (pago.length || free.length || sinTener.length) ? `<div class="fd-chips">
        ${pago.map(n => chip(n, 'pago')).join('')}
        ${free.map(n => chip(n, 'free')).join('')}
        ${sinTener.map(n => chip(n, '')).join('')}
      </div>` : '')}
      ${bloque('Dónde trabaja', ecoLineas ? `<div class="fd-kv">${ecoLineas}</div>` : '')}
      ${bloque('Contexto', gobLineas ? `<div class="fd-kv">${gobLineas}</div>` : '')}
      ${bloque('Nivel con IA', D.nivel ? `<div class="fd-nivel"><b>${D.nivel}</b><span>${FD_NIV[D.nivel] || ''}</span></div>` : '')}
      ${bloque('En qué gasta su tiempo', acts ? `<div class="fd-acts">${acts}</div>` : '')}
      ${bloque('Qué le gustaría', (txt['t-quiere'] || '').trim() ? `<div class="fd-txt">${esc(txt['t-quiere'])}</div>` : '')}
      ${bloque('Dolores', (txt['t-dolor'] || '').trim() ? `<div class="fd-txt">${esc(txt['t-dolor'])}</div>` : '')}
    </div>
  </div>`;
}

// ---------- ACTIONS ----------
async function toggleTema(id, el){
  const nowChecked = !el.classList.contains('checked');
  // Un tema arrastrado aparece dos veces en pantalla (su sesión y la sesión
  // en curso): las dos filas tienen que reflejar el mismo check.
  document.querySelectorAll(`.tema-row[data-tema-id="${id}"]`).forEach(row => {
    row.querySelector('.checkbox').classList.toggle('checked', nowChecked);
    row.querySelector('.tema-nombre').classList.toggle('done', nowChecked);
  });
  // Las cajas ámbar solo muestran lo que sigue pendiente: al marcarlo, se va de
  // todas las sesiones donde aparecía como recordatorio.
  if (nowChecked) sacarDePendientes(id);

  await sb.from('temario_temas').update({ estado: nowChecked ? 'visto' : 'pendiente', fecha_actualizacion: new Date().toISOString() }).eq('id', id);
  flashSaved();
}

// Marcar un pendiente desde la caja ámbar lo MUEVE a la sesión donde realmente
// se vio (la actual) y lo deja como hecho ahí. Se va de su sesión original y
// del recordatorio amarillo.
async function marcarPendienteAqui(id, sesActual, programaId, el){
  el.classList.add('checked');
  // orden al final de la sesión destino
  const { data: enDestino } = await sb.from('temario_temas')
    .select('orden').eq('programa_id', programaId).eq('numero_sesion', sesActual)
    .order('orden', { ascending: false }).limit(1);
  const nuevoOrden = ((enDestino && enDestino[0]) ? enDestino[0].orden : 0) + 1;

  const { error } = await sb.from('temario_temas').update({
    estado: 'visto',
    numero_sesion: sesActual,
    orden: nuevoOrden,
    fecha_actualizacion: new Date().toISOString()
  }).eq('id', id);

  if (error){ alert('No se pudo mover el tema: ' + error.message); return; }
  flashSaved();
  renderDetail(programaId);
}

function sacarDePendientes(id){
  document.querySelectorAll(`.pendientes-box .tema-row[data-tema-id="${id}"]`).forEach(fila => {
    const caja = fila.closest('.pendientes-box');
    const bloque = caja.closest('.session-block');
    fila.classList.add('saliendo');
    setTimeout(() => {
      fila.remove();
      const quedan = caja.querySelectorAll('.tema-row').length;
      const chip = bloque.querySelector('.pend-count');
      if (!quedan){
        caja.remove();
        if (chip) chip.remove();
      } else if (chip){
        chip.textContent = ` · ${quedan} pendiente${quedan===1?'':'s'}`;
      }
    }, 300);
  });
}

// --- Bitácora: fecha y hora de cada sesión ---
// Día y hora van en campos separados a propósito: un <input datetime-local>
// no entrega ningún valor hasta que están completos el día Y la hora, así que
// anotar solo la fecha se perdía en silencio. La hora es opcional; cuando no
// se indica, se guarda a medianoche y no se muestra.
const p2 = n => String(n).padStart(2,'0');

function diaParaInput(iso){
  if (!iso) return '';
  const d = new Date(iso);
  return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
}

function horaParaInput(iso){
  if (!iso) return '';
  const d = new Date(iso);
  if (!d.getHours() && !d.getMinutes()) return '';
  return `${p2(d.getHours())}:${p2(d.getMinutes())}`;
}

function fechaLegible(iso){
  if (!iso) return '';
  const d = new Date(iso);
  let txt = d.toLocaleDateString('es-CL', { weekday:'long', day:'numeric', month:'long' });
  if (d.getHours() || d.getMinutes())
    txt += ' · ' + d.toLocaleTimeString('es-CL', { hour:'2-digit', minute:'2-digit' });
  return txt.charAt(0).toUpperCase() + txt.slice(1) + ' · ';
}

// Mientras se escribe una fecha, el navegador dispara un `change` por cada
// estado intermedio válido: tecleando el año 2026 pasa por el año 2, 20 y 202.
// Por eso se espera a que termine de escribir y se descartan los años absurdos.
const timersFecha = {};

function saveFecha(programaId, numeroSesion, el){
  const chip = el.closest('.fecha-chip');
  clearTimeout(timersFecha[numeroSesion]);
  timersFecha[numeroSesion] = setTimeout(() => guardarFecha(programaId, numeroSesion, chip), 700);
}

async function guardarFecha(programaId, numeroSesion, chip){
  const dia  = chip.querySelector('.fecha-input').value;
  const hora = chip.querySelector('.hora-input').value;

  // Una hora sin día no dice nada: se espera a que anote el día.
  if (!dia && hora) return;
  if (dia && Number(dia.slice(0,4)) < 2000) return;

  const fechaHora = dia ? new Date(`${dia}T${hora || '00:00'}`).toISOString() : null;
  const { error } = await sb.from('sesiones_cliente').upsert({
    programa_id: programaId,
    numero_sesion: numeroSesion,
    fecha_hora: fechaHora,
    updated_at: new Date().toISOString()
  }, { onConflict: 'programa_id,numero_sesion' });

  if (error){ alert('No se pudo guardar la fecha: ' + error.message); return; }

  // Se actualiza el texto en el lugar, sin volver a dibujar toda la ficha.
  const etiqueta = chip.closest('.session-block').querySelector('.fecha-legible');
  if (etiqueta) etiqueta.textContent = fechaLegible(fechaHora);
  flashSaved();
}

// Los comentarios se guardan solos: 800 ms después de dejar de escribir,
// y también al salir del campo por si el timer aún no alcanzó a correr.
const timersComentario = {};
let ultimoGuardado = {};

function autoSaveComentario(id, el){
  clearTimeout(timersComentario[id]);
  timersComentario[id] = setTimeout(() => saveComentario(id, el.value), 800);
}

async function saveComentario(id, valor){
  clearTimeout(timersComentario[id]);
  if (ultimoGuardado[id] === valor) return;
  ultimoGuardado[id] = valor;

  const { error } = await sb.from('temario_temas')
    .update({ comentario: valor, fecha_actualizacion: new Date().toISOString() })
    .eq('id', id);

  if (error){
    delete ultimoGuardado[id];
    alert('No se pudo guardar el comentario: ' + error.message);
    return;
  }
  // Espeja el texto en la otra copia de la fila (tema arrastrado).
  document.querySelectorAll(`.tema-row[data-tema-id="${id}"] .tema-comment`).forEach(ta => {
    if (ta !== document.activeElement) ta.value = valor;
  });
  flashSaved();
}

// ---------- ARRASTRAR TEMAS (reordenar dentro de la sesión y entre sesiones) ----------
// Se puede soltar un tema en la lista de otra sesión: cambia su numero_sesion
// y se reordenan las dos sesiones afectadas.
let temaArrastrado = null, listaOrigen = null;

function temaDragStart(e, row){
  temaArrastrado = row;
  listaOrigen = row.parentElement;
  row.classList.add('dragging');
  listaOrigen.classList.add('dragging-on');
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', row.dataset.temaId);
}

function temaDragOver(e, lista){
  if (!temaArrastrado) return;
  e.preventDefault();
  lista.classList.add('dragging-on');
  const siguiente = temaDespuesDe(lista, e.clientY);
  if (siguiente) lista.insertBefore(temaArrastrado, siguiente);
  else lista.appendChild(temaArrastrado);
}

function temaDespuesDe(lista, y){
  const filas = [...lista.querySelectorAll('.tema-row:not(.dragging)')];
  let mejor = { dist: Number.NEGATIVE_INFINITY, el: null };
  for (const fila of filas){
    const caja = fila.getBoundingClientRect();
    const dist = y - caja.top - caja.height / 2;
    if (dist < 0 && dist > mejor.dist) mejor = { dist, el: fila };
  }
  return mejor.el;
}

async function temaDragEnd(e, row){
  const destino = row.parentElement;
  const origen  = listaOrigen;
  row.draggable = false;
  row.classList.remove('dragging');
  document.querySelectorAll('.temas-list.dragging-on').forEach(l => l.classList.remove('dragging-on'));
  temaArrastrado = null; listaOrigen = null;

  const cambioSesion = origen && origen !== destino;
  const ahora = new Date().toISOString();
  const programaId = destino.dataset.programa;
  const sesDestino = Number(destino.dataset.sesion);

  // La lista destino: reasigna sesión (por si el tema vino de otra) y reordena.
  const ops = [...destino.querySelectorAll('.tema-row')].map((r, i) =>
    sb.from('temario_temas').update({ numero_sesion: sesDestino, orden: i + 1, fecha_actualizacion: ahora }).eq('id', r.dataset.temaId));

  // La lista de origen solo necesita recompactar su orden.
  if (cambioSesion){
    [...origen.querySelectorAll('.tema-row')].forEach((r, i) =>
      ops.push(sb.from('temario_temas').update({ orden: i + 1, fecha_actualizacion: ahora }).eq('id', r.dataset.temaId)));
  }

  const res = await Promise.all(ops);
  const fallo = res.find(r => r.error);
  if (fallo){ alert('No se pudo guardar el cambio: ' + fallo.error.message); }
  flashSaved();

  // Mover entre sesiones cambia conteos y el amarillo: se redibuja sin perder
  // la posición de scroll. Reordenar dentro de una sesión no necesita redibujo.
  if (cambioSesion && programaId){
    const y = window.scrollY;
    await renderDetail(programaId);
    window.scrollTo(0, y);
  }
}

// Marca (o desmarca) de una vez todos los temas de una sesión.
async function marcarSesionCompleta(programaId, numeroSesion, marcar){
  const { error } = await sb.from('temario_temas')
    .update({ estado: marcar ? 'visto' : 'pendiente', fecha_actualizacion: new Date().toISOString() })
    .eq('programa_id', programaId).eq('numero_sesion', numeroSesion);
  if (error){ alert('No se pudo actualizar la sesión: ' + error.message); return; }
  flashSaved();
  renderDetail(programaId);
}

async function deleteTema(id){
  if (!confirm('¿Eliminar este tema?')) return;
  await sb.from('temario_temas').delete().eq('id', id);
  route();
}

async function addTema(programaId, numeroSesion, inputEl){
  const val = inputEl.value.trim();
  if (!val) return;
  await sb.from('temario_temas').insert({ programa_id: programaId, numero_sesion: numeroSesion, tema: val, orden: 999 });
  inputEl.value = '';
  route();
}

// Marca un programa como completado (baja a la sección Completados) o lo reactiva.
async function cambiarEstado(programaId, nuevoEstado){
  const { error } = await sb.from('programas_clientes')
    .update({ estado: nuevoEstado, updated_at: new Date().toISOString() }).eq('id', programaId);
  if (error){ alert('No se pudo cambiar el estado: ' + error.message); return; }
  flashSaved();
  if (nuevoEstado === 'completado') location.hash = '#/';   // volver al panel a verlo abajo
  else renderDetail(programaId);
}

// ---------- COMPARTIR (vista de solo lectura) ----------
// Arma el enlace del reporte para CUALQUIER cliente (el id lo genera la base
// al crearlo). Muestra el link en pantalla para copiar o abrir; no depende
// de nada externo.
function compartirVista(token, btn){
  const panel = document.getElementById('sharePanel');
  if (panel.classList.contains('show')){ panel.classList.remove('show'); panel.innerHTML = ''; return; }

  if (!token){
    panel.innerHTML = `<div class="sp-title">Este cliente aún no tiene link. Recarga la página e inténtalo de nuevo.</div>`;
    panel.classList.add('show');
    return;
  }

  const url = `${location.origin}/taller/${token}`;
  panel.innerHTML = `
    <div class="sp-title">🔗 Afiche del cliente <span class="sp-badge">solo lectura · en vivo</span></div>
    <div class="sp-row">
      <input class="sp-url" readonly value="${url}" onclick="this.select()">
      <button class="sp-copy" onclick="copiarUrl(${JSON.stringify(url)}, this)">Copiar</button>
      <a class="sp-open" href="${url}" target="_blank" rel="noopener">Abrir ↗</a>
    </div>
    <div class="sp-hint">Mándaselo una sola vez: el afiche muestra las fechas, el lugar, el avance y tus comentarios (como contexto para el cliente), y se actualiza solo cada vez que marcas temas acá.</div>`;
  panel.classList.add('show');
  panel.querySelector('.sp-url').select();
}

async function copiarUrl(url, btn){
  const original = btn.textContent;
  try {
    await navigator.clipboard.writeText(url);
    btn.textContent = '✓ Copiado';
  } catch (e) {
    btn.textContent = 'Selecciónalo y copia';
  }
  setTimeout(() => { btn.textContent = original; }, 1600);
}

// ---------- RENOMBRAR / ELIMINAR ----------
function pintarNombre(caja, nombre){
  caja.dataset.nombre = nombre;
  caja.innerHTML = esc(nombre) + ' <span class="lapiz">✎</span>';
}

function editarNombre(programaId, caja){
  if (caja.querySelector('input')) return;
  caja.innerHTML = `<input class="nombre-input" value="${esc(caja.dataset.nombre)}"
    onclick="event.stopPropagation()"
    onkeydown="if(event.key==='Enter'){this.blur();} if(event.key==='Escape'){this.dataset.cancelar='1';this.blur();}"
    onblur="guardarNombre('${programaId}', this)">`;
  const inp = caja.querySelector('input');
  inp.focus(); inp.select();
}

async function guardarNombre(programaId, inp){
  const caja  = inp.closest('.name');
  const antes = caja.dataset.nombre;
  const nuevo = inp.value.trim();

  if (inp.dataset.cancelar || !nuevo || nuevo === antes){ pintarNombre(caja, antes); return; }

  const { error } = await sb.from('programas_clientes')
    .update({ cliente: nuevo, updated_at: new Date().toISOString() }).eq('id', programaId);

  if (error){ alert('No se pudo renombrar: ' + error.message); pintarNombre(caja, antes); return; }
  pintarNombre(caja, nuevo);
  flashSaved();
}

// Borrar el programa se lleva por delante su temario, sus comentarios y sus
// fechas (la base borra en cascada). Por eso pide escribir el nombre.
async function eliminarPrograma(programaId, nombre, nTemas){
  if (!confirm(`Vas a eliminar «${nombre}» con sus ${nTemas} temas, comentarios y fechas.\n\nEsto no se puede deshacer.`)) return;

  const escrito = prompt(`Para confirmar, escribe el nombre del cliente:\n\n${nombre}`);
  if (escrito === null) return;
  if (escrito.trim() !== nombre){ alert('El nombre no coincide. No se eliminó nada.'); return; }

  const { error } = await sb.from('programas_clientes').delete().eq('id', programaId);
  if (error){ alert('No se pudo eliminar: ' + error.message); return; }
  flashSaved();
  location.hash = '#/';
}

// ---------- NUEVO CLIENTE / DUPLICAR ----------
// El temario se copia tema por tema: el cliente nuevo queda independiente
// del original, así que editarlo no toca al que sirvió de molde.
let PLANTILLAS = [];

async function abrirNuevoCliente(plantillaId){
  const { data, error } = await sb.from('programas_clientes')
    .select('id,cliente,tipo,total_sesiones,sesiones_completadas').order('cliente');
  if (error){ alert('No se pudo cargar la lista de clientes: ' + error.message); return; }
  PLANTILLAS = data || [];

  const molde = plantillaId ? PLANTILLAS.find(p => p.id === plantillaId) : null;
  document.getElementById('nc-titulo').textContent = molde ? 'Duplicar programa' : 'Nuevo cliente';
  document.getElementById('nc-nombre').value = molde ? molde.cliente + ' (copia)' : '';
  document.getElementById('nc-tipo').value = molde ? (molde.tipo || 'empresa') : 'empresa';
  document.getElementById('nc-total').value = molde ? (molde.total_sesiones || 4) : 4;
  document.getElementById('nc-avance').checked = false;

  const sel = document.getElementById('nc-plantilla');
  sel.innerHTML = '<option value="">Empezar en blanco</option>' +
    PLANTILLAS.map(p => `<option value="${p.id}">${esc(p.cliente)}</option>`).join('');
  sel.value = plantillaId || '';

  document.getElementById('modalNuevo').classList.add('show');
  document.getElementById('nc-nombre').focus();
  document.getElementById('nc-nombre').select();
}

function cerrarNuevoCliente(){
  document.getElementById('modalNuevo').classList.remove('show');
}

// Al elegir un molde, el número de sesiones se ajusta al del original.
function plantillaElegida(){
  const molde = PLANTILLAS.find(p => p.id === document.getElementById('nc-plantilla').value);
  if (molde) document.getElementById('nc-total').value = molde.total_sesiones || 4;
}

async function crearCliente(){
  const nombre = document.getElementById('nc-nombre').value.trim();
  if (!nombre){ alert('Ponle un nombre al cliente.'); return; }

  const tipo      = document.getElementById('nc-tipo').value;
  const total     = parseInt(document.getElementById('nc-total').value, 10) || 4;
  const moldeId   = document.getElementById('nc-plantilla').value;
  const conAvance = document.getElementById('nc-avance').checked;
  const molde     = PLANTILLAS.find(p => p.id === moldeId);

  const btn = document.getElementById('nc-crear');
  btn.disabled = true; btn.textContent = 'Creando…';
  const soltar = () => { btn.disabled = false; btn.textContent = 'Crear cliente'; };

  const { data: nuevo, error } = await sb.from('programas_clientes').insert({
    cliente: nombre,
    tipo,
    estado: 'activo',
    total_sesiones: total,
    sesiones_completadas: (conAvance && molde) ? (molde.sesiones_completadas || 0) : 0
  }).select('id').single();

  if (error){ alert('No se pudo crear el cliente: ' + error.message); soltar(); return; }

  if (moldeId){
    const { data: temas, error: e2 } = await sb.from('temario_temas')
      .select('numero_sesion,orden,tema,estado,comentario')
      .eq('programa_id', moldeId).order('numero_sesion').order('orden');

    if (e2){ alert('El cliente se creó, pero no se pudo leer el temario a copiar: ' + e2.message); }
    else if (temas && temas.length){
      const { error: e3 } = await sb.from('temario_temas').insert(temas.map(t => ({
        programa_id: nuevo.id,
        numero_sesion: t.numero_sesion,
        orden: t.orden,
        tema: t.tema,
        estado: conAvance ? t.estado : 'pendiente',
        comentario: conAvance ? t.comentario : null
      })));
      if (e3) alert('El cliente se creó, pero el temario no se copió: ' + e3.message);
    }
  }

  soltar();
  cerrarNuevoCliente();
  flashSaved();
  // En una mentoría 1:1 lo primero es el diagnóstico del mentoreado: recién
  // con eso a la vista tiene sentido registrar el avance sesión a sesión.
  if (tipo === 'mentoria_1a1') location.href = '/panel-clientes/mentoria.html?p=' + nuevo.id;
  else location.hash = '#/cliente/' + nuevo.id;
}

async function addSession(programaId, numeroSesion){
  const val = prompt('Primer tema de la sesión ' + numeroSesion + ':');
  if (!val) return;
  await sb.from('temario_temas').insert({ programa_id: programaId, numero_sesion: numeroSesion, tema: val, orden: 1 });
  route();
}
</script>
