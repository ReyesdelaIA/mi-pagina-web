<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="robots" content="noindex, nofollow"/>
  <title>Admin · Diagnósticos IA</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --navy:#2C3E6B; --gold:#C9973A; --bg:#F5F5F3; --white:#fff; --border:#E2E2E2; --muted:#6B7280; }
    body { font-family: 'Poppins', sans-serif; background: var(--bg); min-height: 100vh; }

    /* Login */
    #login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
    .login-card { background: var(--white); border-radius: 20px; border: 1px solid var(--border); padding: 40px 32px; width: 100%; max-width: 340px; text-align: center; }
    .brand { display: flex; justify-content: center; gap: 4px; margin-bottom: 24px; }
    .brand-r { font-size: 24px; font-weight: 800; color: var(--navy); }
    .brand-i { font-size: 24px; font-weight: 800; color: var(--gold); }
    .login-title { font-size: 15px; font-weight: 700; color: var(--navy); margin-bottom: 20px; }
    .input-field { width: 100%; border: 2px solid var(--border); border-radius: 12px; padding: 12px 16px; font-size: 14px; font-family: 'Poppins', sans-serif; outline: none; transition: border-color .2s; margin-bottom: 12px; }
    .input-field:focus { border-color: var(--navy); }
    .btn-primary { width: 100%; background: var(--navy); color: white; border: none; border-radius: 12px; padding: 12px; font-size: 13px; font-weight: 700; font-family: 'Poppins', sans-serif; cursor: pointer; }
    .btn-primary:hover { background: #233260; }
    .err-msg { color: #991B1B; font-size: 12px; margin-bottom: 10px; }

    /* Dashboard */
    #dashboard { display: none; }
    .top-bar { background: var(--navy); padding: 14px 28px; display: flex; align-items: center; justify-content: space-between; }
    .top-brand { display: flex; align-items: center; gap: 8px; }
    .top-brand span:first-child { font-size: 18px; font-weight: 800; color: white; }
    .top-brand span:last-child  { font-size: 18px; font-weight: 800; color: var(--gold); }
    .top-sep { color: rgba(255,255,255,.3); margin: 0 8px; }
    .top-label { color: rgba(255,255,255,.65); font-size: 13px; font-weight: 500; }
    .top-actions { display: flex; gap: 10px; align-items: center; }
    .btn-csv { background: var(--gold); color: white; border: none; border-radius: 8px; padding: 8px 16px; font-size: 12px; font-weight: 700; font-family: 'Poppins', sans-serif; cursor: pointer; }
    .btn-exit { background: none; border: none; color: rgba(255,255,255,.5); font-size: 12px; cursor: pointer; font-family: 'Poppins', sans-serif; }
    .btn-exit:hover { color: white; }
    .live-dot { display: flex; align-items: center; gap: 6px; color: rgba(255,255,255,.7); font-size: 11px; font-weight: 500; }
    .live-dot .dot { width: 7px; height: 7px; border-radius: 50%; background: #4ADE80; box-shadow: 0 0 0 0 rgba(74,222,128,.7); animation: pulse 2s infinite; }
    @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(74,222,128,.6)} 70%{box-shadow:0 0 0 6px rgba(74,222,128,0)} 100%{box-shadow:0 0 0 0 rgba(74,222,128,0)} }

    .main { padding: 24px 28px; max-width: 1200px; margin: 0 auto; }

    /* Metrics */
    .metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 24px; }
    .metric-card { background: var(--white); border-radius: 14px; border: 1px solid var(--border); padding: 18px; }
    .metric-icon { font-size: 22px; margin-bottom: 6px; }
    .metric-val  { font-size: 22px; font-weight: 800; color: var(--navy); line-height: 1; }
    .metric-lbl  { font-size: 11px; color: var(--muted); margin-top: 4px; }

    /* Hero */
    .hero { display: flex; align-items: center; gap: 20px; margin-bottom: 22px; flex-wrap: wrap; }
    .hero-total { display: flex; align-items: center; gap: 12px; }
    .hero-num { font-size: 46px; font-weight: 800; color: var(--navy); line-height: .9; font-variant-numeric: tabular-nums; }
    .hero-num-lbl { font-size: 12px; color: var(--muted); line-height: 1.4; }
    .hero-num-lbl b { color: var(--navy); font-weight: 700; }
    .hero-mid { display: flex; gap: 12px; flex-wrap: wrap; flex: 1; }
    .hero-chip { background: var(--white); border: 1px solid var(--border); border-radius: 14px; padding: 10px 16px; display: flex; align-items: center; gap: 10px; }
    .hero-chip .hc-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
    .hero-chip .hc-k { font-size: 9px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); font-weight: 600; }
    .hero-chip .hc-v { font-size: 15px; font-weight: 800; color: var(--navy); line-height: 1.1; }
    .hero-right { margin-left: auto; }
    .resumen-filter { border: 1.5px solid var(--border); border-radius: 10px; padding: 9px 14px; font-size: 13px; font-family: 'Poppins', sans-serif; color: var(--navy); font-weight: 700; outline: none; cursor: pointer; background: #fff; }
    .resumen-filter:focus { border-color: var(--navy); }

    /* Chart cards */
    .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
    .chart-card { background: var(--white); border: 1px solid var(--border); border-radius: 16px; padding: 20px 22px; }
    .chart-card.wide { grid-column: 1 / -1; }
    .chart-card h3 { font-size: 13px; font-weight: 700; color: var(--navy); margin-bottom: 18px; display: flex; align-items: center; gap: 8px; }
    .chart-card h3 .ico { font-size: 16px; }
    .cbar-row { display: flex; align-items: center; gap: 12px; margin-bottom: 13px; }
    .cbar-row:last-child { margin-bottom: 0; }
    .cbar-label { width: 120px; flex-shrink: 0; font-size: 12px; color: #3a3a3a; font-weight: 600; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cbar-track { flex: 1; height: 26px; background: #F1F1EE; border-radius: 8px; overflow: hidden; min-width: 40px; }
    .cbar-fill { display: block; height: 100%; border-radius: 8px; min-width: 4px; width: 0; transition: width .6s cubic-bezier(.34,1.2,.4,1); }
    .cbar-track.stack { display: flex; }
    .cbar-fill.seg + .cbar-fill.seg { box-shadow: -2px 0 0 0 var(--white); }
    .cbar-val { width: 62px; flex-shrink: 0; text-align: right; font-size: 13px; font-weight: 800; color: var(--navy); font-variant-numeric: tabular-nums; }
    .cbar-val .pct { font-size: 11px; font-weight: 600; color: var(--muted); }
    .split-legend { display: flex; gap: 18px; font-size: 11px; color: var(--muted); margin: -6px 0 16px; }
    .split-legend span { display: flex; align-items: center; gap: 6px; }
    .split-legend span::before { content: ''; width: 11px; height: 11px; border-radius: 3px; }
    .lg-emp::before { background: var(--navy); }
    .lg-per::before { background: var(--gold); }
    .lg-free::before { background: #1baf7a; }
    .dist-empty { font-size: 12px; color: var(--muted); padding: 8px 0; }

    /* Layout */
    .content { display: flex; gap: 16px; }

    /* Table */
    .table-wrap { flex: 1; background: var(--white); border-radius: 14px; border: 1px solid var(--border); overflow: hidden; min-width: 0; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    thead tr { background: #FAFAFA; border-bottom: 1px solid var(--border); }
    th { padding: 12px 16px; text-align: left; font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; white-space: nowrap; }
    tbody tr { border-bottom: 1px solid #F5F5F5; cursor: pointer; transition: background .15s; }
    tbody tr:hover { background: #F9F9F9; }
    tbody tr.active { background: rgba(44,62,107,.05); }
    td { padding: 12px 16px; vertical-align: middle; }
    .td-empresa { font-weight: 700; color: var(--navy); }
    .td-nombre  { color: #555; }
    .td-eco     { color: var(--muted); font-size: 11px; }
    .chip { display: inline-block; background: rgba(44,62,107,.1); color: var(--navy); border-radius: 20px; padding: 2px 8px; font-size: 10px; font-weight: 600; margin: 1px; }
    .chip.gold { background: rgba(201,151,58,.12); color: var(--gold); }

    /* Side panel */
    .side-panel { width: 300px; flex-shrink: 0; background: var(--white); border-radius: 14px; border: 1px solid var(--border); padding: 20px; align-self: flex-start; display: none; }
    .side-panel.open { display: block; }
    .side-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
    .side-title { font-size: 13px; font-weight: 700; color: var(--navy); }
    .btn-close { background: none; border: none; color: #ccc; font-size: 18px; cursor: pointer; line-height: 1; }
    .btn-close:hover { color: #999; }
    .detail-row { margin-bottom: 14px; }
    .detail-key { font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 4px; }
    .detail-val { font-size: 13px; font-weight: 600; color: var(--navy); }
    .detail-chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
    .detail-comment { font-size: 12px; color: #555; background: #F9F9F9; border-radius: 8px; padding: 10px 12px; line-height: 1.5; }
    .detail-date { font-size: 11px; color: var(--muted); padding-top: 10px; border-top: 1px solid var(--border); }

    .loading { text-align: center; padding: 40px; color: var(--muted); font-size: 13px; }

    @media(max-width: 900px) { .metrics { grid-template-columns: 1fr 1fr; } .charts { grid-template-columns: 1fr; } .chart-card.wide { grid-column: auto; } .hero-mid { order: 3; flex-basis: 100%; } .hero-right { margin-left: 0; } .side-panel { display: none !important; } }
    @media(max-width: 600px) { .metrics { grid-template-columns: 1fr; } .main { padding: 16px; } th:nth-child(n+4), td:nth-child(n+4) { display: none; } }
  </style>
</head>
<body>

<!-- Login -->

  <div class="login-card">
    <div class="brand"><span class="brand-r">Reyes</span><span class="brand-i">IA</span></div>
    <div class="login-title">Dashboard · Acceso restringido</div>
    <div class="err-msg" id="login-err" style="display:none">Contraseña incorrecta.</div>
    <input class="input-field" type="password" id="pw-input" placeholder="Contraseña" onkeydown="if(event.key==='Enter')doLogin()"/>
    <button class="btn-primary" onclick="doLogin()">Ingresar</button>
  </div>
</div>

<!-- Dashboard -->
<div id="dashboard">
  <div class="top-bar">
    <div class="top-brand">
      <span>Reyes</span><span>IA</span>
      <span class="top-sep">·</span>
      <span class="top-label">Diagnósticos IA</span>
    </div>
    <div class="top-actions">
      <span class="live-dot" id="live-dot" title="Actualiza cada 15s"><span class="dot"></span><span id="live-time">en vivo</span></span>
      <button class="btn-csv" onclick="exportCSV()">Exportar CSV</button>
      <button class="btn-exit" onclick="logout()">Salir</button>

  <div class="main">

      <div class="hero-left">

      <div class="hero-mid" id="hero-chips"></div>
      <div class="hero-right">
        <select class="resumen-filter" id="empresa-filter" onchange="render()">
          <option value="">Todas las empresas</option>

          <span class="side-title">Detalle completo</span>

        </div>
        <div id="side-body"></div>
      </div>
    </div>
  </div>
</div>

<script src="/diagnostico/labels.js"></script>
<script>
const SB_URL = 'https://adtyiqpcddxjnxfxrkod.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFkdHlpcXBjZGR4am54Znhya29kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI5ODM2NjQsImV4cCI6MjA4ODU1OTY2NH0.hTKgoum0LEmrFPj7LE7VbHTMNUocxovJqmkfOsTNubA';

// Etiquetas centralizadas en /diagnostico/labels.js (las comparte el mail y el panel)
const _L = window.DIAG_LABELS;
const MAIL_L = _L.MAIL, REPO_L = _L.REPO, TRAB_L = _L.TRABAJO, NIVEL_L = _L.NIVEL_CORTO;
const IA_L = _L.TOOLS, USOS_L = _L.USOS, CAP_L = _L.CAPACITACION, APR_L = _L.APRENDER, TEM_L = _L.TEMORES;
// Preguntas retiradas del formulario, se mantienen para leer el histórico
const REUN_L = _L.REUNIONES, RES_L = _L.RESISTENCIAS, AREA_L = _L.AREAS_INTERES;

let allData = [];
let selectedId = null;

// Auth
async function doLogin() {
  const pw = document.getElementById('pw-input').value;
  const res = await fetch('/api/diagnostico-auth', {
    method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({password: pw})
  });
  if (res.ok) {
    sessionStorage.setItem('diag_auth','1');
    showDashboard();
  } else {
    document.getElementById('login-err').style.display = 'block';
  }
}

function logout() { sessionStorage.removeItem('diag_auth'); location.reload(); }

function showDashboard() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  loadData();
  startAutoRefresh();
}

async function loadData() {
  const res = await fetch(`${SB_URL}/rest/v1/diagnosticos?order=created_at.desc`, {
    headers: { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}` }
  });
  allData = await res.json();
  populateEmpresaFilter();
  render();
  const t = new Date().toLocaleTimeString('es-CL', {hour:'2-digit', minute:'2-digit'});
  const lt = document.getElementById('live-time'); if (lt) lt.textContent = `en vivo · ${t}`;
}

// Datos según el filtro de empresa activo
function filtered() {
  const emp = document.getElementById('empresa-filter').value;
  return emp ? allData.filter(d => d.empresa === emp) : allData;
}

function populateEmpresaFilter() {
  const sel = document.getElementById('empresa-filter');
  const empresas = [...new Set(allData.map(d => d.empresa).filter(Boolean))].sort();
  const cur = sel.value;
  sel.innerHTML = '<option value="">Todas las empresas</option>' +
    empresas.map(e => `<option value="${esc(e)}">${e}</option>`).join('');
  sel.value = cur;
}

function render() { renderHero(); renderCharts(); renderTable(); }

function freq(arr) { return arr.reduce((a,k) => { a[k]=(a[k]||0)+1; return a; }, {}); }
function topKey(obj) { const e = Object.entries(obj).sort((a,b)=>b[1]-a[1])[0]; return e ? e[0] : null; }

// ── Colores por entidad (fijos: el color sigue a la categoría, no a su ranking) ──
const COL = {
  plataforma_mail: { outlook:'#2a78d6', gmail:'#e34948', mix:'#4a3aa7', otro:'#eb6834' },
  nivel_equipo:    { cero:'#e87ba4', basico:'#eda100', frecuente:'#1baf7a', avanzado:'#2a78d6' },
  area_trabajo:    { finanzas:'#2a78d6', rrhh:'#1baf7a', ventas:'#eda100', operaciones:'#4a3aa7', marketing:'#e34948', programacion_ti:'#eb6834', gerencia_general:'#e87ba4', otra:'#898781',
                     ccu_compras_directas:'#2a78d6', ccu_comercio_exterior:'#1baf7a', ccu_control_gestion:'#4a3aa7',
                     ccu_compras_servicios:'#eda100', ccu_compras_industriales:'#e34948', ccu_gerencia_abastecimiento:'#eb6834' },
  areas_interes:   { finanzas:'#2a78d6', marketing:'#e34948', operaciones:'#4a3aa7', comercial:'#1baf7a', rrhh:'#eda100', ti:'#eb6834', legal:'#e87ba4', todas:'#008300', otra:'#898781' },
  resistencias:    { no:'#0ca30c', algo:'#fab219', si:'#d03b3b', no_se:'#898781' }, // semáforo
  quiere_capacitacion: { si:'#0ca30c', si_pero:'#1baf7a', no_se:'#fab219', no:'#d03b3b' },
  usos_ia:         { ninguna:'#898781' },   // el resto queda en el azul por defecto
  areas_aprender:  { todo:'#008300' },
  temores:         { ninguno:'#0ca30c', confidencialidad:'#d03b3b', alucinaciones:'#eb6834',
                     calidad:'#fab219', empleo:'#e34948', dependencia:'#4a3aa7',
                     tiempo:'#eda100', etica:'#e87ba4' },
};

// Una fila de barra: etiqueta + barra coloreada (ancho = relativo al máximo) + valor·%
function cbar(label, count, maxCount, denom, color) {
  const w = maxCount ? Math.round(count/maxCount*100) : 0;
  const pct = denom ? Math.round(count/denom*100) : 0;
  return `<div class="cbar-row">
    <span class="cbar-label" title="${esc(label)}">${esc(label)}</span>
    <span class="cbar-track"><span class="cbar-fill" style="width:${w}%;background:${color}"></span></span>
    <span class="cbar-val">${count} <span class="pct">${pct}%</span></span>
  </div>`;
}

// Gráfico de barras para un campo simple (radio). order = orden fijo de categorías.
function chartSimple(title, ico, data, field, labelMap, order) {
  const fq = freq(data.map(d => d[field]).filter(Boolean));
  const keys = (order || Object.keys(labelMap)).filter(k => fq[k]);
  Object.keys(fq).forEach(k => { if (!keys.includes(k)) keys.push(k); });
  keys.sort((a,b) => fq[b]-fq[a]);
  const max = Math.max(...keys.map(k => fq[k]), 1);
  const cmap = COL[field] || {};
  const body = keys.length
    ? keys.map(k => cbar(labelMap[k]||k, fq[k], max, data.length, cmap[k]||'#2a78d6')).join('')
    : '<div class="dist-empty">Sin datos.</div>';
  return card(title, ico, body);
}

// Gráfico de barras para un campo array (checkboxes). denom = nº de personas.
function chartArray(title, ico, data, field, labelMap) {
  const fq = freq(data.flatMap(d => d[field] || []));
  const keys = Object.keys(fq).sort((a,b) => fq[b]-fq[a]);
  const max = Math.max(...keys.map(k => fq[k]), 1);
  const cmap = COL[field] || {};
  const body = keys.length
    ? keys.map(k => cbar(labelMap[k]||k, fq[k], max, data.length, cmap[k]||'#2a78d6')).join('')
    : '<div class="dist-empty">Sin datos.</div>';
  return card(title, ico, body);
}

// Herramientas IA: barra apilada gratis (verde) + de pago empresa (navy) + de pago propia (dorado)
function chartTools(data) {
  const gratis = {}, pagoEmp = {}, pagoYo = {}, pagoSD = {};
  const add = (m, k) => { m[k] = (m[k]||0) + 1; };
  data.forEach(d => {
    (d.herramientas_gratis || []).forEach(k => add(gratis, k));
    const emp = d.herramientas_empresa || [], per = d.herramientas_personal || [];
    emp.forEach(k => add(pagoEmp, k));
    per.forEach(k => add(pagoYo, k));
    // De pago sin dueño declarado (o respuestas antiguas sin el dato de versión)
    (d.herramientas_pago || []).filter(k => !emp.includes(k) && !per.includes(k)).forEach(k => add(pagoSD, k));
  });
  const tot = k => (gratis[k]||0) + (pagoEmp[k]||0) + (pagoYo[k]||0) + (pagoSD[k]||0);
  const keys = [...new Set([...Object.keys(gratis), ...Object.keys(pagoEmp), ...Object.keys(pagoYo), ...Object.keys(pagoSD)])]
    .sort((a,b) => tot(b) - tot(a));
  const legend = '<div class="split-legend"><span class="lg-free">Versión gratis</span><span class="lg-emp">De pago · la empresa</span><span class="lg-per">De pago · la persona</span></div>';
  if (!keys.length) return card('Herramientas IA · versión y quién paga', '🤖', legend + '<div class="dist-empty">Nadie declaró herramientas de IA aún.</div>', true);
  const max = Math.max(...keys.map(tot), 1);
  const seg = (n, color) => n ? `<span class="cbar-fill seg" style="width:${Math.round(n/max*100)}%;background:${color}"></span>` : '';
  const body = keys.map(k => {
    const g = gratis[k]||0, e = pagoEmp[k]||0, p = pagoYo[k]||0, s = pagoSD[k]||0;
    return `<div class="cbar-row">
      <span class="cbar-label" title="${esc(IA_L[k]||k)}">${esc(IA_L[k]||k)}</span>
      <span class="cbar-track stack">
        ${seg(g, '#1baf7a')}${seg(e, 'var(--navy)')}${seg(p, 'var(--gold)')}${seg(s, '#898781')}
      </span>
      <span class="cbar-val">${tot(k)}<span class="pct"> ${g}/${e}/${p}</span></span>
    </div>`;
  }).join('');
  return card('Herramientas IA · versión y quién paga', '🤖', legend + body, true);
}

function card(title, ico, body, wide) {
  return `<div class="chart-card${wide?' wide':''}"><h3><span class="ico">${ico}</span>${title}</h3>${body}</div>`;
}

function renderHero() {
  const data = filtered();
  const n = data.length;
  const empresas = new Set(data.map(d => d.empresa).filter(Boolean)).size;
  document.getElementById('h-total').textContent = n;
  document.getElementById('h-empresas').textContent = `${empresas} ${empresas===1?'empresa':'empresas'}`;

  // Titulares: ecosistema líder, nivel más común, herramienta top
  const mailK = topKey(freq(data.map(d => d.plataforma_mail).filter(Boolean)));
  const nivelK = topKey(freq(data.map(d => d.nivel_equipo).filter(Boolean)));
  const iaK = topKey(freq(data.flatMap(d => d.herramientas_ia || []).filter(h => h !== 'ninguna')));
  const chips = [
    { k:'Ecosistema líder', v: MAIL_L[mailK]||'—', c: (COL.plataforma_mail[mailK])||'#2a78d6' },
    { k:'Nivel más común',  v: NIVEL_L[nivelK]||'—', c: (COL.nivel_equipo[nivelK])||'#2a78d6' },
    { k:'Herramienta top',  v: IA_L[iaK]||'—', c:'#4a3aa7' },
  ];
  document.getElementById('hero-chips').innerHTML = n ? chips.map(ch =>
    `<div class="hero-chip"><span class="hc-dot" style="background:${ch.c}"></span><div><div class="hc-k">${ch.k}</div><div class="hc-v">${esc(ch.v)}</div></div></div>`
  ).join('') : '';
}

function renderCharts() {
  const data = filtered();
  const cards = [
    chartSimple('Ecosistema de correo', '📧', data, 'plataforma_mail', MAIL_L, Object.keys(MAIL_L)),
    chartSimple('Cuánto usan la IA hoy', '📊', data, 'nivel_equipo', NIVEL_L, ['cero','basico','frecuente','avanzado']),
    chartTools(data),
    chartArray('Para qué usan la IA', '🛠️', data, 'usos_ia', USOS_L),
    chartArray('Qué quieren aprender a hacer', '🎯', data, 'areas_aprender', APR_L),
    chartArray('Principales temores con la IA', '⚠️', data, 'temores', TEM_L),
    chartSimple('¿Quieren capacitarse?', '🙌', data, 'quiere_capacitacion', CAP_L, ['si','si_pero','no_se','no']),
    chartSimple('Quién respondió · por área', '👥', data, 'area_trabajo', TRAB_L, Object.keys(TRAB_L)),
  ];
  // Preguntas retiradas del formulario: se muestran solo si hay respuestas históricas
  if (data.some(d => (d.areas_interes || []).length))
    cards.push(chartArray('Áreas de interés · histórico', '🗂️', data, 'areas_interes', AREA_L));
  if (data.some(d => d.resistencias))
    cards.push(chartSimple('Apertura a la IA · histórico', '🚦', data, 'resistencias', RES_L, ['no','algo','si','no_se']));
  document.getElementById('charts').innerHTML = cards.join('');
}

function renderTable() {
  const data = filtered();
  const tb = document.getElementById('tbody');
  if (!data.length) { tb.innerHTML = '<tr><td colspan="8" class="loading">Sin diagnósticos aún.</td></tr>'; return; }
  tb.innerHTML = data.map(d => {
    const fecha = new Date(d.created_at).toLocaleDateString('es-CL');
    const nombre = (d.nombre_contacto||'').split(' · ')[0];
    const trab = TRAB_L[d.area_trabajo] || d.area_trabajo || '—';
    const eco = `${MAIL_L[d.plataforma_mail]||d.plataforma_mail||'—'} · ${REPO_L[d.repositorio]||d.repositorio||'—'}`;
    const iaList = (d.herramientas_ia||[]).filter(h => h !== 'ninguna');
    const ias = iaList.length
      ? iaList.slice(0,2).map(h=>`<span class="chip">${IA_L[h]||h}</span>`).join('') + (iaList.length>2?`<span class="chip">+${iaList.length-2}</span>`:'')
      : '<span class="td-eco">Ninguna</span>';
    const nivel = `<span class="chip gold">${NIVEL_L[d.nivel_equipo]||d.nivel_equipo||'—'}</span>`;
    // Respuestas nuevas traen areas_aprender; las antiguas solo areas_interes
    const areas = (d.areas_aprender||[]).length
      ? d.areas_aprender.map(a=>APR_L[a]||a).join(', ')
      : (d.areas_interes||[]).map(a=>AREA_L[a]||a).join(', ');
    const active = selectedId === d.id ? ' class="active"' : '';
    return `<tr${active} onclick="selectRow('${d.id}')">
      <td>${fecha}</td>
      <td class="td-empresa">${d.empresa||'—'}</td>
      <td class="td-nombre">${nombre||'—'}</td>
      <td class="td-eco">${trab}</td>
      <td class="td-eco">${eco}</td>
      <td>${ias}</td>
      <td>${nivel}</td>
      <td style="font-size:11px;color:#777">${areas}</td>
    </tr>`;
  }).join('');
}

function selectRow(id) {
  selectedId = id;
  renderTable();
  const d = allData.find(x => x.id === id);
  if (!d) return;
  const panel = document.getElementById('side-panel');
  panel.classList.add('open');
  const fecha = new Date(d.created_at).toLocaleString('es-CL');
  const gratis = d.herramientas_gratis || [];
  const emp = d.herramientas_empresa || [];
  const per = d.herramientas_personal || [];
  const pagoSD = (d.herramientas_pago || []).filter(h => !emp.includes(h) && !per.includes(h));
  const sinIA = (d.herramientas_ia||[]).length === 1 && d.herramientas_ia[0] === 'ninguna';
  const grupo = (titulo, arr, cls) => arr.length
    ? `<div class="detail-chips" style="margin-bottom:6px"><span class="detail-key" style="width:100%">${titulo}</span>${arr.map(h=>`<span class="chip${cls}">${IA_L[h]||h}</span>`).join('')}</div>`
    : '';
  const toolsBlock = sinIA
    ? `<div class="detail-chips"><span class="chip">Ninguna aún</span></div>`
    : (grupo('Versión gratis', gratis, '') +
       grupo('De pago · la paga la empresa', emp, '') +
       grupo('De pago · la paga la persona', per, ' gold') +
       grupo('De pago', pagoSD, '')) ||
      `<div class="detail-chips">${(d.herramientas_ia||[]).map(h=>`<span class="chip">${IA_L[h]||h}</span>`).join('')||'—'}</div>`;

  // Bloque de chips para un campo array, solo si tiene datos
  const chips = (titulo, arr, dict, cls) => (arr||[]).length
    ? `<div class="detail-row"><div class="detail-key">${titulo}</div>
       <div class="detail-chips">${arr.map(v=>`<span class="chip${cls||''}">${dict[v]||v}</span>`).join('')}</div></div>`
    : '';
  // Preguntas propias del clon de un cliente
  const extra = d.respuestas_extra || {};
  const extraRows = Object.keys(extra).map(k => {
    const v = Array.isArray(extra[k]) ? extra[k].join(', ') : extra[k];
    return row(k.replace(/_/g,' ').replace(/^./, c=>c.toUpperCase()), v);
  }).join('');

  document.getElementById('side-body').innerHTML = `
    ${row('Empresa', d.empresa)}
    ${row('Nombre y cargo', d.nombre_contacto)}
    ${row('Área de trabajo', TRAB_L[d.area_trabajo]||d.area_trabajo)}
    ${d.variante ? row('Formulario', d.variante) : ''}
    ${row('Correo', MAIL_L[d.plataforma_mail]||d.plataforma_mail)}
    ${row('Repositorio', REPO_L[d.repositorio]||d.repositorio)}
    ${row('Cuánto usa la IA', NIVEL_L[d.nivel_equipo]||d.nivel_equipo)}
    ${chips('Para qué usa la IA', d.usos_ia, USOS_L)}
    <div class="detail-row">
      <div class="detail-key">Herramientas IA</div>
      ${toolsBlock}
    </div>
    ${d.quiere_capacitacion ? row('¿Quiere capacitarse?', CAP_L[d.quiere_capacitacion]||d.quiere_capacitacion) : ''}
    ${chips('Quiere aprender', d.areas_aprender, APR_L, ' gold')}
    ${chips('Temores', d.temores, TEM_L)}
    ${extraRows}
    ${d.reuniones ? row('Reuniones (histórico)', REUN_L[d.reuniones]||d.reuniones) : ''}
    ${d.resistencias ? row('Apertura a la IA (histórico)', RES_L[d.resistencias]||d.resistencias) : ''}
    ${chips('Áreas de interés (histórico)', d.areas_interes, AREA_L)}
    ${d.comentario ? `<div class="detail-row"><div class="detail-key">Comentarios</div><div class="detail-comment">${d.comentario}</div></div>` : ''}
    <div class="detail-date">${fecha}</div>`;
}

function row(k,v) { return `<div class="detail-row"><div class="detail-key">${k}</div><div class="detail-val">${v||'—'}</div></div>`; }
function closeSide() { selectedId=null; document.getElementById('side-panel').classList.remove('open'); renderTable(); }

function exportCSV() {
  const cols = ['fecha','empresa','variante','nombre_contacto','area_trabajo','plataforma_mail','repositorio',
    'nivel_equipo','usos_ia','herramientas_ia','herramientas_gratis','herramientas_pago','herramientas_empresa','herramientas_personal',
    'quiere_capacitacion','areas_aprender','temores','comentario','respuestas_extra',
    'reuniones_hist','areas_interes_hist','resistencias_hist'];
  const rows = filtered().map(d => [
    new Date(d.created_at).toLocaleDateString('es-CL'),
    d.empresa, d.variante, d.nombre_contacto, d.area_trabajo, d.plataforma_mail, d.repositorio,
    d.nivel_equipo, (d.usos_ia||[]).join('|'),
    (d.herramientas_ia||[]).join('|'), (d.herramientas_gratis||[]).join('|'), (d.herramientas_pago||[]).join('|'),
    (d.herramientas_empresa||[]).join('|'), (d.herramientas_personal||[]).join('|'),
    d.quiere_capacitacion, (d.areas_aprender||[]).join('|'), (d.temores||[]).join('|'),
    d.comentario||'', d.respuestas_extra ? JSON.stringify(d.respuestas_extra) : '',
    d.reuniones, (d.areas_interes||[]).join('|'), d.resistencias
  ].map(v=>`"${String(v==null?'':v).replace(/"/g,'""')}"`).join(','));
  const csv = [cols.join(','),...rows].join('\n');
  const emp = document.getElementById('empresa-filter').value;
  const slug = emp ? '-' + emp.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') : '';
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8;'}));
  a.download = `diagnosticos${slug}-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}

// Escapa texto para atributos HTML
function esc(s) { return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// Auto-refresh en vivo: recarga datos cada 15s sin perder filtro ni fila abierta
let refreshTimer = null;
function startAutoRefresh() {
  if (refreshTimer) return;
  refreshTimer = setInterval(() => {
    if (document.hidden) return;
    loadData();
  }, 15000);
}

// Init
if (sessionStorage.getItem('diag_auth') === '1') showDashboard();
</script>
